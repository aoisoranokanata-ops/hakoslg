<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="箱庭SLG">
<title>箱庭クロニクル</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"箱庭クロニクル","short_name":"箱庭SLG","display":"standalone","start_url":".","background_color":"%23141821","theme_color":"%23141821"}'>
<style>
/* =====================================================================
 * スタイル方針: ダークテーマ / モバイル最優先 / 装飾は最小限
 * 色はCSS変数に集約。後からテーマ調整する場合はここだけ触る。
 * ===================================================================*/
:root{
  --bg:#141821; --bg2:#1c222e; --bg3:#252d3d; --line:#333d52;
  --fg:#e8ecf4; --fg-dim:#9aa5bb; --accent:#e8b84a; --danger:#e06060;
  --n:#8b95a8; --r:#5aa0e0; --sr:#b070e0; --ssr:#e8b84a; --ur:#ff78b4;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;cursor:pointer}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--danger);color:var(--danger)}
select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* ヘッダー資源バー */
#header{display:flex;gap:2px;justify-content:space-around;padding:8px 6px 6px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#header .res{white-space:nowrap}
#header .res b{font-weight:600}

/* 初陣指南バー（チュートリアル中だけヘッダー直下に出る唯一の常駐UI） */
#guideBar{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  background:linear-gradient(90deg,#3a2f10,#2a2416);border-bottom:1px solid var(--accent);
  font-size:12px;color:#f2e2b0}
#guideBar .guide-no{flex-shrink:0;font-weight:700;color:var(--accent)}
#guideBar .guide-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#guideBar .guide-more{flex-shrink:0;color:var(--accent);font-size:16px}
.guide-loop{margin:12px 0 4px;padding:10px;text-align:center;font-weight:700;color:var(--accent);
  background:rgba(232,184,74,.10);border:1px solid var(--accent);border-radius:8px}

/* メイン領域 */
#main{flex:1;overflow:hidden;position:relative}
.tab-page{position:absolute;inset:0;overflow-y:auto;padding:12px;display:none}
.tab-page.active{display:block}
#page-map{padding:0;overflow:hidden}

/* マップ */
#mapWrap{position:absolute;inset:0}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#0e1118}
#mapCtrl{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px}
#mapCtrl button{width:44px;height:44px;font-size:18px;border-radius:10px;background:rgba(37,45,61,.9);position:relative}
#mapCtrl .badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;background:var(--danger);
  color:#fff;border-radius:8px;font-size:10px;line-height:16px;text-align:center;padding:0 3px;font-weight:700}

/* 出来事ログ */
.log-list{max-height:46vh;overflow-y:auto;margin-top:8px;overscroll-behavior:contain}
.log-row{display:flex;gap:8px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px}
.log-row:last-child{border-bottom:none}
.log-time{color:var(--fg-dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.log-text{line-height:1.4;word-break:break-word}
#mapInfo{position:absolute;left:10px;top:10px;background:rgba(20,24,33,.85);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;color:var(--fg-dim);max-width:70%}

/* 下部タブバー */
#tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabbar button{flex:1;border:none;border-radius:0;background:none;padding:9px 0 7px;font-size:11px;color:var(--fg-dim)}
#tabbar button .ico{display:block;font-size:19px;margin-bottom:1px}
#tabbar button.active{color:var(--accent)}
#tabbar button{position:relative}
#tabbar button .badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:15px;height:15px;
  background:var(--danger);color:#fff;border-radius:8px;font-size:9px;line-height:15px;text-align:center;
  padding:0 3px;font-weight:700}

/* 同盟チャット */
.chat-log{height:190px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.chat-msg{font-size:12px;line-height:1.4;word-break:break-word}
.chat-msg .chat-name{font-weight:700;margin-right:6px}
.chat-input-row{display:flex;gap:6px}
.chat-input-row input{flex:1;min-width:0;padding:7px 8px;background:var(--bg3);border:1px solid var(--line);
  border-radius:6px;color:var(--fg);font:inherit}

/* 同盟内事件 */
.panel.incident{border-color:var(--danger);background:linear-gradient(180deg,#2a1e22,var(--bg2))}
.incident-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.incident-actions button{font-size:12px;padding:9px 6px}
.loyalty{display:flex;align-items:center;gap:6px;margin-top:3px}
.loyalty-bar{flex:1;max-width:110px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.loyalty-bar i{display:block;height:100%;border-radius:3px;transition:width .3s}

/* 兵力（負傷兵） */
.troop-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.troop-bar{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.troop-bar i{display:block;height:100%;border-radius:4px;transition:width .3s}

/* 部隊編成 */
.squad-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.squad-tab{flex:1;min-width:96px;font-size:12px;padding:7px 6px;position:relative}
.squad-tab.on{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
.squad-tab.on .dim{color:#5a4410}
.squad-busy{display:block;font-size:9px;color:var(--danger)}
.squad-tab.on .squad-busy{color:#7a2a10}
.unit-card{cursor:pointer;transition:transform .1s}
.unit-card.picked{box-shadow:0 0 0 2px var(--accent) inset}
.unit-card.locked{opacity:.45}
.pick-badge{position:absolute;bottom:4px;right:5px;font-size:9px;font-weight:700;padding:1px 5px;
  border-radius:6px;background:var(--accent);color:#1a1408}
.pick-badge.auto{background:#5a6a80;color:#e8ecf4}
.pick-badge.lock{background:#3a3f4a;color:#9aa5bb}
/* タイル詳細の部隊選択 */
.squad-pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.squad-btn{display:flex;align-items:center;gap:8px;text-align:left;font-size:12px;padding:9px 10px}
.squad-btn.can{border-color:#5aa05a}
.squad-btn.cannot{opacity:.75}
/* 勝てる＆相性有利＝この目標に対する最適解。一目で選べるよう強調する */
.squad-btn.best{border-color:#8fd98f;background:rgba(120,200,120,.16);box-shadow:0 0 0 1px #8fd98f inset}
.squad-eta{margin-left:auto;font-size:11px;color:var(--fg-dim)}
.squad-pow{font-weight:700}
.rel-good{color:#8fd98f;font-size:11px}
.rel-bad{color:#e08080;font-size:11px}

/* 勧誘候補一覧 */
.recruit-row{gap:6px}
.recruit-row button{font-size:12px;padding:7px 9px;white-space:nowrap}

/* 汎用カードUI */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.panel h3{font-size:14px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.dim{color:var(--fg-dim);font-size:12px}
.small{font-size:11px}

/* カード一覧 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.unit-card{background:var(--bg2);border:2px solid var(--n);border-radius:10px;padding:8px;position:relative}
/* アートは正方形。object-fit:cover で切り取られるため、縦長絵を入れると顔が切れる。
   カードアートは 1:1 のバストアップで作る前提（IMAGE_PROMPTS.md §1） */
.unit-card .art{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:var(--bg3);border-radius:6px;margin-bottom:6px;overflow:hidden}
.unit-card .art img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.unit-card .rarity{position:absolute;top:4px;right:6px;font-size:11px;font-weight:700}
.unit-card.rar-N{border-color:var(--n)} .unit-card.rar-N .rarity{color:var(--n)}
.unit-card.rar-R{border-color:var(--r)} .unit-card.rar-R .rarity{color:var(--r)}
.unit-card.rar-SR{border-color:var(--sr)} .unit-card.rar-SR .rarity{color:var(--sr)}
.unit-card.rar-SSR{border-color:var(--ssr);box-shadow:0 0 8px rgba(232,184,74,.35)} .unit-card.rar-SSR .rarity{color:var(--ssr)}
.unit-card.rar-UR{border-color:var(--ur);box-shadow:0 0 12px rgba(255,120,180,.5)} .unit-card.rar-UR .rarity{color:var(--ur)}
.card-stars{font-size:10px;letter-spacing:-1px;color:var(--accent)}

/* ボトムシート（タイル詳細） */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:14px 16px calc(14px + var(--safe-b));transform:translateY(105%);
  transition:transform .18s ease;z-index:30;max-height:60%;overflow-y:auto}
#sheet.open{transform:translateY(0)}
#sheet .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast .msg{background:rgba(20,24,33,.94);border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  font-size:13px;animation:fadein .2s;max-width:100%}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ガチャ結果 */
#gachaResult .card-grid{margin-top:8px}
.rate-table{width:100%;font-size:12px;color:var(--fg-dim)}
.rate-table td{padding:2px 6px}

/* 勝利バナー */
#winBanner{display:none;background:linear-gradient(90deg,#3a2f10,#5a4413);border:1px solid var(--accent);
  color:var(--accent);text-align:center;padding:8px;font-weight:700}
#winBanner.show{display:block}

/* 城の箱庭ビュー */
.city-plot{position:relative;width:100%;height:300px;overflow:hidden;touch-action:pan-y;
  background:radial-gradient(circle at 50% 42%,#2f4030,#20291f 72%);}
.city-plot::before{content:"";position:absolute;inset:0;pointer-events:none;border:9px solid #39352d;
  box-shadow:inset 0 0 0 2px #4c463b, inset 0 0 26px rgba(0,0,0,.55);}
.city-plot::after{content:"";position:absolute;inset:9px;pointer-events:none;opacity:.12;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:calc((100% - 0px)/6) calc((100% - 0px)/5);}
.bld{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;cursor:grab;touch-action:none;z-index:1;transition:left .12s ease,top .12s ease}
.bld.dragging{cursor:grabbing;transition:none;z-index:6;filter:drop-shadow(0 5px 7px rgba(0,0,0,.6))}
.bld .bld-icon{width:48px;height:48px;font-size:30px;line-height:1;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(#3a4152,#2a3040);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.bld .bld-icon img{width:100%;height:100%;object-fit:cover}
.bld .bld-plat{position:absolute;bottom:4px;width:52px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.4);z-index:-1;filter:blur(1px)}
.bld .bld-flags{height:11px;font-size:9px;letter-spacing:-1px;color:var(--accent);text-shadow:0 1px 2px #000}
.bld .bld-lv{font-size:10px;font-weight:700;background:rgba(20,24,33,.88);border:1px solid var(--line);
  border-radius:6px;padding:0 5px;color:var(--fg)}
.bld .bld-status{min-height:11px;font-size:9px;color:var(--accent)}
/* 外観ティア（レベルで育つ） */
.bld.tier-2 .bld-icon{width:54px;height:54px;font-size:34px;border-color:#6b7488;
  background:linear-gradient(#454e63,#333b4d)}
.bld.tier-3 .bld-icon{width:60px;height:60px;font-size:38px;border-color:var(--accent);
  background:linear-gradient(#5a5230,#3a3420);box-shadow:0 0 10px rgba(232,184,74,.45)}
.bld.big .bld-icon{width:58px;height:58px;font-size:40px}
.bld.big.tier-2 .bld-icon{width:66px;height:66px;font-size:46px}
.bld.big.tier-3 .bld-icon{width:74px;height:74px;font-size:52px}
.bld.upgrading .bld-icon{animation:bldpulse 1s infinite}
@keyframes bldpulse{0%,100%{filter:none}50%{filter:brightness(1.45)}}
</style>
</head>
<body>

<header id="header"></header>
<div id="guideBar" style="display:none" onclick="UIA.guideOpen()"></div>
<div id="winBanner">⛩️ 聖地制圧！ 天下統一まであと一歩 ⛩️</div>

<main id="main">
  <!-- ▼ マップ -->
  <section class="tab-page active" id="page-map">
    <div id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div id="mapInfo">読み込み中…</div>
      <div id="mapCtrl">
        <button id="logBtn">📜<span class="badge" id="mapCtrlBadge" style="display:none"></span></button>
        <button id="zoomIn">＋</button>
        <button id="zoomOut">－</button>
        <button id="zoomHome">🏯</button>
      </div>
    </div>
  </section>
  <!-- ▼ 城（内政） -->
  <section class="tab-page" id="page-city"></section>
  <!-- ▼ カード -->
  <section class="tab-page" id="page-cards"></section>
  <!-- ▼ ガチャ -->
  <section class="tab-page" id="page-gacha"></section>
  <!-- ▼ 同盟 -->
  <section class="tab-page" id="page-alliance"></section>
</main>

<nav id="tabbar">
  <button data-tab="map" class="active"><span class="ico">🗺️</span>マップ<span class="badge" id="mapBadge" style="display:none"></span></button>
  <button data-tab="city"><span class="ico">🏯</span>城</button>
  <button data-tab="cards"><span class="ico">🎴</span>カード</button>
  <button data-tab="gacha"><span class="ico">💎</span>ガチャ</button>
  <button data-tab="alliance"><span class="ico">🤝</span>同盟<span class="badge" id="chatBadge" style="display:none"></span></button>
</nav>

<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
 * 箱庭クロニクル — 単一HTML箱庭SLG（土台実装）
 *
 * コード全体はセクション [S01]〜[S16] に分割。検索は「[Sxx]」で。
 *   [S01] CONFIG            — 全バランス定数（調整はここだけ）
 *   [S02] STATIC DEFS       — 建物/カード/役職/AI名 の静的定義
 *   [S03] UTILS             — 汎用ヘルパー
 *   [S04] PERSISTENCE       — localStorage セーブ + IndexedDB 画像
 *   [S05] WORLD GEN         — マップ生成・AI配置
 *   [S06] STATE INIT        — セーブデータのスキーマ定義と初期化
 *   [S07] ECONOMY           — 資源/ダイヤ生産・オフライン精算
 *   [S08] BUILDINGS         — アップグレード
 *   [S09] MILITARY          — 戦力計算・出兵・制圧・放棄
 *   [S10] GACHA             — 排出・天井
 *   [S11] ALLIANCE          — 勧誘・役職・バフ
 *   [S12] AI USERS          — ルールベースAIの状態機械
 *   [S13] UI: PANELS        — 各タブのDOM描画
 *   [S14] UI: MAP CANVAS    — マップ描画・パン/ズーム/タップ
 *   [S15] UI: ACTIONS       — ボタンから呼ばれる操作(UIA.*)
 *   [S15A] TUTORIAL GUIDE   — 初陣指南（最初の約1分でコアループを1周させる導線）
 *   [S16] GAME LOOP & BOOT  — tick / autosave / 起動処理
 *   [S17] UI: CITY PLOT     — 城タブの箱庭ビュー（ドラッグ配置・タップ強化）
 *   [S18] ALLIANCE CHAT     — 同盟チャット（ルールベース再生 / Grok作セリフ）
 *   [S19] ALLIANCE INCIDENTS— 同盟内事件（忠誠低下→不満→なだめ/任命/放置/追放）
 *   [S20] EVENT LOG         — 出来事ログ（トーストを見逃しても後から読める）
 *
 * 設計原則:
 *  - 可変状態はグローバル `S` 1個のみ。S をJSON化したものがセーブデータ。
 *  - 静的定義（BUILDING_DEFS等）はセーブに含めない。S には id/level 等の最小情報のみ。
 *  - 派生値（生産量・コスト・戦力）は毎回計算する。キャッシュしない。
 *  - 時刻はすべて Date.now() のエポックms絶対値で持つ（オフライン跨ぎ対応）。
 * ===================================================================*/

/* =====================================================================
 * [S01] CONFIG — 全バランス定数
 * ===================================================================*/
const CONFIG = {
  DEV_MODE: false,                      // trueで開発用UI（ガチャタブの画像取り込み等）を表示
  SAVE_KEY: "hakoslg_save_v1",          // localStorageキー（名前空間 hakoslg_）
  ASSET_DB: "hakoslg_assets",           // IndexedDB名（画像アセット）
  SAVE_VERSION: 10,                    // v10: 旧ワールドを地形ワールドV2へ安全に再生成
  LOG_MAX: 30,                         // 保持する出来事ログの最大件数

  // --- 初陣指南（[S15A]。最初の約1分でコアループを1周させる導線） ---
  TUTORIAL_VERSION: 1,                 // 初陣指南の仕様版
  TUTORIAL_FIRST_TILE_COUNT: 1,        // 第一目標の領地数
  TUTORIAL_CASTLE_TARGET_LV: 2,        // 本城の目標レベル
  TUTORIAL_BARRACKS_TARGET_LV: 2,      // 兵舎の目標レベル
  TUTORIAL_GACHA_COUNT: 10,            // 教えるガチャの単位（10連）
  TUTORIAL_FINAL_TILE_COUNT: 2,        // 指南の終了条件となる領地数
  TUTORIAL_START_RESOURCE_TYPE: "food",// 自城の8近傍に資源地が無い時の保証用タイル種別
  // 指南中はマップの高度な表示（目標コンパス／外交バッジ／記録ボタン）を抑えて
  // 目の前の手順に集中させる。※タブや機能自体はロックしない（指南の設計方針）
  TUTORIAL_HIDE_ADVANCED_UI: true,

  // --- 同盟チャット（Grok作セリフプールをルールベース再生。[S18]） ---
  CHAT_MAX_MESSAGES: 60,               // 保持する最大ログ数
  CHAT_AMBIENT_MIN_SEC: 25,            // 環境チャット間隔の下限（秒）
  CHAT_AMBIENT_MAX_SEC: 70,            // 環境チャット間隔の上限（秒）

  // --- 同盟内事件（[S19]。忠誠が下がったAIが不満を訴える） ---
  LOYALTY_START: 70,                   // 加入時の忠誠度（0〜100）
  LOYALTY_MAX: 100,
  INCIDENT_CHECK_MIN_SEC: 100,         // 忠誠チェック間隔の下限（秒）
  INCIDENT_CHECK_MAX_SEC: 220,         // 同上限
  LOYALTY_DECAY_NO_ROLE: 8,            // チェックごとの忠誠低下（役職なし＝不満が溜まりやすい）
  LOYALTY_DECAY_WITH_ROLE: 3,          // 同（役職あり）

/**
 * 兵種。5種が一本の輪で循環し、兵器だけが輪の外の特殊枠になる。
 *   歩兵 → 槍兵 → 騎兵 → 弓兵 → 楯兵 → 歩兵
 *   （strong に指定した相手に有利／自分を strong と指す相手には不利）
 * 兵器(siege)は野戦では相性を持たないが、関所・皇都・城といった要塞に特効を持つ。
 * speed は行軍速度の倍率。部隊の速度は「最も遅い兵種」に合わせる（軍は鈍足に律速される）。
 */
const TROOP_DEFS = {
  infantry: { name: "歩兵", emoji: "🛡️", color: "#8fa8c8", strong: "spear",    speed: 1.0 },
  spear:    { name: "槍兵", emoji: "🔱", color: "#c8c08f", strong: "cavalry",  speed: 0.9 },
  cavalry:  { name: "騎兵", emoji: "🐎", color: "#c8a06a", strong: "archer",   speed: 1.7 },
  archer:   { name: "弓兵", emoji: "🏹", color: "#9ac88f", strong: "shield",   speed: 1.0 },
  shield:   { name: "楯兵", emoji: "🛡", color: "#a0a0b8", strong: "infantry", speed: 0.75 },
  // 兵器＝カタパルト。城攻めに強く、後方から遠くを叩けるが、脆く消耗が激しい
  siege:    { name: "兵器", emoji: "🏗️", color: "#c88f8f", strong: null,       speed: 0.45,
              fortress: true,      // 要塞（関所/皇都/城/聖地）に対してのみ特効
              range: 2,            // 後方攻撃: 自領から2歩先まで届く（未所有の要衝は飛び越えられない）
              casualtyMult: 1.6 }, // 防御が低く消耗しやすい
};
const TROOP_KEYS = Object.keys(TROOP_DEFS);
/* タイルの守備兵種に使う兵種。兵器は輪の外＝これを守備に置くと「有利な兵種」が
 * 存在せず攻略法を示せなくなるため、守備側からは除外する（兵器は攻める側の特殊枠）。 */
const DEFENDER_TROOPS = TROOP_KEYS.filter(k => k !== "siege");
/** 要塞タイル（兵器の特効対象）か */
const FORTRESS_TYPES = ["gate", "capital", "castle", "holy"];
/**
 * 攻撃側兵種 vs 守備側兵種 の倍率（どちらか未設定なら等倍）。
 * tileType を渡すと兵器の攻城特効も加味する。
 */
function troopMultiplier(atkTroop, defTroop, tileType) {
  let mult = 1;
  if (atkTroop === "siege" && tileType && FORTRESS_TYPES.includes(tileType)) {
    mult *= CONFIG.TROOP_SIEGE_VS_FORTRESS;         // 攻城兵器は要塞に強い
  } else if (atkTroop === "siege" && tileType) {
    mult *= CONFIG.TROOP_SIEGE_VS_FIELD;            // 野戦では鈍重で不利
  }
  if (!atkTroop || !defTroop) return mult;
  if (TROOP_DEFS[atkTroop] && TROOP_DEFS[atkTroop].strong === defTroop) mult *= CONFIG.TROOP_ADVANTAGE;
  else if (TROOP_DEFS[defTroop] && TROOP_DEFS[defTroop].strong === atkTroop) mult *= CONFIG.TROOP_DISADVANTAGE;
  return Math.round(mult * 100) / 100;
}

/** 数値表示: 1234→1,234 / 56789→56.8k / 1234567→1.23M */
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "k";
  return n.toLocaleString();
}
/** 秒数表示: 90→"1分30秒" */
function fmtSec(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + "秒";
  if (sec < 3600) return Math.floor(sec / 60) + "分" + (sec % 60 ? sec % 60 + "秒" : "");
  return Math.floor(sec / 3600) + "時間" + Math.floor((sec % 3600) / 60) + "分";
}
/** コストオブジェクト {food:100,...} → "🌾100 🪵50" */
function fmtCost(cost) {
  return Object.entries(cost).map(([k, v]) => RES_DEFS[k].emoji + fmt(v)).join(" ");
}
/**
 * 画面下部に一時メッセージを出す。
 * kind を渡すと出来事ログ([S20])にも残り、トーストが消えた後から読み返せる。
 * kind 省略時は即時フィードバック（操作エラー等）とみなしログには残さない。
 */
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "msg";
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), 3200);
  if (kind) logEvent(kind, msg);
}
/** innerHTML に差し込む前のHTMLエスケープ（プレイヤー入力の混入対策） */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function saveGame() {
  try {

    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(S));
  } catch (e) { console.error("save failed", e); }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return migrateSave(data);
  } catch (e) { console.error("load failed", e); return null; }
}
/** 旧セーブを現行スキーマへ移行（欠損フィールドの補完のみ・非破壊）。 */
function migrateSave(data) {
  if (!data || !data.player) return data;
  // v1 → v2: 建物に城内配置座標 {x,y} を付与
  for (const b of data.player.buildings) {
    if (b.x == null || b.y == null) {
      const p = DEFAULT_BUILDING_LAYOUT[b.type] || { x: 0, y: 0 };
      b.x = p.x; b.y = p.y;
    }
  }
  // v2 → v3: 同盟チャットログを付与
  if (!data.chat) data.chat = { messages: [], nextAmbientAt: 0, unseen: 0 };
  // v3 → v4: AIに忠誠度、同盟内事件の枠を付与
  for (const ai of (data.aiUsers || [])) {
    if (ai.loyalty == null) ai.loyalty = CONFIG.LOYALTY_START;
  }
  if (data.incident === undefined) data.incident = null;
  if (data.nextIncidentCheckAt == null) data.nextIncidentCheckAt = 0;
  // v4 → v5: 出来事ログ
  if (!data.log) data.log = [];
  if (data.logUnseen == null) data.logUnseen = 0;
  // v5 → v6: 初陣指南。すでに遊んでいる旧セーブには今さら指南を出さない（完了扱いにする）
  if (!data.tutorial) {
    const p = data.player;
    const pristine = (p.ownedTiles || []).length === 0
      && ((p.gacha && p.gacha.total) || 0) === 0
      && (p.buildings || []).every(b => b.level === 1);
    data.tutorial = pristine
      ? { version: CONFIG.TUTORIAL_VERSION, introSeen: false, didTenPull: false, completedAt: null }
      : { version: CONFIG.TUTORIAL_VERSION, introSeen: true,
          didTenPull: ((p.gacha && p.gacha.total) || 0) >= CONFIG.TUTORIAL_GACHA_COUNT, completedAt: now() };
  }
  // v6 → v7: 地形ワールドの導入。既存ワールドは旧ルールのまま遊べるようにし、tiles[] には一切触らない
  if (data.world && data.world.version == null) {
    data.world.version = 1;
    data.world.ruleset = "legacy_v1";
    data.world.playerStart = { x: CENTER, y: CENTER }; // 旧ワールドの本城は中心
    data.world.capitalIdx = null;
  }
  if (data.flags && data.flags.capitalWon == null) data.flags.capitalWon = false;
  for (const ai of (data.aiUsers || [])) if (ai.regionId === undefined) ai.regionId = null;
  // v7 → v8: 部隊編成。既存プレイヤーは第一隊が空の状態で始まり、
  // 出撃時に自動編成（従来と同じ「戦力上位N枚」）で埋まるため体験は変わらない
  if (!data.player.squads) data.player.squads = [{ id: "sq_1", name: "第一隊", cardUids: [] }];
  for (const m of (data.player.marches || [])) if (!m.squadId) m.squadId = "sq_1";
  // v8 → v9: 兵力・予備兵・徴兵所。
  // troops は -1（未初期化）にしておき、初回参照時に満タンで初期化する。
  // マイグレーション時点では編成や兵舎レベルが揃っていない可能性があるため遅延させる。
  for (const sq of data.player.squads) if (sq.troops == null) sq.troops = -1;
  if (data.player.reserves == null) data.player.reserves = 0;
  if (!data.player.buildings.some(b => b.type === "camp")) {
    const p = DEFAULT_BUILDING_LAYOUT.camp;
    data.player.buildings.push({ id: "b_camp", type: "camp", level: 1, upgradeEndsAt: null, x: p.x, y: p.y });
  }

  // v9 → v10: 地形ワールドV2を既存セーブにも適用する。
  // 旧実装は world.version=1 / legacy_v1 を保持して tiles[] を更新しなかったため、
  // GitHub Pagesを更新しても既存ブラウザでは旧マップが永続的に表示されていた。
  // 建物・資源・カード・同盟などの進行は保持し、旧座標に依存する領地/進軍だけをリセットする。
  const worldNeedsTerrainUpgrade = !data.world
    || (data.world.version || 1) < CONFIG.WORLD_LAYOUT_VERSION
    || data.world.ruleset !== CONFIG.WORLD_RULESET;
  if (worldNeedsTerrainUpgrade) {
    const oldAiById = Object.fromEntries((data.aiUsers || []).map(ai => [ai.id, ai]));
    const newWorld = generateWorld();
    const newAiUsers = generateAIUsers(newWorld);

    // AIの育成・同盟状態はID単位で可能な範囲を引き継ぐ。位置と領地は新地形に合わせて再生成。
    for (const ai of newAiUsers) {
      const old = oldAiById[ai.id];
      if (!old) continue;
      ai.castleLevel = old.castleLevel || ai.castleLevel;
      ai.personality = old.personality || ai.personality;
      if (old.recruitable != null) ai.recruitable = old.recruitable;
      ai.allianceId = old.allianceId || null;
      ai.nextRecruitAt = old.nextRecruitAt || 0;
      ai.loyalty = old.loyalty == null ? CONFIG.LOYALTY_START : old.loyalty;
      ai.ownedTiles = [];
      const castleTile = newWorld.tiles[idx(ai.x, ai.y)];
      if (castleTile) castleTile.level = ai.castleLevel;
    }

    // プレイヤー本城の表示Lvは内政側の本城Lvに合わせる。
    const castleBuilding = (data.player.buildings || []).find(b => b.type === "castle");
    const playerCastleLv = castleBuilding ? castleBuilding.level : (data.player.castleLevel || 1);
    const ps = newWorld.playerStart;
    const playerCastleTile = newWorld.tiles[idx(ps.x, ps.y)];
    if (playerCastleTile) playerCastleTile.level = playerCastleLv;

    data.world = newWorld;
    data.aiUsers = newAiUsers;
    data.player.ownedTiles = [];
    data.player.marches = [];
    if (!data.flags) data.flags = {};
    data.flags.holyWon = false;
    data.flags.capitalWon = false;
    data.incident = null;
    data.nextIncidentCheckAt = 0;

    // 移行が済んだことをログへ残す（トーストはboot前なのでここでは出さない）。
    if (!data.log) data.log = [];
    data.log.push({ id: uid("log"), ts: now(), kind: "world", text: "🗺️ 地形ワールドV2へ更新しました（山・川・埠頭・関所・皇都を追加）" });
    if (data.log.length > CONFIG.LOG_MAX) data.log = data.log.slice(-CONFIG.LOG_MAX);
  }

  data.version = CONFIG.SAVE_VERSION;
  return data;
}

const AssetDB = {
  db: null,
  open() {
    return new Promise(resolve => {
      const req = indexedDB.open(CONFIG.ASSET_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore("images");
      req.onsuccess = () => { AssetDB.db = req.result; resolve(true); };
      req.onerror = () => { console.warn("IndexedDB unavailable"); resolve(false); };
    });
  },
  put(key, blob) {
    return new Promise((resolve, reject) => {
      if (!AssetDB.db) return reject("no db");
      const tx = AssetDB.db.transaction("images", "readwrite");
      tx.objectStore("images").put(blob, key);
      tx.oncomplete = () => { ASSET_URLS[key] = URL.createObjectURL(blob); resolve(); };
      tx.onerror = () => reject(tx.error);
    });
  },
  loadAll() {
    return new Promise(resolve => {
      if (!AssetDB.db) return resolve();
      const tx = AssetDB.db.transaction("images", "readonly");
      const store = tx.objectStore("images");
      const req = store.openCursor();
      req.onsuccess = () => {
        const cur = req.result;
        if (cur) { ASSET_URLS[cur.key] = URL.createObjectURL(cur.value); cur.continue(); }
        else resolve();
      };
      req.onerror = () => resolve();
    });
  },
};
/** imageKey に対応する <img> か絵文字プレースホルダーのHTMLを返す */
function artHTML(imageKey, emoji) {
  const src = ASSET_URLS[imageKey] || ART_DATA[imageKey]; // 取り込み優先 > 同梱 > 絵文字
  return src ? `<img src="${src}" alt="">` : (emoji || "❔");
}
/**
 * 建物の外観ティアに応じた imageKey を返す。
 * キー体系: 基本 "bld_castle" / ティア2 "bld_castle_t2" / ティア3 "bld_castle_t3"。
 * 現ティアのアートが無ければ下位ティアへ、最終的に基本キーへフォールバック
 * （＝ティア用アート未配置でも基本アートで安全に描画される）。
 */
function artTierKey(baseKey, level) {
  for (let t = buildingTier(level); t >= 2; t--) {
    const k = baseKey + "_t" + t;
    if (ASSET_URLS[k] || ART_DATA[k]) return k;
  }
  return baseKey;
}

/* =====================================================================
 * [S05] WORLD GEN — マップ生成・AI配置
 * ===================================================================*/
const SIZE = CONFIG.WORLD_SIZE;
const idx = (x, y) => y * SIZE + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < SIZE && y < SIZE;
const chebyshev = (x1, y1, x2, y2) => Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2));
const CENTER = Math.floor(SIZE / 2); // 旧ワールドのプレイヤー本城座標 (20,20)

/** プレイヤー本城の座標。旧ワールドは(20,20)、地形ワールドは world.playerStart */
function getPlayerStart() {
  const ps = S && S.world && S.world.playerStart;
  return ps ? ps : { x: CENTER, y: CENTER };
}
/** プレイヤー本城のタイルindex */
function playerStartIdx() { const p = getPlayerStart(); return idx(p.x, p.y); }

/** 2点を結ぶ直線上のセル列（ブレゼンハム） */
function lineCells(x0, y0, x1, y1) {
  const cells = [];
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (let guard = 0; guard < 4000; guard++) {
    cells.push([x, y]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return cells;
}

/**
 * World.tiles を生成（地形ワールド v2）。tile = { x, y, type, level, ownerId }
 *
 * 「固定骨格＋ランダム資源」方式:
 *   - 山脈・大河・埠頭・関所・皇都州・開始地点は毎回同じ（地政学を保証する）
 *   - 資源の種類と配置、同帯域内のLv差、AI城の細かい位置はランダム
 * 完全ランダムだと「関所を無視して横から回り込める」事故が必ず起きるため。
 *
 * 地勢:
 *   北西 ←(埠頭)→ 北東   … 縦の大河 x=20,y=0..15 で分断
 *   北西 ←(関所)→ 南方   … 南西へ走る山脈で分断
 *   北東 ←(埠頭)→ 南方   … 南東へ走る大河で分断
 *   中央の皇都州へは 北西関/北東関/南関 の3つの入口のみ
 */
function generateWorld() {
  const PS = { x: CONFIG.PLAYER_START_X, y: CONFIG.PLAYER_START_Y };
  const CX = CONFIG.CAPITAL_X, CY = CONFIG.CAPITAL_Y;
  const tiles = [];
  // 1) ベース: プレイヤー本城からの距離帯でLv1〜5、資源はランダム
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const d = chebyshev(x, y, PS.x, PS.y);
      const level = clamp(Math.floor(d / CONFIG.LEVEL_BAND) + 1, 1, 5);
      const type = Math.random() < CONFIG.RESOURCE_TILE_RATIO ? pick(RES_KEYS) : "empty";
      tiles.push({ x, y, type, level, ownerId: null });
    }
  }
  const put = (x, y, type, level) => {
    if (!inBounds(x, y)) return;
    const t = tiles[idx(x, y)];
    t.type = type;
    if (level != null) t.level = level;
  };
  // 山河は横に2セル分の厚みを持たせる。斜め移動は canStepBetween が角抜けを禁じるため、
  // この厚みで確実に通行を遮断できる。
  const stampLine = (x0, y0, x1, y1, type) => {
    for (const [x, y] of lineCells(x0, y0, x1, y1)) { put(x, y, type); put(x + 1, y, type); }
  };

  // 2) 北西と北東を分ける縦の大河（埠頭1箇所のみ渡河可）
  for (let y = 0; y <= 15; y++) { put(20, y, "river"); put(21, y, "river"); }
  put(20, 8, "port", CONFIG.PORT_LEVEL); put(21, 8, "port", CONFIG.PORT_LEVEL);

  // 3) 皇都州の外郭（x16..23 / y16..23 の枠）を山にし、入口を3つの関所だけにする
  for (let x = 16; x <= 23; x++) { put(x, 16, "mountain"); put(x, 23, "mountain"); }
  for (let y = 16; y <= 23; y++) { put(16, y, "mountain"); put(23, y, "mountain"); }
  put(16, 19, "gate", CONFIG.GATE_LEVEL);  // 北西関
  put(23, 19, "gate", CONFIG.GATE_LEVEL);  // 北東関
  put(20, 23, "gate", CONFIG.GATE_LEVEL);  // 南関

  // 4) 皇都州の内部（6×6）。中心が皇都、Lv8〜10の資源を12枚（4種を最低2枚ずつ）
  const inner = [];
  for (let y = 17; y <= 22; y++) for (let x = 17; x <= 22; x++) {
    put(x, y, "empty", CONFIG.CAPITAL_RESOURCE_MIN_LV);
    if (!(x === CX && y === CY)) inner.push([x, y]);
  }
  const picks = [];
  for (const k of RES_KEYS) picks.push(k, k);              // 各種2枚を保証
  while (picks.length < CONFIG.CAPITAL_RESOURCE_COUNT) picks.push(pick(RES_KEYS));
  for (let i = inner.length - 1; i > 0; i--) {             // シャッフルして配置先を決める
    const j = randInt(0, i); const t = inner[i]; inner[i] = inner[j]; inner[j] = t;
  }
  picks.forEach((k, i) => {
    const cell = inner[i]; if (!cell) return;
    put(cell[0], cell[1], k, randInt(CONFIG.CAPITAL_RESOURCE_MIN_LV, CONFIG.CAPITAL_RESOURCE_MAX_LV));
  });
  put(CX, CY, "capital", CONFIG.CAPITAL_LEVEL);

  // 5) 北西と南方を分ける山脈（途中の関所だけが通れる）
  stampLine(15, 22, 0, 38, "mountain");
  put(8, 30, "gate", CONFIG.GATE_LEVEL); put(9, 30, "gate", CONFIG.GATE_LEVEL);
  // 6) 北東と南方を分ける大河（途中の埠頭だけが渡れる）
  stampLine(24, 22, 39, 38, "river");
  put(31, 30, "port", CONFIG.PORT_LEVEL); put(32, 30, "port", CONFIG.PORT_LEVEL);

  // 7) 関所の周辺は一段うまみのある土地にする（Lv5〜7）
  for (const [gx, gy] of [[16, 19], [23, 19], [20, 23], [8, 30], [31, 30]]) {
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const t = inBounds(gx + dx, gy + dy) ? tiles[idx(gx + dx, gy + dy)] : null;
      if (t && RES_KEYS.includes(t.type)) t.level = Math.max(t.level, randInt(5, 7));
    }
  }

  // 7.5) 守備兵種。レベル確定後に付ける。序盤(低Lv)は無属性のままにして中盤から
  //      相性を考えさせ、関所・皇都・埠頭は必ず持たせる＝どの部隊で抜くかの判断が生まれる
  for (const t of tiles) {
    if (t.type === "gate" || t.type === "capital" || t.type === "port") t.defTroop = pick(DEFENDER_TROOPS);
    else if (!isBlockedType(t.type) && t.type !== "castle" && t.level >= CONFIG.TILE_TROOP_MIN_LEVEL) {
      t.defTroop = pick(DEFENDER_TROOPS);
    }
  }

  // 8) プレイヤー本城と、初陣指南①が詰まないための隣接Lv1資源地
  put(PS.x, PS.y, "castle", 1);
  tiles[idx(PS.x, PS.y)].ownerId = "player";
  const around = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = PS.x + dx, ny = PS.y + dy;
    if (inBounds(nx, ny) && !isBlockedType(tiles[idx(nx, ny)].type)) around.push(idx(nx, ny));
  }
  if (!around.some(ti => RES_KEYS.includes(tiles[ti].type))) {
    const t = tiles[pick(around)];
    t.type = CONFIG.TUTORIAL_START_RESOURCE_TYPE;
    t.level = 1;
  }
  return {
    version: CONFIG.WORLD_LAYOUT_VERSION,
    ruleset: CONFIG.WORLD_RULESET,
    size: SIZE,
    playerStart: { x: PS.x, y: PS.y },
    capitalIdx: idx(CX, CY),
    tiles,
  };
}

/**
 * 三地方の連結成分を塗る。山・川に加え、埠頭/関所/皇都も壁として扱うので
 * 「境界を越えないと行けない場所」が別地域として分離される。
 * 戻り値: index → "nw" | "ne" | "south" | null
 */
function computeRegionMask(tiles) {
  const isWall = ti => {
    const t = tiles[ti];
    return isBlockedType(t.type) || t.type === "port" || t.type === "gate" || t.type === "capital";
  };
  const mask = new Array(SIZE * SIZE).fill(null);
  const fill = (sx, sy, id) => {
    if (!inBounds(sx, sy)) return;
    const start = idx(sx, sy);
    if (mask[start] || isWall(start)) return;
    const q = [start]; mask[start] = id;
    while (q.length) {
      const ti = q.pop(), t = tiles[ti];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = t.x + dx, ny = t.y + dy;
        if (!inBounds(nx, ny)) continue;
        const ni = idx(nx, ny);
        if (mask[ni] || isWall(ni)) continue;
        // 斜めの角抜けを禁止（canStepBetween と同じ判定）
        if (dx && dy && (isWall(idx(t.x + dx, t.y)) || isWall(idx(t.x, t.y + dy)))) continue;
        mask[ni] = id; q.push(ni);
      }
    }
  };
  fill(CONFIG.PLAYER_START_X, CONFIG.PLAYER_START_Y, "south");
  fill(5, 5, "nw");
  fill(SIZE - 6, 5, "ne");
  return mask;
}

/** AIUser を生成し、city タイルを world に配置する（地形ワールドは三地方へ 4/4/2 で配分） */
function generateAIUsers(world) {
  const users = [];
  const PS = world.playerStart || { x: CENTER, y: CENTER };
  const mask = computeRegionMask(world.tiles);
  // 地域ごとの配置候補（自城から離れ、城でも特殊地形でもないタイル）
  const cand = { nw: [], ne: [], south: [] };
  for (let i = 0; i < world.tiles.length; i++) {
    const r = mask[i]; if (!r || !cand[r]) continue;
    const t = world.tiles[i];
    if (t.type === "castle" || t.type === "holy") continue;
    if (chebyshev(t.x, t.y, PS.x, PS.y) < CONFIG.AI_MIN_DIST_CENTER) continue;
    cand[r].push(i);
  }
  const plan = [];
  for (const [region, n] of Object.entries(CONFIG.AI_REGION_COUNTS)) {
    for (let k = 0; k < n; k++) plan.push(region);
  }
  for (const region of plan) {
    if (users.length >= CONFIG.AI_COUNT) break;
    const pool = cand[region] || [];
    let placed = false;
    for (let guard = 0; guard < 400 && !placed; guard++) {
      const ti = pick(pool); if (ti == null) break;
      const t = world.tiles[ti];
      const x = t.x, y = t.y;
      if (users.some(u => chebyshev(x, y, u.x, u.y) < CONFIG.AI_MIN_DIST_EACH)) continue;
      placed = true;
      const i = users.length;
      const ai = {
        id: "ai_" + i,
        name: AI_NAMES[i] || "AI" + i,
        color: AI_COLORS[i] || "#888",
        x, y,
        castleLevel: randInt(1, 3),
        personality: pick(["expander", "expander", "balanced", "balanced", "turtle"]),
        recruitable: Math.random() < 0.6,
        allianceId: null,
        ownedTiles: [],          // AIが領有する資源タイルindex（城タイルは含まない）
        nextActionAt: 0,         // 次に行動する絶対時刻(ms)
        nextRecruitAt: 0,        // 勧誘再試行可能時刻(ms)
        loyalty: CONFIG.LOYALTY_START, // 同盟内の忠誠度0-100。加入後に低下し事件の引き金になる([S19])
        regionId: region,        // 所属地方。V1では配置のみで外交的な意味は持たない
      };
      world.tiles[idx(x, y)] = { x, y, type: "castle", level: ai.castleLevel, ownerId: ai.id };
      users.push(ai);
    }
  }
  return users;
}

/* =====================================================================
 * [S06] STATE INIT — セーブデータのスキーマ
 * ===================================================================*/
/**
 * S（＝セーブデータ）の完全スキーマ:
 * {
 *   version: number,            // セーブ形式バージョン（マイグレーション用）
 *   createdAt, lastSavedAt, lastTickAt: number(ms),
 *   world: { size, tiles[] },   // tile = {x,y,type,level,ownerId}
 *   player: {
 *     castleLevel: number,      // buildings内 castle.level のミラー（参照高速化）
 *     buildings: [ {id,type,level,upgradeEndsAt|null, x,y} ], // x,y=城内グリッド座標(配置)
 *     resources: {food,wood,stone,iron},   // 浮動小数。表示はfloor
 *     diamonds: number,         // プレミア通貨。容量キャップなし
 *     ownedTiles: [tileIndex],  // 制圧済みタイル（自城タイルは含まない）
 *     cards: [ {uid,defId,obtainedAt} ],   // ガチャ獲得カード（重複可）
 *     squads: [ {id,name,cardUids[],troops} ], // 出撃部隊([S09])。兵舎Lvで解禁数が増える
 *                                          // cardUidsが空なら出撃時に自動編成で補う
 *                                          // troops=現在兵力（-1は未初期化＝満タンで開始）
 *     reserves: number,                    // 徴兵所の予備兵プール（負傷兵の補充に使う）
 *     allianceId: string,
 *     marches: [ {id,targetIdx,power,departAt,arriveAt} ],
 *     gacha: { sinceSSR, total },          // 天井カウンタ・総回数
 *   },
 *   alliance: { id, name, members:[{id,role}] },  // 現状プレイヤー同盟1つのみ
 *   aiUsers: [ AIUser ],        // スキーマは generateAIUsers 参照
 *   flags: { holyWon: bool },   // 一度きりイベントの発火記録
 *   chat: { messages:[{id,ts,senderId,text}], nextAmbientAt, unseen },  // 同盟チャット([S18])
 *   incident: {id,aiId,kind,createdAt,expiresAt}|null,  // 発生中の同盟内事件([S19])。同時1件
 *   nextIncidentCheckAt: number(ms),                    // 次の忠誠チェック時刻
 *   log: [{id,ts,kind,text}],   // 出来事ログ([S20])。上限 CONFIG.LOG_MAX、古い順に切り捨て
 *   logUnseen: number,          // ログの未読件数（開くと0）
 *   tutorial: { version, introSeen, didTenPull, completedAt },  // 初陣指南([S15A])
 *     // 現在ステップは保存しない（getTutorialStep がゲーム状態から都度算出する）
 * }
 */
function newGameState() {
  const world = generateWorld();
  const aiUsers = generateAIUsers(world);
  const t = now();
  return {
    version: CONFIG.SAVE_VERSION,
    createdAt: t, lastSavedAt: t, lastTickAt: t,
    world,
    player: {
      castleLevel: 1,
      buildings: Object.keys(BUILDING_DEFS).map(type => {
        const p = DEFAULT_BUILDING_LAYOUT[type] || { x: 0, y: 0 };
        return { id: "b_" + type, type, level: 1, upgradeEndsAt: null, x: p.x, y: p.y };
      }),
      resources: { ...CONFIG.START_RESOURCES },
      diamonds: CONFIG.START_DIAMONDS,
      ownedTiles: [],
      cards: [
        { uid: uid("c"), defId: "n_taichi", obtainedAt: t },
        { uid: uid("c"), defId: "n_kosuzu", obtainedAt: t },
      ],
      // 出撃部隊。兵舎レベルで解禁数が増える（[S09]）。空なら自動編成で補われる
      // troops は現在兵力。-1 は未初期化で、初回参照時に最大兵力で満たす
      squads: [{ id: "sq_1", name: "第一隊", cardUids: [], troops: -1 }],
      reserves: 0,               // 徴兵所にプールされた予備兵（負傷兵の補充に使う）
      allianceId: "ally_player",
      marches: [],
      gacha: { sinceSSR: 0, total: 0 },
    },
    alliance: { id: "ally_player", name: "無名同盟", members: [{ id: "player", role: "盟主" }] },
    aiUsers,
    flags: { holyWon: false, capitalWon: false },
    chat: { messages: [], nextAmbientAt: 0, unseen: 0 },
    incident: null,            // 発生中の同盟内事件 {id,aiId,kind,createdAt,expiresAt} or null（同時1件）
    nextIncidentCheckAt: 0,    // 次の忠誠チェック時刻(ms)
    log: [],                   // 出来事ログ [{id,ts,kind,text}]（上限 CONFIG.LOG_MAX）。[S20]
    logUnseen: 0,              // 未読件数（ログを開くと0）
    // 初陣指南([S15A])。現在ステップは保存せず毎回ゲーム状態から算出するため、
    // ここには「一度きりの事実」だけを持つ。
    tutorial: { version: CONFIG.TUTORIAL_VERSION, introSeen: false, didTenPull: false, completedAt: null },
  };
}

let S = null; // グローバル可変状態（唯一）

/* =====================================================================
 * [S07] ECONOMY — 生産・オフライン精算
 * ===================================================================*/
/** 毎時生産量 {food,wood,stone,iron,diamonds} を現在の状態から計算 */
function getProdPerHour() {
  const buffs = getAllianceBuffs();
  const labLv = getBuilding("lab").level;
  const mult = (1 + CONFIG.LAB_PROD_BONUS_PER_LEVEL * labLv) * (buffs.prod || 1);
  const out = { food: 0, wood: 0, stone: 0, iron: 0, diamonds: 0 };
  // 建物生産
  for (const b of S.player.buildings) {
    const def = BUILDING_DEFS[b.type];
    if (def.prodType) out[def.prodType] += def.prodBase * b.level;
  }
  // 領有タイル生産＋ダイヤ
  let tileLevelSum = 0;
  for (const ti of S.player.ownedTiles) {
    const t = S.world.tiles[ti];
    if (RES_KEYS.includes(t.type)) {
      out[t.type] += CONFIG.TILE_PROD_PER_LEVEL_PER_HOUR * t.level;
      tileLevelSum += t.level;
    } else if (t.type === "holy") {
      tileLevelSum += t.level * CONFIG.DIAMOND_HOLY_LEVEL_MULT;
    } else if (t.type === "capital") {
      tileLevelSum += t.level;        // 皇都は等倍（Lv10なら💎60/h）
    } else if (t.type === "empty" || t.type === "port" || t.type === "gate") {
      tileLevelSum += t.level * 0.25; // 空地・要衝は資源を生まない代わり微量のダイヤ
    }
  }
  for (const k of RES_KEYS) out[k] *= mult;
  out.diamonds = tileLevelSum * CONFIG.DIAMOND_PER_TILELEVEL_PER_HOUR;
  return out;
}
/** 倉庫容量（食料/木材/石材/鉄の各上限） */
function getStorageCap() {
  const lv = getBuilding("warehouse").level;
  return Math.floor(CONFIG.WAREHOUSE_CAP_BASE * Math.pow(lv, 1.7));
}
/**
 * 兵力の自然回復と、徴兵所による予備兵の蓄積（tickから呼ぶ）。
 * どちらも dtSec ベースなので、オフライン進行停止と自然に整合する（離席中は増えない）。
 */
function applyTroopRecovery(dtSec) {
  const perMin = dtSec / 60;
  // 兵力の自然回復（遅め。満タンで停止）
  for (const sq of S.player.squads) {
    const max = getSquadMaxTroops(sq.id);
    const cur = getSquadTroops(sq.id);
    if (cur < max) sq.troops = Math.min(max, cur + max * CONFIG.TROOPS_HEAL_RATIO_PER_MIN * perMin);
  }
  // 予備兵の蓄積（徴兵所レベルに応じて増え、上限で止まる）
  const cap = getReserveCap();
  if (S.player.reserves < cap) {
    S.player.reserves = Math.min(cap,
      S.player.reserves + getBuilding("camp").level * CONFIG.RESERVE_GAIN_PER_CAMP_LV_MIN * perMin);
  }
}
/**
 * 予備兵から部隊へ負傷兵を補充する。1兵あたり食料を消費。
 * 予備兵・食料の少ない方に合わせて可能な分だけ補充する。
 * 戻り値: 失敗理由 or null
 */
function reinforceSquad(squadId) {
  const sq = getSquad(squadId); if (!sq) return "部隊が見つかりません";
  const max = getSquadMaxTroops(squadId), cur = getSquadTroops(squadId);
  const need = Math.floor(max - cur);
  if (need <= 0) return "この部隊は満員です";
  const byReserve = Math.floor(S.player.reserves);
  const byFood = Math.floor(S.player.resources.food / CONFIG.FOOD_PER_SOLDIER);
  const add = Math.min(need, byReserve, byFood);
  if (add <= 0) {
    return byReserve <= 0 ? "予備兵がいません（徴兵所で蓄えられます）"
      : `食料が足りません（1兵あたり${CONFIG.FOOD_PER_SOLDIER}）`;
  }
  S.player.reserves -= add;
  S.player.resources.food -= add * CONFIG.FOOD_PER_SOLDIER;
  sq.troops = cur + add;
  const full = add >= need;
  toast(`⛺ ${sq.name}に ${fmt(add)}兵 を補充（🌾-${fmt(add * CONFIG.FOOD_PER_SOLDIER)}）`
    + (full ? "" : " ※不足分あり"), "build");
  return null;
}
/** dtSec 秒ぶんの生産を適用 */
function applyEconomy(dtSec) {
  const per = getProdPerHour();
  const cap = getStorageCap();
  for (const k of RES_KEYS) {
    S.player.resources[k] = Math.min(cap, S.player.resources[k] + per[k] * dtSec / 3600);
  }
  S.player.diamonds += per.diamonds * dtSec / 3600;
}
/**
 * ログアウト中は世界を止める。
 * 進行中の絶対時刻タイマー（普請・行軍・AI・チャット・事件）を離席時間ぶん後ろへずらし、
 * 「見ていない間に勝手に進んでいた」を無くす。生産も grantOfflineGains を呼ばないことで止まる。
 */
function shiftTimersForOffline() {
  const gap = now() - S.lastTickAt;
  if (gap < 2000) return 0;
  for (const b of S.player.buildings) if (b.upgradeEndsAt) b.upgradeEndsAt += gap;
  for (const m of S.player.marches) { m.departAt += gap; m.arriveAt += gap; }
  for (const ai of S.aiUsers) {
    if (ai.nextActionAt) ai.nextActionAt += gap;
    if (ai.nextRecruitAt) ai.nextRecruitAt += gap;
  }
  if (S.chat && S.chat.nextAmbientAt) S.chat.nextAmbientAt += gap;
  if (S.nextIncidentCheckAt) S.nextIncidentCheckAt += gap;
  if (S.incident) { S.incident.createdAt += gap; S.incident.expiresAt += gap; }
  return gap;
}
/** 起動時のオフライン精算（上限 OFFLINE_CAP_HOURS） */
function grantOfflineGains() {
  const elapsedSec = (now() - S.lastTickAt) / 1000;
  if (elapsedSec < 60) return;
  const capped = Math.min(elapsedSec, CONFIG.OFFLINE_CAP_HOURS * 3600);
  const before = { ...S.player.resources, diamonds: S.player.diamonds };
  applyEconomy(capped);
  const gains = RES_KEYS.map(k => {
    const g = Math.floor(S.player.resources[k] - before[k]);
    return g > 0 ? RES_DEFS[k].emoji + fmt(g) : null;
  }).filter(Boolean).join(" ");
  const dg = Math.floor(S.player.diamonds - before.diamonds);
  toast(`⏰ オフライン収益（${fmtSec(capped)}分）: ${gains}${dg > 0 ? " 💎" + fmt(dg) : ""}`, "offline");
}

/* =====================================================================
 * [S08] BUILDINGS — アップグレード
 * ===================================================================*/
function getBuilding(type) { return S.player.buildings.find(b => b.type === type); }
/** Lv b.level → b.level+1 のコスト */
function getUpgradeCost(b) {
  const def = BUILDING_DEFS[b.type];
  const cost = {};
  for (const [k, v] of Object.entries(def.costBase)) {
    cost[k] = Math.ceil(v * Math.pow(def.costGrowth, b.level - 1));
  }
  // 本城はLv2以降、木材と石材を大量に要求する＝倉庫を育てないと貯めきれず、
  // 本城だけを一気に伸ばすことができない。
  // （Lv1→2は従来コスト。初陣指南②が達成できなくなるのを避けるため）
  if (b.type === "castle" && b.level >= 2) {
    const g = Math.pow(CONFIG.CASTLE_COST_GROWTH, b.level - 2);
    cost.wood = Math.max(cost.wood || 0, Math.floor(CONFIG.CASTLE_WOOD_BASE * g));
    cost.stone = Math.max(cost.stone || 0, Math.floor(CONFIG.CASTLE_STONE_BASE * g));
  }
  return cost;
}
function getUpgradeTimeSec(b) { return BUILDING_DEFS[b.type].timeBaseSec * b.level; }
function canAfford(cost) { return Object.entries(cost).every(([k, v]) => S.player.resources[k] >= v); }
function payCost(cost) { for (const [k, v] of Object.entries(cost)) S.player.resources[k] -= v; }
/** 現在アップグレード中の建物数 */
function countUpgrading() { return S.player.buildings.filter(b => b.upgradeEndsAt).length; }
/** 枠を超えて着工する場合に必要なダイヤ（0なら無料） */
function getExtraSlotCost() {
  return countUpgrading() >= CONFIG.UPGRADE_FREE_SLOTS ? CONFIG.UPGRADE_EXTRA_SLOT_DIAMONDS : 0;
}
/** 残り時間を即完了させるダイヤ費用 */
function getRushCost(b) {
  if (!b.upgradeEndsAt) return 0;
  const leftMin = Math.max(0, (b.upgradeEndsAt - now()) / 60000);
  return Math.max(1, Math.ceil(leftMin * CONFIG.UPGRADE_RUSH_DIAMONDS_PER_MIN));
}
/**
 * アップグレード開始。失敗理由の文字列 or null(成功) を返す。
 * 同時進行は CONFIG.UPGRADE_FREE_SLOTS 件まで無料で、それを超える着工はダイヤを要求する
 * （＝建設が並列に走りすぎて内政が一瞬で終わるのを防ぐ）。
 */
function startUpgrade(type) {
  const b = getBuilding(type);
  const def = BUILDING_DEFS[type];
  if (b.upgradeEndsAt) return "アップグレード中です";
  if (b.level >= def.maxLevel) return "最大レベルです";
  if (type !== "castle" && b.level >= S.player.castleLevel) return "本城レベルが必要です";
  const extra = getExtraSlotCost();
  if (extra && Math.floor(S.player.diamonds) < extra) {
    return `他の普請が進行中です（同時に進めるには 💎${extra}）`;
  }
  const cost = getUpgradeCost(b);
  if (!canAfford(cost)) return "資源が足りません";
  payCost(cost);
  if (extra) S.player.diamonds -= extra;
  b.upgradeEndsAt = now() + getUpgradeTimeSec(b) * 1000;
  return null;
}
/** ダイヤで普請を即完了。失敗理由 or null */
function rushUpgrade(type) {
  const b = getBuilding(type);
  if (!b || !b.upgradeEndsAt) return "進行中の普請がありません";
  const cost = getRushCost(b);
  if (Math.floor(S.player.diamonds) < cost) return `ダイヤが足りません（💎${cost}必要）`;
  S.player.diamonds -= cost;
  b.upgradeEndsAt = now(); // 次のtickで完了する
  return null;
}
/** tickから呼ばれる。完了したアップグレードを反映 */
function finishUpgrades(t) {
  for (const b of S.player.buildings) {
    if (b.upgradeEndsAt && t >= b.upgradeEndsAt) {
      // 兵舎は最大兵力に関わるので、充足率を保ったままレベルを上げる
      if (b.type === "barracks") {
        withTroopRatioPreserved(S.player.squads.map(s => s.id), () => { b.level++; });
      } else b.level++;
      b.upgradeEndsAt = null;
      if (b.type === "castle") { S.player.castleLevel = b.level; chatEvent("onPlayerCastleUp"); }
      toast(`${BUILDING_DEFS[b.type].emoji} ${BUILDING_DEFS[b.type].name} が Lv${b.level} になりました`, "build");
    }
  }
}

/* =====================================================================
 * [S09] MILITARY — 戦力・出兵・制圧
 * ===================================================================*/
/** 旧ワールド（聖地が勝利条件）か。地形ワールドは皇都の制圧が勝利条件 */
function isLegacyRuleset() {
  return !S.world.ruleset || S.world.ruleset === "legacy_v1";
}
/** 勝利バナーをルールセットに応じた文言で表示 */
function showWinBanner() {
  const el = $("winBanner"); if (!el) return;
  el.textContent = isLegacyRuleset()
    ? "⛩️ 聖地制圧！ 天下統一まであと一歩 ⛩️"
    : "👑 皇都制圧！ 天下の覇権を握った 👑";
  el.classList.add("show");
}
/** カード1枚の戦力 */
function cardPower(defId) {
  const d = CARD_BY_ID[defId];
  return Math.round((d.atk * 1.2 + d.lead * 1.0 + d.int * 0.6) * RARITY_MULT[d.rarity]);
}
/* --- 部隊（squad）-----------------------------------------------------
 * 兵舎レベルで解禁数が増え、カードは部隊間で重複して編成できない。
 * 「1部隊に集中して硬い関所を抜く」か「複数部隊で並行して資源地を取る」かの
 * 選択が生まれるのが狙い。 */
/** 現在解禁されている部隊数（兵舎レベル依存） */
function getSquadSlots() {
  const lv = getBuilding("barracks").level;
  return CONFIG.SQUAD_UNLOCK_BARRACKS_LV.filter(need => lv >= need).length;
}
/** 解禁数に合わせて squads 配列を伸ばす（減らしはしない＝編成を失わない） */
function ensureSquads() {
  const slots = getSquadSlots();
  const names = ["第一隊", "第二隊", "第三隊", "第四隊"];
  while (S.player.squads.length < slots) {
    const i = S.player.squads.length;
    S.player.squads.push({ id: "sq_" + (i + 1), name: names[i] || `第${i + 1}隊`, cardUids: [] });
  }
  return S.player.squads;
}
function getSquad(squadId) { return S.player.squads.find(s => s.id === squadId) || S.player.squads[0]; }
/** 他の部隊に既に編成されているカードuidの集合 */
function cardsUsedByOtherSquads(squadId) {
  const used = new Set();
  for (const sq of S.player.squads) {
    if (sq.id === squadId) continue;
    for (const u of sq.cardUids) used.add(u);
  }
  return used;
}
/**
 * 部隊の編成カード（実体）を返す。
 * 未編成（cardUids が空）の部隊は、他部隊が使っていないカードから戦力上位を自動で借りる。
 * これにより既存プレイヤーは何もしなくても従来どおり出撃できる。
 */
function getSquadCards(squadId) {
  const sq = getSquad(squadId);
  if (!sq) return [];
  const byUid = new Map(S.player.cards.map(c => [c.uid, c]));
  const picked = sq.cardUids.map(u => byUid.get(u)).filter(Boolean);
  if (picked.length) return picked.slice(0, CONFIG.SQUAD_SIZE);
  // 自動編成。全部隊が同じカードを取ってしまわないよう、
  // 他部隊の手動編成分に加えて「自分より前の部隊が自動で取った分」も除外する。
  const used = cardsUsedByOtherSquads(sq.id);
  for (const other of S.player.squads) {
    if (other.id === sq.id) break;                 // 自分より前の部隊だけ見る（再帰は前方向のみ）
    if (other.cardUids.length) continue;           // 手動編成分は上で除外済み
    for (const c of getSquadCards(other.id)) used.add(c.uid);
  }
  return S.player.cards.filter(c => !used.has(c.uid))
    .sort((a, b) => cardPower(b.defId) - cardPower(a.defId))
    .slice(0, CONFIG.SQUAD_SIZE);
}
/* --- 兵力（負傷兵）------------------------------------------------------
 * 部隊は「兵力」を持ち、戦闘で減り、時間で遅く回復し、徴兵所で補充できる。
 * 戦力に充足率が掛かるため、連戦すると弱くなり休ませる判断が生まれる。
 * 最大兵力は編成カードの統率(lead)合計に比例する＝「統率＝率いられる兵数」。 */
/** 部隊の最大兵力（編成と兵舎レベルから毎回算出。保存しない） */
function getSquadMaxTroops(squadId) {
  const cards = getSquadCards(squadId);
  const lead = cards.reduce((a, c) => a + (CARD_BY_ID[c.defId] ? CARD_BY_ID[c.defId].lead : 0), 0);
  return Math.max(1, Math.round(lead * CONFIG.TROOPS_PER_LEAD
    + getBuilding("barracks").level * CONFIG.TROOPS_PER_BARRACKS_LV));
}
/** 部隊の現在兵力。未初期化(-1)なら満タンで初期化する */
function getSquadTroops(squadId) {
  const sq = getSquad(squadId); if (!sq) return 0;
  const max = getSquadMaxTroops(squadId);
  if (sq.troops == null || sq.troops < 0) sq.troops = max;
  if (sq.troops > max) sq.troops = max;   // 編成を弱くして最大が下がった場合
  return sq.troops;
}
/** 兵力の充足率（0〜1）。戦力に直接掛かる */
function getSquadTroopRatio(squadId) {
  const max = getSquadMaxTroops(squadId);
  return max > 0 ? clamp(getSquadTroops(squadId) / max, 0, 1) : 0;
}
/** 部隊の損耗倍率。編成カードの平均（兵器を混ぜるほど脆くなる） */
function getSquadCasualtyMult(squadId) {
  const cards = getSquadCards(squadId);
  if (!cards.length) return 1;
  let sum = 0;
  for (const c of cards) {
    const d = CARD_BY_ID[c.defId];
    const t = d && TROOP_DEFS[d.troop];
    sum += (t && t.casualtyMult) ? t.casualtyMult : 1;
  }
  return sum / cards.length;
}
/** 部隊の射程（歩数）。編成内の最大＝カタパルトを連れて行けば遠くを叩ける */
function getSquadRange(squadId) {
  const cards = getSquadCards(squadId);
  let r = CONFIG.TROOP_RANGE_DEFAULT;
  for (const c of cards) {
    const d = CARD_BY_ID[c.defId];
    const t = d && TROOP_DEFS[d.troop];
    if (t && t.range && t.range > r) r = t.range;
  }
  return r;
}
/** 予備兵の上限（徴兵所レベル依存） */
function getReserveCap() { return getBuilding("camp").level * CONFIG.RESERVE_PER_CAMP_LV; }
/**
 * 編成や兵舎レベルの変更で最大兵力が変わる時、**充足率を保ったまま**現在兵力を調整する。
 * これを挟まないと「強い武将を編成したのに充足率が下がって弱くなった」という
 * 直感に反する挙動になる。
 */
function withTroopRatioPreserved(squadIds, mutate) {
  const ids = Array.isArray(squadIds) ? squadIds : [squadIds];
  const ratios = ids.map(id => getSquadTroopRatio(id));
  mutate();
  ids.forEach((id, i) => {
    const sq = getSquad(id); if (!sq) return;
    sq.troops = Math.round(getSquadMaxTroops(id) * ratios[i]);
  });
}
/** 部隊の行軍速度倍率。軍は最も遅い兵種に律速される（兵器を混ぜると鈍足になる） */
function getSquadSpeedMult(squadId) {
  const cards = getSquadCards(squadId);
  if (!cards.length) return 1;
  // 初期値を1にすると「1より速い兵種（騎兵1.7）」が反映されないので Infinity から絞る
  let slowest = Infinity;
  for (const c of cards) {
    const d = CARD_BY_ID[c.defId];
    const sp = d && TROOP_DEFS[d.troop] ? TROOP_DEFS[d.troop].speed : 1;
    if (sp < slowest) slowest = sp;
  }
  return isFinite(slowest) ? slowest : 1;
}
/** 部隊の主兵種（最も多い兵種。同数なら戦力が高い方）。カード無しなら null */
function getSquadTroop(squadId) {
  const cards = getSquadCards(squadId);
  if (!cards.length) return null;
  const score = {};
  for (const c of cards) {
    const d = CARD_BY_ID[c.defId]; if (!d || !d.troop) continue;
    score[d.troop] = (score[d.troop] || 0) + 1 + cardPower(c.defId) / 10000; // 同数は戦力で決着
  }
  let best = null;
  for (const [k, v] of Object.entries(score)) if (!best || v > score[best]) best = k;
  return best;
}
/**
 * 部隊の戦力。カード戦力 + 兵舎 + 本城 に将軍バフを掛ける。
 * defTroop を渡すと兵種相性の倍率も掛かる（実際の戦闘判定・UIの見積り両方で使う）。
 */
function getSquadPower(squadId, defTroop, tileType) {
  const cards = getSquadCards(squadId);
  const base = cards.reduce((a, c) => a + cardPower(c.defId), 0)
    + getBuilding("barracks").level * CONFIG.POWER_PER_BARRACKS_LV
    + S.player.castleLevel * CONFIG.POWER_PER_CASTLE_LV;
  // 兵力が減っている部隊は、その割合ぶん弱くなる（負傷兵の反映）
  const mult = (getAllianceBuffs().power || 1)
    * troopMultiplier(getSquadTroop(squadId), defTroop, tileType)
    * getSquadTroopRatio(squadId);
  return Math.round(base * mult);
}
/** 出撃可能な（＝行軍中でない）部隊の一覧 */
function getIdleSquads() {
  ensureSquads();
  const busy = new Set(S.player.marches.map(m => m.squadId));
  return S.player.squads.slice(0, getSquadSlots()).filter(s => !busy.has(s.id));
}
/** 代表戦力（マップの情報バーなどの概算表示用）。第一隊の相性なし戦力 */
function getArmyPower() {
  ensureSquads();
  return getSquadPower(S.player.squads[0].id, null);
}
/** タイルの防御力 */
function getTileDefense(ti) {
  const t = S.world.tiles[ti];
  if (t.type === "holy") return CONFIG.HOLY_DEF;
  if (t.type === "capital") return CONFIG.CAPITAL_DEF;
  if (t.type === "gate") return CONFIG.GATE_DEF;
  if (t.type === "port") return CONFIG.PORT_DEF;
  let def = CONFIG.TILE_DEF_BASE * Math.pow(t.level, 1.5);
  if (t.type === "empty") def *= CONFIG.TILE_DEF_EMPTY_MULT;
  if (t.ownerId && t.ownerId !== "player") {
    const ai = S.aiUsers.find(a => a.id === t.ownerId);
    if (ai) def += ai.castleLevel * CONFIG.TILE_DEF_AI_PER_CASTLE_LV;
  }
  return Math.round(def);
}

/* --- 地形の通行判定 --------------------------------------------------
 * 山・川は「防御が高い」のではなく、そもそも出兵対象にならない地形。
 * 判定を canStepBetween に集約し、隣接判定・出兵可能範囲・AI拡張・
 * 行軍距離BFS がすべて同じルールを使うようにする。 */
/** 山・川など進入自体ができない地形か */
function isTerrainBlocked(ti) { return isBlockedType(S.world.tiles[ti].type); }
/**
 * from から to へ1歩進めるか（8方向）。
 * 斜めの場合、横・縦どちらかの隣接セルが通行不能なら「角抜け」を禁止する。
 * これが無いと、山脈の角を斜めにすり抜けられてしまう。
 */
function canStepBetween(fromIdx, toIdx) {
  if (isTerrainBlocked(toIdx)) return false;
  const a = S.world.tiles[fromIdx], b = S.world.tiles[toIdx];
  const dx = b.x - a.x, dy = b.y - a.y;
  if (dx && dy) {
    if (isTerrainBlocked(idx(b.x, a.y)) || isTerrainBlocked(idx(a.x, b.y))) return false;
  }
  return true;
}
/** 出兵の対象になりうるタイルか（山・川・城は不可） */
function isCapturableTile(ti) {
  const t = S.world.tiles[ti];
  return !isBlockedType(t.type) && t.type !== "castle";
}
/** タイルが自領（自城含む）に8方向で隣接しているか（地形で遮られていないこと） */
function isAdjacentToOwned(ti) {
  const t = S.world.tiles[ti];
  if (!isCapturableTile(ti)) return false;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = t.x + dx, ny = t.y + dy;
    if (!inBounds(nx, ny)) continue;
    const ni = idx(nx, ny);
    if (S.world.tiles[ni].ownerId !== "player") continue;
    if (canStepBetween(ni, ti)) return true; // 自領から実際に踏み込めるか
  }
  return false;
}

/* 今すぐ出兵できるタイルの集合（マップ強調用）。
 * 自領の8近傍を種に作る。毎フレーム再計算しないよう明示的に無効化する方式で、
 * 自領が変化する箇所（制圧・放棄）から invalidateMarchable() を呼ぶ。
 * ※AIが未所有タイルを取っても「攻撃可能」であることは変わらないため無効化不要。 */
let _marchableCache = { range: -1, set: null };
function invalidateMarchable() { _marchableCache.set = null; }
/** 待機中の部隊のうち最大の射程（マップのハイライト範囲に使う） */
function getMaxSquadRange() {
  const idle = getIdleSquads();
  let r = CONFIG.TROOP_RANGE_DEFAULT;
  for (const sq of idle) { const v = getSquadRange(sq.id); if (v > r) r = v; }
  return r;
}
/**
 * 出兵できるタイルの集合。range 歩以内まで広がる（兵器は射程2＝後方攻撃）。
 * ただし**未所有の要衝（関所・埠頭・皇都）は通過できない** — ここを飛び越えられると
 * 「関を破らねば先へ進めない」という地形の意味が失われるため。
 */
function getMarchableTiles(range) {
  const r = range != null ? range : getMaxSquadRange();
  if (_marchableCache.set && _marchableCache.range === r) return _marchableCache.set;
  const set = new Set();
  // 自領から r 歩の幅優先探索。自領以外は「そこで止まる」＝経路として使えない
  let frontier = [playerStartIdx(), ...S.player.ownedTiles];
  const seen = new Set(frontier);
  for (let step = 0; step < r; step++) {
    const next = [];
    for (const si of frontier) {
      const st = S.world.tiles[si]; if (!st) continue;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = st.x + dx, ny = st.y + dy;
        if (!inBounds(nx, ny)) continue;
        const ti = idx(nx, ny);
        const t = S.world.tiles[ti];
        if (t.ownerId === "player" || t.type === "castle") continue; // 自領・城は対象外
        if (!isCapturableTile(ti) || !canStepBetween(si, ti)) continue; // 山・川・角抜けは不可
        set.add(ti);
        // 2歩目の足場にできるのは「要衝でない未所有タイル」だけ
        if (!seen.has(ti) && !["gate", "port", "capital"].includes(t.type)) {
          seen.add(ti); next.push(ti);
        }
      }
    }
    frontier = next;
    if (!frontier.length) break;
  }
  _marchableCache = { range: r, set };
  return set;
}

/* 本城からの地形距離（山・川を迂回した実距離）。行軍時間の算出に使う。
 * 1600マスのBFSを起動時とワールド生成時に1回だけ実行し、RAM上にだけ保持する
 * （派生値なのでセーブには入れない）。draw() から呼んではいけない。 */
const RUNTIME = { terrainDistance: null };
function buildTerrainDistanceMap() {
  const dist = new Array(SIZE * SIZE).fill(Infinity);
  const start = playerStartIdx();
  dist[start] = 0;
  const q = [start];
  for (let head = 0; head < q.length; head++) {
    const ti = q[head], t = S.world.tiles[ti];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = t.x + dx, ny = t.y + dy;
      if (!inBounds(nx, ny)) continue;
      const ni = idx(nx, ny);
      if (dist[ni] !== Infinity) continue;
      if (!canStepBetween(ti, ni)) continue;
      dist[ni] = dist[ti] + 1;
      q.push(ni);
    }
  }
  RUNTIME.terrainDistance = dist;
  return dist;
}
/** 本城から目標までの距離。地形距離が使えればそれを、無ければ直線距離を使う */
function getMarchDistance(ti) {
  const d = RUNTIME.terrainDistance ? RUNTIME.terrainDistance[ti] : Infinity;
  if (d != null && isFinite(d)) return d;
  const t = S.world.tiles[ti], p = getPlayerStart();
  return chebyshev(t.x, t.y, p.x, p.y);
}
/** 出兵開始。squadId 省略時は空いている部隊を自動で選ぶ。失敗理由 or null */
function startMarch(ti, squadId) {
  const t = S.world.tiles[ti];
  const idle = getIdleSquads();
  const squad = squadId ? idle.find(s => s.id === squadId) : idle[0];
  if (!squad) return "出撃できる部隊がありません（全部隊が行軍中）";
  if (!getSquadCards(squad.id).length) return "この部隊に武将が編成されていません";
  if (t.ownerId === "player") return "すでに領有しています";
  if (t.type === "castle") return "他プレイヤーの城は攻撃できません（未実装）";
  if (isBlockedType(t.type)) return `${TILE_DEFS[t.type].name}は越えられません`;
  // 兵力が尽きた部隊は出撃できない（休ませるか補充する判断を促す）
  const ratio = getSquadTroopRatio(squad.id);
  if (ratio < CONFIG.TROOPS_MIN_RATIO_TO_MARCH) {
    return `${squad.name}の兵が足りません（兵力${Math.round(ratio * 100)}% — 徴兵所で補充を）`;
  }
  // 射程は部隊ごと。兵器を含む隊は2歩先まで届く
  if (CONFIG.REQUIRE_ADJACENCY && !getMarchableTiles(getSquadRange(squad.id)).has(ti)) {
    return getSquadRange(squad.id) > 1
      ? "そこまでは兵を進められません（要衝を越えた先へは出撃できません）"
      : "自領に隣接するタイルにのみ出兵できます";
  }
  if (S.player.resources.food < CONFIG.MARCH_FOOD_COST) return "食料が足りません（" + CONFIG.MARCH_FOOD_COST + "必要）";
  S.player.resources.food -= CONFIG.MARCH_FOOD_COST;
  // 山河を迂回した実距離。川向こうは近く見えても埠頭まで回るぶん時間がかかる
  const dist = getMarchDistance(ti);
  // 兵種で速度が変わる（騎兵は速く、兵器は鈍い）。部隊は最も遅い兵種に合わせる
  const speed = CONFIG.MARCH_TILES_PER_SEC * getSquadSpeedMult(squad.id) * (getAllianceBuffs().speed || 1);
  const sec = Math.max(CONFIG.MARCH_MIN_SEC, dist / speed);
  // 出撃時点の戦力を確定させる（兵種相性はこの目標に対して計算済み）
  S.player.marches.push({
    id: uid("m"), squadId: squad.id, targetIdx: ti,
    power: getSquadPower(squad.id, t.defTroop, t.type),
    troop: getSquadTroop(squad.id),
    departAt: now(), arriveAt: now() + sec * 1000,
  });
  return null;
}
/**
 * 戦闘の損耗を適用して、減った兵数を返す。
 * 「敵防御力 ÷ 自軍戦力」の比が大きいほど激しく減る＝格上に挑むと消耗する。
 * 部隊の損耗倍率（兵器を混ぜるほど大きい）も掛かる。
 */
function applyCasualties(squadId, enemyDef, ownPower, won) {
  const sq = getSquad(squadId); if (!sq) return 0;
  const before = getSquadTroops(squadId);
  const ratio = ownPower > 0 ? enemyDef / ownPower : 2;
  const raw = won
    ? clamp(ratio * CONFIG.CASUALTY_WIN_FACTOR, CONFIG.CASUALTY_WIN_MIN, CONFIG.CASUALTY_WIN_MAX)
    : clamp(ratio * CONFIG.CASUALTY_LOSE_FACTOR, CONFIG.CASUALTY_LOSE_MIN, CONFIG.CASUALTY_LOSE_MAX);
  const lost = Math.min(before, Math.round(before * raw * getSquadCasualtyMult(squadId)));
  sq.troops = Math.max(0, before - lost);
  return lost;
}
/** tickから呼ばれる。到着した出兵を解決（帰還は省略＝即時） */
function resolveMarches(t) {
  const done = S.player.marches.filter(m => t >= m.arriveAt);
  if (!done.length) return;
  S.player.marches = S.player.marches.filter(m => t < m.arriveAt);
  for (const m of done) {
    const tile = S.world.tiles[m.targetIdx];
    const def = getTileDefense(m.targetIdx);
    if (m.power >= def) {
      // 前所有者（AI）から剥奪
      if (tile.ownerId && tile.ownerId !== "player") {
        const ai = S.aiUsers.find(a => a.id === tile.ownerId);
        if (ai) ai.ownedTiles = ai.ownedTiles.filter(i => i !== m.targetIdx);
      }
      tile.ownerId = "player";
      S.player.ownedTiles.push(m.targetIdx);
      invalidateMarchable(); // 自領が広がると出兵可能範囲も変わる
      const bonus = CONFIG.DIAMOND_CAPTURE_BONUS_PER_LEVEL * tile.level;
      S.player.diamonds += bonus;
      // 相性を突いて勝った時は「効いた」ことを明示する（三すくみを学ぶ手応えになる）
      const win = troopMultiplier(m.troop, tile.defTroop, tile.type);
      const winTag = win > 1 ? `【${TROOP_DEFS[m.troop].name}が有利！】` : "";
      const lost = applyCasualties(m.squadId, def, m.power, true);
      toast(`⚔️ ${winTag}${TILE_DEFS[tile.type].name}Lv${tile.level} を制圧！ 💎+${bonus}`
        + (lost ? ` ／ 損耗 -${fmt(lost)}兵` : ""), "capture");
      // 初制圧時だけ「領地が継続的に何を生むか」を1本にまとめて明示する
      // （コアループの起点。初陣指南①の達成通知もこれが兼ねる）
      if (S.player.ownedTiles.length === 1) {
        const dph = CONFIG.DIAMOND_PER_TILELEVEL_PER_HOUR * tile.level;
        const rph = RES_KEYS.includes(tile.type) ? CONFIG.TILE_PROD_PER_LEVEL_PER_HOUR * tile.level : 0;
        toast(`🏳️ 初領地を得た！ 💎+${dph}/h${rph ? ` ／ ${RES_DEFS[tile.type].emoji}+${rph}/h` : ""} が毎時入り続けます`);
      }
      chatEvent("onPlayerCapture", { ctx: { tile: TILE_DEFS[tile.type].name } }); // 同盟員が祝う
      // 勝利条件はワールドのルールセットで分岐する。
      // 旧ワールド(legacy_v1)=聖地の領有 / 地形ワールド(three_realms_v2)=皇都の制圧
      if (isLegacyRuleset()) {
        if (tile.type === "holy" && !S.flags.holyWon) {
          S.flags.holyWon = true;
          showWinBanner();
          toast("🎉 勝利条件達成！ 聖地を領有しました！", "win");
          chatEvent("onHolyWin");
        }
      } else if (tile.type === "capital" && !S.flags.capitalWon) {
        S.flags.capitalWon = true;
        showWinBanner();
        toast("👑 皇都制圧！ 天下の覇権を握った", "win");
        chatEvent("onHolyWin");
      }
    } else {
      // 負けた理由が分かるよう、相性が不利だった場合はそれも書く
      const rel = troopMultiplier(m.troop, tile.defTroop, tile.type);
      const relTxt = rel < 1 && m.troop && tile.defTroop
        ? `（${TROOP_DEFS[m.troop].name}は${TROOP_DEFS[tile.defTroop].name}に不利）` : "";
      const lost = applyCasualties(m.squadId, def, m.power, false);
      toast(`💥 ${TILE_DEFS[tile.type].name}Lv${tile.level} への出兵失敗… 戦力${fmt(m.power)} < 防御${fmt(def)}${relTxt}`
        + (lost ? ` ／ 損耗 -${fmt(lost)}兵` : ""), "defeat");
    }
  }
}
/** 領有タイルの放棄（隣接経路の付け替え用） */
function abandonTile(ti) {
  const t = S.world.tiles[ti];
  if (t.ownerId !== "player" || t.type === "castle") return "放棄できません";
  t.ownerId = null;
  S.player.ownedTiles = S.player.ownedTiles.filter(i => i !== ti);
  invalidateMarchable();
  return null;
}

/* =====================================================================
 * [S10] GACHA — 排出・天井
 * ===================================================================*/
/** レア度を1回抽選（天井処理込み） */
function rollRarity() {
  S.player.gacha.total++;
  S.player.gacha.sinceSSR++;
  if (S.player.gacha.sinceSSR >= CONFIG.GACHA_PITY_SSR) { S.player.gacha.sinceSSR = 0; return "SSR"; }
  let r = Math.random();
  for (const [rar, p] of Object.entries(CONFIG.GACHA_RATES)) {
    if (r < p) {
      if (rar === "SSR" || rar === "UR") S.player.gacha.sinceSSR = 0; // URはSSR以上なので天井もリセット
      return rar;
    }
    r -= p;
  }
  return "N";
}
/**
 * ガチャ実行。count=1|10。
 * 戻り値: 獲得カードdef配列 / 失敗時はnull（ダイヤ不足）
 */
function doGacha(count) {
  const cost = count === 10 ? CONFIG.GACHA_COST_TEN : CONFIG.GACHA_COST_SINGLE;
  if (Math.floor(S.player.diamonds) < cost) return null;
  S.player.diamonds -= cost;
  const results = [];
  for (let i = 0; i < count; i++) {
    const rar = rollRarity();
    results.push(pick(CARD_POOL.filter(c => c.rarity === rar)));
  }
  // 10連保証: SR以上が1枚もなければ最後の1枚をSRに差し替え
  if (count === 10 && !results.some(c => c.rarity === "SR" || c.rarity === "SSR")) {
    results[9] = pick(CARD_POOL.filter(c => c.rarity === CONFIG.GACHA_TEN_GUARANTEE));
  }
  const t = now();
  for (const def of results) S.player.cards.push({ uid: uid("c"), defId: def.id, obtainedAt: t });
  // 初陣指南④は「10連を引いた」ことが条件（単発では達成しない）
  if (count === CONFIG.TUTORIAL_GACHA_COUNT && S.tutorial) S.tutorial.didTenPull = true;
  return results;
}

/* =====================================================================
 * [S11] ALLIANCE — 勧誘・役職・バフ
 * ===================================================================*/
/** 同盟の役職バフを集計。{power,prod,speed} の乗数（未設定は1） */
function getAllianceBuffs() {
  const out = {};
  if (!S) return out;
  for (const m of S.alliance.members) {
    const buff = (ROLE_DEFS[m.role] || {}).buff || {};
    for (const [k, v] of Object.entries(buff)) out[k] = Math.max(out[k] || 1, v);
  }
  return out;
}
/** 勧誘の成功率（0〜1）。自城とAI城のレベル差で変動。UI表示と実処理で共用する */
function recruitChance(ai) {
  return clamp(
    CONFIG.RECRUIT_BASE_CHANCE + CONFIG.RECRUIT_CHANCE_PER_LV_DIFF * (S.player.castleLevel - ai.castleLevel),
    0.15, 0.95);
}
/** 勧誘の候補（未所属かつ勧誘可のAI）を自城からの距離が近い順に返す */
function getRecruitCandidates() {
  return S.aiUsers
    .filter(a => a.recruitable && !a.allianceId)
    .map(a => { const p = getPlayerStart(); return { ai: a, dist: chebyshev(a.x, a.y, p.x, p.y) }; })
    .sort((p, q) => p.dist - q.dist);
}
/** AI勧誘。失敗理由 or null（成功/失敗はトーストで通知） */
function recruitAI(aiId) {
  const ai = S.aiUsers.find(a => a.id === aiId);
  if (!ai || !ai.recruitable) return "勧誘できない相手です";
  if (ai.allianceId) return "すでに同盟所属です";
  if (now() < ai.nextRecruitAt) return "しばらく待ってから再勧誘してください（" + fmtSec((ai.nextRecruitAt - now()) / 1000) + "）";
  if (S.player.resources.food < CONFIG.RECRUIT_FOOD_COST) return "食料が足りません（" + CONFIG.RECRUIT_FOOD_COST + "必要）";
  S.player.resources.food -= CONFIG.RECRUIT_FOOD_COST;
  const chance = recruitChance(ai);
  if (Math.random() < chance) {
    ai.allianceId = S.alliance.id;
    S.alliance.members.push({ id: ai.id, role: "一般" });
    toast(`🤝 ${ai.name} が同盟に加入しました！`, "ally");
    chatEvent("onJoin", { ai }); // 加入者本人が挨拶
  } else {
    ai.nextRecruitAt = now() + CONFIG.RECRUIT_COOLDOWN_SEC * 1000;
    toast(`😔 ${ai.name} に断られました（成功率${Math.round(chance * 100)}%）`);
  }
  return null;
}
function setMemberRole(memberId, role) {
  const m = S.alliance.members.find(m => m.id === memberId);
  if (m && m.role !== "盟主") {
    m.role = role;
    const ai = S.aiUsers.find(a => a.id === memberId);
    if (ai) chatEvent("onRole", { ai, sub: role }); // 任命された本人が応じる
  }
}

/* =====================================================================
 * [S12] AI USERS — ルールベース状態機械
 *
 * 各AIは nextActionAt が来たら1アクションだけ実行して次回時刻を再設定。
 * personality:
 *   expander : 20-60秒ごとに隣接未所有タイルを1枚claim
 *   balanced : 60-180秒ごとに 拡張50% / 城Lvアップ50%
 *   turtle   : 120-300秒ごとに城Lvアップのみ
 * 制約: プレイヤー領有タイル・城・聖地は奪わない（対人戦は未実装）。
 * ===================================================================*/
const AI_ACTION_INTERVALS = { expander: [20, 60], balanced: [60, 180], turtle: [120, 300] };

/**
 * AIが自動でclaimしてよいタイルか。
 * V1ではAIは地域境界（埠頭・関所）と皇都を越えない＝三地方に自然に閉じ込められ、
 * プレイヤーだけが関を破って次の地域へ進める。
 */
function isAIExpandableTile(ti) {
  const t = S.world.tiles[ti];
  if (isBlockedType(t.type)) return false;
  if (t.type === "port") return !!CONFIG.AI_CAN_CAPTURE_PORT;
  if (t.type === "gate") return !!CONFIG.AI_CAN_CAPTURE_GATE;
  if (t.type === "capital") return !!CONFIG.AI_CAN_CAPTURE_CAPITAL;
  return true;
}
function aiExpand(ai) {
  // AI領土（城＋領有タイル）に隣接する未所有タイルを収集
  const seeds = [idx(ai.x, ai.y), ...ai.ownedTiles];
  const candidates = [];
  for (const si of seeds) {
    const st = S.world.tiles[si];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = st.x + dx, ny = st.y + dy;
      if (!inBounds(nx, ny)) continue;
      const ti = idx(nx, ny);
      const t = S.world.tiles[ti];
      if (t.ownerId || t.type === "castle" || t.type === "holy") continue;
      if (!isAIExpandableTile(ti)) continue;      // 山河・要衝・皇都へは進出しない
      if (!canStepBetween(si, ti)) continue;      // 角抜けもさせない
      if (t.level > ai.castleLevel + 1) continue; // 分不相応なタイルは取らない
      candidates.push(ti);
    }
  }
  if (candidates.length) {
    const ti = pick(candidates);
    S.world.tiles[ti].ownerId = ai.id;
    ai.ownedTiles.push(ti);
  }
}
function aiGrow(ai) {
  if (ai.castleLevel < 10) {
    ai.castleLevel++;
    S.world.tiles[idx(ai.x, ai.y)].level = ai.castleLevel;
  }
}
function aiTickAll(t) {
  for (const ai of S.aiUsers) {
    if (t < ai.nextActionAt) continue;
    const [lo, hi] = AI_ACTION_INTERVALS[ai.personality];
    ai.nextActionAt = t + randInt(lo, hi) * 1000;
    if (ai.personality === "expander") aiExpand(ai);
    else if (ai.personality === "turtle") aiGrow(ai);
    else Math.random() < 0.5 ? aiExpand(ai) : aiGrow(ai);
  }
}
