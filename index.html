/** チャットログへ1件追加（上限超過分は古い方から切り捨て） */
function chatPush(senderId, text) {
  if (!S.chat) S.chat = { messages: [], nextAmbientAt: 0, unseen: 0 };
  S.chat.messages.push({ id: uid("msg"), ts: now(), senderId, text });
  const over = S.chat.messages.length - CONFIG.CHAT_MAX_MESSAGES;
  if (over > 0) S.chat.messages.splice(0, over);
  if (activeTab !== "alliance") S.chat.unseen++;
}
/** テンプレ変数を補間（{name} 等）。未定義キーは空文字。 */
function chatFill(tpl, ctx) { return tpl.replace(/\{(\w+)\}/g, (_, k) => (ctx[k] != null ? ctx[k] : "")); }
/** 同盟所属AIから1人ランダムに返す（居なければ null） */
function randomAllianceAI() {
  const ids = S.alliance.members.filter(m => m.id !== "player").map(m => m.id);
  if (!ids.length) return null;
  const id = pick(ids); // findのコールバック内で pick すると要素ごとに再抽選され取りこぼす
  return S.aiUsers.find(a => a.id === id) || null;
}
/**
 * セリフプールを解決する。プールは「フラット配列」でも「サブキー別オブジェクト」でもよく、
 * Grokの納品形式が変わっても壊れないようフォールバックする:
 *   1. 配列ならそのまま使う（sub は無視）
 *   2. オブジェクト＋subが該当すればそれを使う（性格別・役職別）
 *   3. オブジェクトだがsubが無い/該当しない場合は全サブプールを平坦化して使う
 *      （＝キーの取りこぼしで発話が消えるのを防ぐ安全網）
 */
function resolveChatPool(root, sub) {
  if (!root) return null;
  if (Array.isArray(root)) return root;
  if (sub && Array.isArray(root[sub]) && root[sub].length) return root[sub];
  const flat = [];
  for (const v of Object.values(root)) if (Array.isArray(v)) flat.push(...v);
  return flat;
}
/** 発言者(excludeAi)以外の同盟AIを1人返す（居なければ null）。{other} 用 */
function randomOtherAllianceAI(excludeAi) {
  const ids = S.alliance.members
    .filter(m => m.id !== "player" && (!excludeAi || m.id !== excludeAi.id))
    .map(m => m.id);
  if (!ids.length) return null;
  const id = pick(ids);
  return S.aiUsers.find(a => a.id === id) || null;
}
/**
 * イベント発火 → 該当プールから1つ選び同盟AIの発言として投稿。
 * kind: CHAT_LINES のキー（ambient も可）。opts.ai指定でその人物、無指定でランダム同盟AI。
 * opts.sub でネストプール(性格別/役職別)のサブキー、opts.ctx で追加テンプレ変数。
 * テンプレ変数 {other}（＝発言者以外の同盟AI名）は、該当者が居る時のみ解決される。
 * 居ない場合に文が壊れないよう、{other} を含むセリフは候補から除外する。
 * 同盟にAIが1人も居なければ何も投稿しない。
 */
function chatEvent(kind, opts = {}) {
  if (!S.chat) return;
  let pool = resolveChatPool(CHAT_LINES[kind], opts.sub);
  if (!pool || !pool.length) return;
  const ai = opts.ai || randomAllianceAI();
  if (!ai) return;
  const other = randomOtherAllianceAI(ai);
  if (!other) {
    pool = pool.filter(s => !s.includes("{other}")); // 相手が居ないセリフは使わない
    if (!pool.length) return;
  }
  const ctx = { name: ai.name, ally: S.alliance.name, other: other ? other.name : "", ...(opts.ctx || {}) };
  chatPush(ai.id, chatFill(pick(pool), ctx));
}
/** 環境チャット: 一定間隔で同盟AIが性格に応じたセリフを1つ（tickから呼ぶ） */
function chatTick(t) {
  if (!S.chat || t < S.chat.nextAmbientAt) return;
  S.chat.nextAmbientAt = t + randInt(CONFIG.CHAT_AMBIENT_MIN_SEC, CONFIG.CHAT_AMBIENT_MAX_SEC) * 1000;
  const ai = randomAllianceAI();
  if (ai) chatEvent("ambient", { ai, sub: ai.personality }); // {other}解決も chatEvent に集約
}

/* =====================================================================
 * [S19] ALLIANCE INCIDENTS — 同盟内事件（不満AIへの対処）
 *
 * 流れ: 一定間隔で同盟AIの忠誠(loyalty)が低下 → 閾値を下回った者が不満を訴える
 *       （＝事件発生。同時1件） → プレイヤーが4択で対処 → 結果を chat に流す。
 *   なだめる: 食料を払い忠誠回復。低忠誠ほど失敗しやすい
 *   役職を与える: 役職なしの相手のみ。回復量が最大（役職は不満の主因なので理に適う）
 *   放置:     忠誠がさらに低下。閾値を割ると自主脱退
 *   追放:     即座に同盟から除名（二度と勧誘できない）
 * 役職持ちは忠誠の低下が緩い＝役職を配る動機になる。
 * 事件は未対応のまま INCIDENT_EXPIRE_SEC 経過で自動的に「放置」扱いになる。
 * ===================================================================*/
const INCIDENT_DEFS = {
  noRole:   { label: "役職への不満", desc: "役目を与えられず腐っている" },
  noReward: { label: "待遇への不満", desc: "働きに報いが無いと感じている" },
  idle:     { label: "停滞への不満", desc: "同盟が動かないことに苛立っている" },
};

/** 同盟メンバーのAI一覧（プレイヤー除く。members と aiUsers の両方に居る者だけ） */
function allianceAIs() {
  return S.alliance.members
    .filter(m => m.id !== "player")
    .map(m => S.aiUsers.find(a => a.id === m.id))
    .filter(Boolean);
}
function memberRoleOf(aiId) {
  const m = S.alliance.members.find(m => m.id === aiId);
  return m ? m.role : null;
}
/** AIを同盟から外す共通処理。banned=true で以後勧誘不可 */
function removeFromAlliance(ai, banned) {
  S.alliance.members = S.alliance.members.filter(m => m.id !== ai.id);
  ai.allianceId = null;
  ai.loyalty = CONFIG.LOYALTY_START;
  if (banned) ai.recruitable = false;
  else ai.nextRecruitAt = now() + CONFIG.RECRUIT_COOLDOWN_SEC * 1000;
}
/** 事件を1件発生させる（既に発生中なら何もしない） */
function raiseIncident(ai) {
  if (S.incident) return;
  const kind = memberRoleOf(ai.id) === "一般" ? "noRole" : pick(["noReward", "idle"]);
  S.incident = { id: uid("inc"), aiId: ai.id, kind, createdAt: now(), expiresAt: now() + CONFIG.INCIDENT_EXPIRE_SEC * 1000 };
  chatEvent("onIncident", { ai, sub: kind });
  toast(`⚠️ ${ai.name} が不満を訴えています（同盟タブ）`, "incident");
}
/** tickから呼ぶ: 忠誠の自然低下と事件発生／期限切れ処理 */
function incidentTick(t) {
  if (!S.alliance) return;
  // 期限切れ＝放置扱い
  if (S.incident && t >= S.incident.expiresAt) resolveIncident("ignore", true);
  if (t < (S.nextIncidentCheckAt || 0)) return;
  S.nextIncidentCheckAt = t + randInt(CONFIG.INCIDENT_CHECK_MIN_SEC, CONFIG.INCIDENT_CHECK_MAX_SEC) * 1000;
  const ais = allianceAIs();
  if (!ais.length) return;
  for (const ai of ais) {
    const hasRole = memberRoleOf(ai.id) !== "一般";
    ai.loyalty = clamp(ai.loyalty - (hasRole ? CONFIG.LOYALTY_DECAY_WITH_ROLE : CONFIG.LOYALTY_DECAY_NO_ROLE),
      0, CONFIG.LOYALTY_MAX);
  }
  if (S.incident) return; // 同時に複数は起こさない
  const unhappy = ais.filter(a => a.loyalty < CONFIG.INCIDENT_THRESHOLD);
  if (unhappy.length) raiseIncident(pick(unhappy));
}
/**
 * 事件への対処。action: soothe|promote|ignore|exile
 * 戻り値は失敗理由の文字列 / 成功時 null（[S08]等と同じ規約）。
 * auto=true は期限切れによる自動「放置」（トーストの文言を変える）。
 */
function resolveIncident(action, auto) {
  const inc = S.incident;
  if (!inc) return "対応中の事件はありません";
  const ai = S.aiUsers.find(a => a.id === inc.aiId);
  if (!ai) { S.incident = null; return null; }

  if (action === "soothe") {
    if (S.player.resources.food < CONFIG.SOOTHE_FOOD_COST) return `食料が足りません（${CONFIG.SOOTHE_FOOD_COST}必要）`;
    S.player.resources.food -= CONFIG.SOOTHE_FOOD_COST;
    // 忠誠が低いほど失敗しやすい（0で35%、閾値付近で75%程度）
    const chance = clamp(0.35 + (ai.loyalty / CONFIG.INCIDENT_THRESHOLD) * 0.4, 0.35, 0.9);
    if (Math.random() < chance) {
      ai.loyalty = clamp(ai.loyalty + CONFIG.SOOTHE_LOYALTY_GAIN, 0, CONFIG.LOYALTY_MAX);
      chatEvent("onSoothe", { ai });
      toast(`🤝 ${ai.name} をなだめました（忠誠${Math.round(ai.loyalty)}）`);
    } else {
      chatEvent("onSootheFail", { ai });
      toast(`😞 ${ai.name} は納得しませんでした`);
    }
    S.incident = null;
    return null;
  }
  if (action === "promote") {
    if (memberRoleOf(ai.id) !== "一般") return "すでに役職を持っています";
    const role = pick(ASSIGNABLE_ROLES.filter(r => r !== "一般"));
    const m = S.alliance.members.find(m => m.id === ai.id);
    if (m) m.role = role;
    ai.loyalty = clamp(ai.loyalty + CONFIG.PROMOTE_LOYALTY_GAIN, 0, CONFIG.LOYALTY_MAX);
    chatEvent("onPromoteFix", { ai });
    toast(`🎖️ ${ai.name} を「${role}」に任命しました（忠誠${Math.round(ai.loyalty)}）`);
    S.incident = null;
    return null;
  }
  if (action === "ignore") {
    ai.loyalty = clamp(ai.loyalty - CONFIG.IGNORE_LOYALTY_PENALTY, 0, CONFIG.LOYALTY_MAX);
    S.incident = null;
    if (ai.loyalty < CONFIG.LOYALTY_LEAVE_THRESHOLD) {
      chatEvent("onLeave", { ai, sub: ai.personality }); // 結末3種は性格別プール（無ければ平坦化）
      removeFromAlliance(ai, false); // 再勧誘は可能
      toast(`💔 ${ai.name} が同盟を去りました`, "ally");
    } else {
      chatEvent("onIgnore", { ai, sub: ai.personality });
      toast(auto ? `⌛ ${ai.name} の訴えを放置しました（忠誠${Math.round(ai.loyalty)}）`
                 : `😐 ${ai.name} を放置しました（忠誠${Math.round(ai.loyalty)}）`);
    }
    return null;
  }
  if (action === "exile") {
    chatEvent("onExile", { ai, sub: ai.personality });
    removeFromAlliance(ai, true); // 追放者は二度と勧誘できない
    S.incident = null;
    toast(`⛔ ${ai.name} を追放しました`, "ally");
    return null;
  }
  return "不明な操作です";
}

/* =====================================================================
 * [S20] EVENT LOG — 出来事ログ
 *
 * 行軍の解決や建物の完成は「見ていない間」に起きるため、トーストだけでは
 * 見逃すと何が起きたか分からなくなる（UX検品の指摘）。重要な出来事を蓄積し、
 * 後から読み返せるようにする。記録は toast(msg, kind) の第2引数で行う。
 * 表示はマップ画面の📜ボタン → ボトムシート。未読はマップタブにバッジで出す。
 * ===================================================================*/
const LOG_KINDS = {
  capture:  { color: "#8fd98f" },  // 制圧成功
  defeat:   { color: "#e08080" },  // 出兵失敗（見逃すと最も困る）
  win:      { color: "#e8b84a" },  // 聖地制圧＝勝利
  build:    { color: "#9ab6e0" },  // 建物の強化完了
  ally:     { color: "#d0a0e0" },  // 同盟（勧誘・事件の結末）
  incident: { color: "#e0a060" },  // 同盟内事件の発生
  offline:  { color: "#9aa5bb" },  // オフライン収益
  tutorial: { color: "#e8b84a" },  // 初陣指南の達成
};
/** 出来事を1件記録（上限超過分は古い方から切り捨て） */
function logEvent(kind, text) {
  if (!S) return;
  if (!S.log) { S.log = []; S.logUnseen = 0; }
  S.log.push({ id: uid("log"), ts: now(), kind, text });
  const over = S.log.length - CONFIG.LOG_MAX;
  if (over > 0) S.log.splice(0, over);
  S.logUnseen = (S.logUnseen || 0) + 1;
}
/** 時刻表示 12:34 */
function fmtClock(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/** 出来事ログをボトムシートで表示（開いた時点で既読にする） */
function openLogSheet() {
  S.logUnseen = 0;
  updateMapBadge();
  const rows = (S.log || []).slice().reverse().map(e => {
    const col = (LOG_KINDS[e.kind] || {}).color || "var(--fg)";
    return `<div class="log-row"><span class="log-time">${fmtClock(e.ts)}</span>
      <span class="log-text" style="color:${col}">${escapeHtml(e.text)}</span></div>`;
  }).join("");
  $("sheet").innerHTML = `<h3>📜 出来事の記録</h3>
    <div class="dim small">新しい順。最大${CONFIG.LOG_MAX}件まで残ります</div>
    <div class="log-list">${rows || '<div class="dim small" style="padding:10px 2px">まだ記録がありません</div>'}</div>
    <div class="actions"><button onclick="closeSheet()">閉じる</button></div>`;
  $("sheet").classList.add("open");
}
/** 未読バッジを更新（タブバーのマップと、マップ内📜ボタンの両方） */
function updateMapBadge() {
  const n = (S && S.logUnseen) || 0;
  // 指南中は記録ボタンも隠す（この時期に見返すべき出来事はまだ無い）
  const logBtn = $("logBtn");
  if (logBtn) logBtn.style.display = (CONFIG.TUTORIAL_HIDE_ADVANCED_UI && S && getTutorialStep()) ? "none" : "";
  for (const id of ["mapBadge", "mapCtrlBadge"]) {
    const el = $(id); if (!el) continue;
    el.textContent = n > 9 ? "9+" : (n || "");
    el.style.display = n > 0 ? "" : "none";
  }
}

/* 編成中の部隊（UI状態なのでセーブしない） */
let editingSquadId = null;
function renderCards() {
  ensureSquads();
  const slots = getSquadSlots();
  const squads = S.player.squads.slice(0, slots);
  if (!editingSquadId || !squads.some(s => s.id === editingSquadId)) editingSquadId = squads[0].id;
  const sq = getSquad(editingSquadId);
  const busy = new Set(S.player.marches.map(m => m.squadId));
  const usedByOthers = cardsUsedByOtherSquads(sq.id);
  const inThis = new Set(sq.cardUids);
  const auto = sq.cardUids.length === 0;
  const autoUids = new Set(auto ? getSquadCards(sq.id).map(c => c.uid) : []);

  // 部隊タブ
  const tabs = squads.map(s => {
    const tr = getSquadTroop(s.id), trd = tr ? TROOP_DEFS[tr] : null;
    const rt = Math.round(getSquadTroopRatio(s.id) * 100);
    return `<button class="squad-tab ${s.id === sq.id ? "on" : ""}" onclick="UIA.selectSquad('${s.id}')">
      ${s.name}${trd ? ` <span style="color:${trd.color}">${trd.emoji}</span>` : ""}
      <span class="dim small">${fmt(getSquadPower(s.id, null))}</span>
      <span class="dim small">兵${rt}%</span>
      ${busy.has(s.id) ? '<span class="squad-busy">行軍中</span>' : ""}</button>`;
  }).join("");
  const nextUnlock = CONFIG.SQUAD_UNLOCK_BARRACKS_LV[slots];

  // 所持カード（1枚ずつ。部隊への出し入れができるよう uid 単位で並べる）
  const list = S.player.cards.slice().sort((a, b) => {
    const da = CARD_BY_ID[a.defId], db = CARD_BY_ID[b.defId];
    return RARITY_ORDER[da.rarity] - RARITY_ORDER[db.rarity] || cardPower(b.defId) - cardPower(a.defId);
  });
  const cards = list.map(c => {
    const d = CARD_BY_ID[c.defId];
    const trd = TROOP_DEFS[d.troop];
    const picked = inThis.has(c.uid), autoPicked = autoUids.has(c.uid);
    const locked = usedByOthers.has(c.uid);
    return `<div class="unit-card rar-${d.rarity} ${picked ? "picked" : ""} ${locked ? "locked" : ""}"
        onclick="UIA.toggleSquadCard('${sq.id}','${c.uid}')">
      <span class="rarity">${d.rarity}</span>
      <div class="art">${artHTML(d.imageKey, d.emoji)}</div>
      <b>${d.name}</b> <span class="card-stars">${"★".repeat(RARITY_STARS[d.rarity])}</span>
      <div class="dim small">${trd ? `<span style="color:${trd.color}">${trd.emoji}${trd.name}</span> ｜ ` : ""}戦力${cardPower(c.defId)}</div>
      <div class="dim small">武${d.atk} 知${d.int} 統${d.lead}</div>
      ${picked ? '<span class="pick-badge">編成中</span>' : autoPicked ? '<span class="pick-badge auto">自動</span>' : ""}
      ${locked ? '<span class="pick-badge lock">他隊</span>' : ""}
    </div>`;
  }).join("");

  const tr = getSquadTroop(sq.id), trd = tr ? TROOP_DEFS[tr] : null;
  // 兵力（負傷兵）の状況
  const tMax = getSquadMaxTroops(sq.id), tCur = Math.floor(getSquadTroops(sq.id));
  const tRatio = getSquadTroopRatio(sq.id);
  const tCol = tRatio < CONFIG.TROOPS_MIN_RATIO_TO_MARCH ? "var(--danger)"
    : tRatio < 0.6 ? "#d8a13a" : "#5aa05a";
  const need = Math.floor(tMax - tCur);
  const reserves = Math.floor(S.player.reserves);
  const canFill = Math.min(need, reserves, Math.floor(S.player.resources.food / CONFIG.FOOD_PER_SOLDIER));
  const rangeTxt = getSquadRange(sq.id) > 1 ? ` ｜ 射程${getSquadRange(sq.id)}（後方攻撃）` : "";
  $("page-cards").innerHTML = `
    <div class="panel">
      <h3>⚔️ 部隊編成</h3>
      <div class="squad-tabs">${tabs}</div>
      ${nextUnlock ? `<div class="dim small" style="margin-top:6px">次の部隊は兵舎Lv${nextUnlock}で解禁</div>` : ""}
    </div>
    <div class="panel">
      <div class="row"><div class="grow">
        <b>${sq.name}</b> <span class="dim small">${sq.cardUids.length || getSquadCards(sq.id).length}/${CONFIG.SQUAD_SIZE}枚</span>
        <div class="dim small">主兵種 ${trd ? `<span style="color:${trd.color}">${trd.emoji}${trd.name}</span>` : "—"}
          ｜ 戦力 ${fmt(getSquadPower(sq.id, null))}${auto ? "（自動編成）" : ""}${rangeTxt}</div>
      </div>
      ${auto ? "" : `<button onclick="UIA.autoSquad('${sq.id}')">自動編成に戻す</button>`}</div>
      <!-- 兵力バー。減っているとその割合ぶん戦力も落ちる -->
      <div class="troop-row">
        <div class="troop-bar"><i style="width:${Math.round(tRatio * 100)}%;background:${tCol}"></i></div>
        <span class="small" style="color:${tCol}">兵力 ${fmt(tCur)}/${fmt(tMax)}（${Math.round(tRatio * 100)}%）</span>
      </div>
      <div class="row" style="margin-top:6px">
        <div class="grow dim small">⛺ 予備兵 ${fmt(reserves)}/${fmt(getReserveCap())}
          ｜ 補充は1兵につき 🌾${CONFIG.FOOD_PER_SOLDIER}
          ${tRatio < CONFIG.TROOPS_MIN_RATIO_TO_MARCH ? `<br><span style="color:var(--danger)">兵力${Math.round(CONFIG.TROOPS_MIN_RATIO_TO_MARCH * 100)}%未満では出撃できません</span>` : ""}</div>
        <button class="primary" ${canFill <= 0 ? "disabled" : ""} onclick="UIA.reinforce('${sq.id}')">
          ⛺ 補充${canFill > 0 ? `（+${fmt(canFill)}）` : ""}</button>
      </div>
      <div class="dim small" style="margin-top:8px">兵種の輪: 🛡️歩兵 → 🔱槍兵 → 🐎騎兵 → 🏹弓兵 → 🛡楯兵 → 🛡️歩兵
        （有利×${CONFIG.TROOP_ADVANTAGE} / 不利×${CONFIG.TROOP_DISADVANTAGE}）<br>
        🏗️兵器は輪の外: 要塞に×${CONFIG.TROOP_SIEGE_VS_FORTRESS}・野戦×${CONFIG.TROOP_SIEGE_VS_FIELD}、射程2だが損耗×1.6</div>
    </div>
    <div class="panel dim small">カードをタップで編成に出し入れ（部隊をまたいで同じ武将は使えません）</div>
    <div class="card-grid">${cards || '<div class="dim">カードなし</div>'}</div>`;
}

/* 同盟タブは毎tickの全再構築を避ける（役職selectと入力中テキストを壊すため）。
 * 構成が変わった時（事件の発生/解決・メンバー増減・役職変更・忠誠の目盛り変化）だけ
 * 全再描画し、それ以外はチャットログとカウントダウンのみ更新する。 */
let allianceSig = "";
function allianceSignature() {
  const t = now();
  const inc = S.incident ? S.incident.id : "-";
  const mem = S.alliance.members.map(m => {
    const ai = S.aiUsers.find(a => a.id === m.id);
    return m.id + ":" + m.role + ":" + (ai ? Math.round(ai.loyalty / 5) : "p"); // 忠誠は5刻みで判定
  }).join(",");
  // 勧誘候補の顔ぶれとクールダウンの有無・食料の充足（ボタンの活性が変わる条件）
  const rec = getRecruitCandidates().map(c => c.ai.id + (t < c.ai.nextRecruitAt ? "!" : "")).join(",");
  const poor = S.player.resources.food < CONFIG.RECRUIT_FOOD_COST ? "p" : "-";
  return inc + "|" + mem + "|" + rec + "|" + poor;
}
/** 軽量更新: 事件パネルと勧誘クールダウンの残り時間だけ書き換える（全再描画を避ける） */
function updateIncidentCountdown() {
  const el = $("incidentLeft");
  if (el && S.incident) el.textContent = fmtSec(Math.max(0, (S.incident.expiresAt - now()) / 1000));
  for (const { ai } of getRecruitCandidates()) {
    const c = $("rcd_" + ai.id);
    if (c) c.textContent = fmtSec(Math.max(0, (ai.nextRecruitAt - now()) / 1000));
  }
}
/* 近隣の勧誘候補パネル。マップでAI城を1つずつ探さなくても、
 * 同盟タブだけで「誰を誘えるか・成功率・距離」が分かり、その場で勧誘できる。 */
function recruitPanelHTML() {
  const cands = getRecruitCandidates();
  const cost = CONFIG.RECRUIT_FOOD_COST;
  const rows = cands.map(({ ai, dist }) => {
    const cd = Math.max(0, ai.nextRecruitAt - now());
    const poor = S.player.resources.food < cost;
    const pct = Math.round(recruitChance(ai) * 100);
    const btn = cd > 0
      ? `<button disabled>⏳ <span id="rcd_${ai.id}">${fmtSec(cd / 1000)}</span></button>`
      : `<button class="primary" ${poor ? "disabled" : ""} onclick="UIA.recruit('${ai.id}')">🤝 勧誘</button>`;
    return `<div class="panel row recruit-row">
      <div class="grow">
        <b style="color:${ai.color}">${escapeHtml(ai.name)}</b>
        <span class="dim small">城Lv${ai.castleLevel} ｜ ${dist}マス</span>
        <div class="dim small">成功率 ${pct}%${poor ? " ｜ 🌾不足" : ""}</div>
      </div>
      <button onclick="UIA.jumpToAI('${ai.id}')">🗺️</button>
      ${btn}
    </div>`;
  }).join("");
  return `<div class="panel"><h3>🔍 近隣の勢力（勧誘候補）</h3>
      <div class="dim small">勧誘コスト 🌾${cost} ｜ 成功率は自城とAI城のレベル差で変動。
      🗺️ で地図の位置へ移動します</div></div>
    ${rows || `<div class="panel dim small">勧誘できる勢力がありません。<br>
      （すでに同盟入り／追放済みの勢力は候補に出ません）</div>`}`;
}
/** 発生中の事件パネルHTML（無ければ空文字） */
function incidentPanelHTML() {
  const inc = S.incident; if (!inc) return "";
  const ai = S.aiUsers.find(a => a.id === inc.aiId); if (!ai) return "";
  const def = INCIDENT_DEFS[inc.kind] || { label: "不満", desc: "" };
  const canPromote = memberRoleOf(ai.id) === "一般";
  const leftSec = Math.max(0, (inc.expiresAt - now()) / 1000);
  return `<div class="panel incident">
    <h3>⚠️ ${escapeHtml(ai.name)} の${def.label}</h3>
    <div class="dim small">${def.desc}／忠誠 ${Math.round(ai.loyalty)} ／
      放置すると <span id="incidentLeft">${fmtSec(leftSec)}</span> で自動的に「放置」扱いになります</div>
    <div class="incident-actions">
      <button class="primary" onclick="UIA.incident('soothe')">🤝 なだめる（🌾${CONFIG.SOOTHE_FOOD_COST}）</button>
      <button ${canPromote ? "" : "disabled"} onclick="UIA.incident('promote')">🎖️ 役職を与える</button>
      <button onclick="UIA.incident('ignore')">😐 放置する</button>
      <button class="danger" onclick="UIA.incident('exile')">⛔ 追放する</button>
    </div>
    <div class="dim small" style="margin-top:6px">※追放した相手は二度と勧誘できません</div>
  </div>`;
}

    buffs.speed ? `行軍+${Math.round((buffs.speed - 1) * 100)}%` : null,

/** チャットログ本体だけを再描画（メンバーselect/入力欄は温存。tickからも呼ぶ）。

function chatSenderName(senderId) {

function chatSenderColor(senderId) {

function renderChatLog(forceBottom) {

/** 同盟タブの未読バッジ更新（tickから呼ぶ） */
function updateChatBadge() {

/* =====================================================================
 * [S14] UI: MAP CANVAS — 描画・パン/ズーム/タップ
 * ===================================================================*/
const MapView = {
  canvas: null, ctx: null,
  zoom: 1,               // 1 = 基準タイルサイズ22px
  baseTile: 22,
  offsetX: 0, offsetY: 0, // マップ原点の画面座標(px)
  get tilePx() { return this.baseTile * this.zoom; },

  init() {
    this.canvas = $("mapCanvas");
    this.ctx = this.canvas.getContext("2d");
    { const p = getPlayerStart(); this.pendingCenter = [p.x, p.y]; } // 初回の有効サイズ確定時に自城へ中心合わせ
    this.fit();
    window.addEventListener("resize", () => { this.fit(); this.draw(); });
    // --- パン＆タップ（Pointer Events） ---
    let down = null, moved = false;
    this.canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, ox: this.offsetX, oy: this.offsetY }; moved = false; });
    this.canvas.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
      if (moved) { this.offsetX = down.ox + dx; this.offsetY = down.oy + dy; this.draw(); }
    });
    this.canvas.addEventListener("pointerup", e => {
      // 聖地コンパスのマーカーはタイルより手前にあるので先に判定する
      if (down && !moved && !this.compassHit(e.clientX, e.clientY)) this.tap(e.clientX, e.clientY);
      down = null;
    });
    this.canvas.addEventListener("pointercancel", () => { down = null; });
    $("zoomIn").onclick = () => { this.setZoom(this.zoom * 1.3); };
    $("zoomOut").onclick = () => { this.setZoom(this.zoom / 1.3); };
    $("zoomHome").onclick = () => { const p = getPlayerStart(); this.centerOn(p.x, p.y); this.draw(); };
    $("logBtn").onclick = () => openLogSheet();
  },
  fit() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = r.width * dpr;
    this.canvas.height = r.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.vw = r.width; this.vh = r.height;
    // 起動直後はレイアウト未確定で幅0のことがある。初回の有効サイズで中心合わせ
    if (this.pendingCenter && this.vw > 0) {
      this.centerOn(this.pendingCenter[0], this.pendingCenter[1]);
      this.pendingCenter = null;
    }
  },
  setZoom(z) {
    // 画面中央を基準にズーム
    const cx = this.vw / 2, cy = this.vh / 2;
    const wx = (cx - this.offsetX) / this.tilePx, wy = (cy - this.offsetY) / this.tilePx;
    this.zoom = clamp(z, 0.4, 3);
    this.offsetX = cx - wx * this.tilePx;
    this.offsetY = cy - wy * this.tilePx;
    this.draw();
  },
  centerOn(x, y) {
    this.offsetX = this.vw / 2 - (x + 0.5) * this.tilePx;
    this.offsetY = this.vh / 2 - (y + 0.5) * this.tilePx;
  },
  /* 脈動アニメ用の低頻度ループ。マップタブを見ている時だけ描画するので
   * 他タブ・バックグラウンドでは一切コストがかからない。 */
  startAnim() {
    if (this._animTimer || !CONFIG.MAP_ANIM_FPS) return;
    this._animTimer = setInterval(() => {
      if (activeTab === "map" && !document.hidden) this.draw();
    }, Math.round(1000 / CONFIG.MAP_ANIM_FPS));
  },
  tap(cx, cy) {
    const rect = this.canvas.getBoundingClientRect();
    const x = Math.floor((cx - rect.left - this.offsetX) / this.tilePx);
    const y = Math.floor((cy - rect.top - this.offsetY) / this.tilePx);
    if (inBounds(x, y)) openTileSheet(idx(x, y));
  },
  /* 画面外の聖地を画面端のマーカーで指し示す。
   * 勝利条件が常に画面外で「何を目指すゲームか分からない」問題への対処。
   * タップするとその聖地へマップを移動する（compassHit で判定）。 */
  drawHolyCompass(ctx, ts, pulse) {
    this._compassHits = [];
    // 右下のズーム/ホームボタンや上部の情報バーと重ならないよう、端の余白を非対称にする
    const ML = 26, MT = 26, MR = 82, MB = 52;
    const objective = isLegacyRuleset() ? "holy" : "capital"; // 目標はルールセットで変わる
    const ps = getPlayerStart();
    for (const t of S.world.tiles) {
      if (t.type !== objective) continue;
      const cx = this.offsetX + (t.x + 0.5) * ts, cy = this.offsetY + (t.y + 0.5) * ts;
      if (cx >= 0 && cx <= this.vw && cy >= 0 && cy <= this.vh) continue; // 画面内なら不要
      const mx = clamp(cx, ML, this.vw - MR), my = clamp(cy, MT, this.vh - MB);
      const mine = t.ownerId === "player";
      const dist = chebyshev(t.x, t.y, ps.x, ps.y);
      // 台座
      ctx.beginPath();
      ctx.arc(mx, my, 17, 0, Math.PI * 2);
      ctx.fillStyle = mine ? "rgba(80,60,20,.92)" : "rgba(58,32,64,.92)";
      ctx.fill();
      ctx.strokeStyle = mine ? "#e8b84a" : `rgba(200,150,230,${0.65 + 0.35 * pulse})`;
      ctx.lineWidth = 2; ctx.stroke();
      // 中心方向を指す小三角
      const ang = Math.atan2(cy - my, cx - mx);
      ctx.beginPath();
      ctx.moveTo(mx + Math.cos(ang) * 23, my + Math.sin(ang) * 23);
      ctx.lineTo(mx + Math.cos(ang + 2.5) * 15, my + Math.sin(ang + 2.5) * 15);
      ctx.lineTo(mx + Math.cos(ang - 2.5) * 15, my + Math.sin(ang - 2.5) * 15);
      ctx.closePath();
      ctx.fillStyle = mine ? "#e8b84a" : "rgba(200,150,230,.9)";
      ctx.fill();
      // アイコンと距離
      ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(TILE_DEFS[objective].emoji, mx, my - 3);
      ctx.font = "bold 9px sans-serif";
      ctx.fillStyle = mine ? "#ffe9a8" : "#e6d2f2";
      ctx.fillText(mine ? "領有" : dist + "マス", mx, my + 10);
      ctx.font = `${Math.floor(ts * 0.62)}px sans-serif`; // 元に戻す
      this._compassHits.push({ x: mx, y: my, tx: t.x, ty: t.y });
    }
  },
  /** コンパスのマーカーがタップされたら、その聖地へ移動して true を返す */
  compassHit(cx, cy) {
    const rect = this.canvas.getBoundingClientRect();
    const px = cx - rect.left, py = cy - rect.top;
    for (const h of (this._compassHits || [])) {
      if (Math.hypot(px - h.x, py - h.y) <= 20) {
        this.centerOn(h.tx, h.ty); this.draw();
        const objName = TILE_DEFS[isLegacyRuleset() ? "holy" : "capital"].name;
        toast(`${isLegacyRuleset() ? "⛩️" : "👑"} ${objName}へ移動しました（ここを制すれば勝利）`);
        return true;
      }
    }
    return false;
  },
  draw() {
    if (!S) return;
    const ctx = this.ctx, ts = this.tilePx;
    ctx.clearRect(0, 0, this.vw, this.vh);
    // 可視範囲のタイルのみ描画
    const x0 = clamp(Math.floor(-this.offsetX / ts), 0, SIZE - 1);
    const y0 = clamp(Math.floor(-this.offsetY / ts), 0, SIZE - 1);
    const x1 = clamp(Math.ceil((this.vw - this.offsetX) / ts), 0, SIZE);
    const y1 = clamp(Math.ceil((this.vh - this.offsetY) / ts), 0, SIZE);
    ctx.font = `${Math.floor(ts * 0.62)}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // 脈動用の位相（0〜1）。tickだけでなくアニメループからも描画されるので滑らかに動く
    const pulse = (Math.sin(now() / 420) + 1) / 2;
    const marchable = CONFIG.MAP_HIGHLIGHT_MARCHABLE && !S.player.marches.length
      ? getMarchableTiles() : null;
    // 初陣指南のあいだは目標コンパスと外交バッジを出さず、視線を手順に集中させる
    // （機能自体は生きており、指南完了と同時に現れる）
    const guiding = CONFIG.TUTORIAL_HIDE_ADVANCED_UI && !!getTutorialStep();
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const ti = idx(x, y);
        const t = S.world.tiles[ti];
        const px = this.offsetX + x * ts, py = this.offsetY + y * ts;
        // 地色（レベルが高いほど明るく）
        ctx.fillStyle = TILE_DEFS[t.type].color;
        ctx.fillRect(px, py, ts - 1, ts - 1);
        if (t.level > 1 && t.type !== "castle") {
          ctx.fillStyle = `rgba(255,255,255,${(t.level - 1) * 0.045})`;
          ctx.fillRect(px, py, ts - 1, ts - 1);
        }
        // 所有者の縁取り
        if (t.ownerId) {
          ctx.strokeStyle = t.ownerId === "player" ? "#e8b84a" :
            (S.aiUsers.find(a => a.id === t.ownerId) || {}).color || "#888";
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 1, py + 1, ts - 3, ts - 3);
        }
        // 出兵可能タイルの強調（隣接ルールを目で分かるようにする）
        if (marchable && marchable.has(ti)) {
          ctx.fillStyle = `rgba(120,215,255,${0.10 + 0.10 * pulse})`;
          ctx.fillRect(px, py, ts - 1, ts - 1);
          ctx.strokeStyle = `rgba(140,225,255,${0.55 + 0.35 * pulse})`;
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 3]);
          ctx.strokeRect(px + 1.5, py + 1.5, ts - 4, ts - 4);
          ctx.setLineDash([]);
        }
        // アイコン（ズームが小さい時は省略）
        if (ts >= 13 && TILE_DEFS[t.type].emoji) {
          ctx.fillStyle = "#fff";
          ctx.fillText(TILE_DEFS[t.type].emoji, px + ts / 2, py + ts / 2 + 1);
        }
        // 自城は主人公として際立たせる（AI城と見分けがつかない問題への対処）
        if (t.type === "castle" && t.ownerId === "player") {
          ctx.strokeStyle = `rgba(255,215,110,${0.6 + 0.4 * pulse})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(px + ts / 2, py + ts / 2, ts * 0.52 + 2 + pulse * 2, 0, Math.PI * 2);
          ctx.stroke();
          if (ts >= 16) { // ズームが十分な時だけ「自城」ラベル
            ctx.font = `bold ${Math.max(8, Math.floor(ts * 0.3))}px sans-serif`;
            ctx.fillStyle = "#1a1408";
            const lw = ctx.measureText("自城").width + 6;
            ctx.fillStyle = "rgba(255,215,110,.92)";
            ctx.fillRect(px + ts / 2 - lw / 2, py - ts * 0.34, lw, ts * 0.30);
            ctx.fillStyle = "#1a1408";
            ctx.fillText("自城", px + ts / 2, py - ts * 0.19);
            ctx.font = `${Math.floor(ts * 0.62)}px sans-serif`; // 元に戻す
          }
        }
        // AI城の外交状態バッジ。同盟員＝金の「盟」、勧誘できる相手＝緑の「勧」。
        // 1つずつタップして確かめなくても、マップを見るだけで勧誘先が分かるようにする。
        else if (t.type === "castle" && t.ownerId && ts >= 15 && !guiding) {
          const ai = S.aiUsers.find(a => a.id === t.ownerId);
          const ally = ai && ai.allianceId;
          const canRecruit = ai && !ally && ai.recruitable;
          if (ally || canRecruit) {
            const bx = px + ts - 6, by = py + 6;
            ctx.beginPath(); ctx.arc(bx, by, 7.5, 0, Math.PI * 2);
            ctx.fillStyle = ally ? "rgba(232,184,74,.95)" : `rgba(90,205,150,${0.7 + 0.3 * pulse})`;
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1; ctx.stroke();
            ctx.font = "bold 9px sans-serif";
            ctx.fillStyle = "#12161f";
            ctx.fillText(ally ? "盟" : "勧", bx, by + 1);
            ctx.font = `${Math.floor(ts * 0.62)}px sans-serif`; // 元に戻す
          }
        }
      }
    }
    if (CONFIG.MAP_HOLY_COMPASS && !guiding) this.drawHolyCompass(ctx, ts, pulse);
    else if (guiding) this._compassHits = []; // 指南中はコンパスのタップ判定も消す
    // 出兵ラインと部隊ドット
    const t0 = now();
    for (const m of S.player.marches) {
      const tt = S.world.tiles[m.targetIdx];
      const ps = getPlayerStart();
      const sx = this.offsetX + (ps.x + 0.5) * ts, sy = this.offsetY + (ps.y + 0.5) * ts;
      const ex = this.offsetX + (tt.x + 0.5) * ts, ey = this.offsetY + (tt.y + 0.5) * ts;
      const p = clamp((t0 - m.departAt) / (m.arriveAt - m.departAt), 0, 1);
      // 敵地・要塞への進軍は赤で示す（無主の空地などへの進出は金）
      const hostile = !!tt.ownerId || FORTRESS_TYPES.includes(tt.type);
      const line = hostile ? "rgba(230,80,80,.75)" : "rgba(232,184,74,.6)";
      const dot = hostile ? "#e05050" : "#e8b84a";
      ctx.strokeStyle = line; ctx.lineWidth = hostile ? 2.5 : 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = dot;
      ctx.beginPath(); ctx.arc(sx + (ex - sx) * p, sy + (ey - sy) * p, 5, 0, Math.PI * 2); ctx.fill();
      // 目標地点に着弾マーカー
      ctx.strokeStyle = line; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ex, ey, 7 + Math.sin(now() / 200) * 1.5, 0, Math.PI * 2); ctx.stroke();
    }
    // 情報バー
    const ms = S.player.marches;
    const idleCount = getIdleSquads().length, slots = getSquadSlots();
    $("mapInfo").textContent = ms.length
      ? `⚔️ ${ms.length}部隊が行軍中… 最短 ${fmtSec(Math.min(...ms.map(m => (m.arriveAt - t0) / 1000)))}`
        + (idleCount ? ` ｜ 待機${idleCount}隊` : "")
      : `領地 ${S.player.ownedTiles.length}枚 ｜ 戦力 ${fmt(getArmyPower())}`
        + (slots > 1 ? ` ｜ ${slots}部隊` : "") + ` ｜ 光る枠へ出兵`;
  },
};

/** タイル詳細ボトムシートを開く */
function openTileSheet(ti) {
  const t = S.world.tiles[ti];
  const td = TILE_DEFS[t.type];
  const ai = t.ownerId && t.ownerId !== "player" ? S.aiUsers.find(a => a.id === t.ownerId) : null;
  const ownerText = t.ownerId === "player" ? "あなたの領地" : ai ? `${ai.name} の領地` : "未所有";
  // 通行不可の地形はレベルや所有者を出さない（攻略できそうに見えてしまうため）
  let body = isBlockedType(t.type)
    ? `<h3>${td.emoji} ${td.name} <span class="dim small">(${t.x}, ${t.y})</span></h3>
       <div class="small" style="color:var(--danger)">⛔ 通行不可 — 兵を進めることはできません</div>`
    : `<h3>${td.emoji} ${td.name} Lv${t.level} <span class="dim small">(${t.x}, ${t.y})</span></h3>
       <div class="dim small">${ownerText}</div>`;
  if (td.desc) body += `<div class="small" style="margin-top:8px;line-height:1.6">${td.desc}</div>`;
  const actions = [];
  if (isBlockedType(t.type)) {
    // 山・川は出兵対象にならない。説明だけ出して終わる
  } else if (t.type === "castle" && ai) {
    // AI城: 勧誘UI
    body += `<div class="small" style="margin-top:6px">城Lv${ai.castleLevel} ｜ 性格: ${
      { expander: "拡張志向", balanced: "バランス型", turtle: "内政重視" }[ai.personality]}
      ｜ ${ai.allianceId ? "🤝 同盟員" : ai.recruitable ? "✅ 勧誘可能" : "❌ 勧誘不可"}</div>`;
    if (ai.recruitable && !ai.allianceId) {
      actions.push(`<button class="primary" onclick="UIA.recruit('${ai.id}')">🤝 勧誘する（🌾${CONFIG.RECRUIT_FOOD_COST}）</button>`);
    }
  } else if (t.ownerId === "player" && t.type !== "castle") {
    actions.push(`<button class="danger" onclick="UIA.abandon(${ti})">🏳️ 放棄する</button>`);
  } else if (t.ownerId !== "player" && t.type !== "castle") {
    const def = getTileDefense(ti);
    const resInfo = RES_KEYS.includes(t.type)
      ? `制圧すると ${RES_DEFS[t.type].emoji}+${fmt(CONFIG.TILE_PROD_PER_LEVEL_PER_HOUR * t.level)}/h`
      : t.type === "holy" && isLegacyRuleset() ? "🎉 制圧すると勝利条件達成！"
      : t.type === "capital" ? "👑 制圧すれば天下統一！"
      : t.type === "port" ? "⚓ 制圧すると対岸へ進軍できる"
      : t.type === "gate" ? "🛡️ 制圧するとこの先へ進める"
      : "制圧すると領地が広がる";
    const dt = t.defTroop ? TROOP_DEFS[t.defTroop] : null;
    // 三すくみを暗記していなくても判断できるよう、「何をぶつければ有利か」を明示する
    const counterKey = t.defTroop ? TROOP_KEYS.find(k => TROOP_DEFS[k].strong === t.defTroop) : null;
    const ct = counterKey ? TROOP_DEFS[counterKey] : null;
    body += `<div class="small" style="margin-top:6px">防御力 ${fmt(def)}${
      dt ? ` ｜ 守備 <span style="color:${dt.color}">${dt.emoji}${dt.name}</span>` : ""}${
      ct ? `<br><span class="rel-good">有利な兵種: ${ct.emoji}${ct.name}</span>` : ""}<br>
      ${resInfo}<br>💎ボーナス +${CONFIG.DIAMOND_CAPTURE_BONUS_PER_LEVEL * t.level}</div>`;
    // 部隊ごとに「この目標に対する」戦力（＝兵種相性込み）を出し、どれで攻めるか選ばせる
    const idle = getIdleSquads();
    if (!idle.length) {
      body += `<div class="small" style="margin-top:8px;color:var(--danger)">全部隊が行軍中です</div>`;
    } else {
      body += `<div class="squad-pick">` + idle.map(sq => {
        const p = getSquadPower(sq.id, t.defTroop, t.type);
        const tr = getSquadTroop(sq.id);
        const rel = troopMultiplier(tr, t.defTroop, t.type);
        const tRatio = getSquadTroopRatio(sq.id);
        const canMarch = tRatio >= CONFIG.TROOPS_MIN_RATIO_TO_MARCH
          && getMarchableTiles(getSquadRange(sq.id)).has(ti);
        const relTag = rel > 1 ? `<span class="rel-good">有利×${rel}</span>`
          : rel < 1 ? `<span class="rel-bad">不利×${rel}</span>` : "";
        const trd = tr ? TROOP_DEFS[tr] : null;
        // 勝てる部隊、かつ相性有利な部隊を最も目立たせて「これを出せばよい」と分かるようにする
        const cls = (canMarch && p >= def ? "can" : "cannot") + (rel > 1 && p >= def && canMarch ? " best" : "");
        // 兵種で行軍時間が変わるので、出撃前に所要時間も見せる
        const spd = CONFIG.MARCH_TILES_PER_SEC * getSquadSpeedMult(sq.id) * (getAllianceBuffs().speed || 1);
        const eta = fmtSec(Math.max(CONFIG.MARCH_MIN_SEC, getMarchDistance(ti) / spd));
        const note = tRatio < CONFIG.TROOPS_MIN_RATIO_TO_MARCH ? `<span class="rel-bad">兵力不足</span>`
          : !canMarch ? `<span class="rel-bad">射程外</span>` : "";
        return `<button class="squad-btn ${cls}" ${canMarch ? "" : "disabled"} onclick="UIA.march(${ti},'${sq.id}')">
          <b>${sq.name}</b>${trd ? ` <span style="color:${trd.color}">${trd.emoji}</span>` : ""}
          <span class="dim small">兵${Math.round(tRatio * 100)}%</span>
          <span class="squad-eta">🕐${eta}</span>
          <span class="squad-pow">${fmt(p)} ${p >= def ? "✅" : "⚠️"}</span>${relTag}${note}</button>`;
      }).join("") + `</div>
      <div class="dim small" style="margin-top:4px">出兵コスト 🌾${CONFIG.MARCH_FOOD_COST}／部隊。編成は「カード」タブで変更できます</div>`;
    }
  }
  actions.push(`<button onclick="closeSheet()">閉じる</button>`);
  $("sheet").innerHTML = body + `<div class="actions">${actions.join("")}</div>`;
  $("sheet").classList.add("open");
}
function closeSheet() { $("sheet").classList.remove("open"); openBuildingType = null; }

/* =====================================================================
 * [S15] UI: ACTIONS — ボタンonclickから呼ばれる操作群
 * 命名規約: UIA.動詞。エラー文字列はトーストで表示。
 * ===================================================================*/
const UIA = {
  upgrade(type) {
    const err = startUpgrade(type);
    if (err) toast("⚠️ " + err);
    renderCity(); renderHeader();
    if (openBuildingType === type && $("sheet").classList.contains("open")) openBuildingSheet(type);
  },
  /** ダイヤで普請を即完了 */
  rush(type) {
    const err = rushUpgrade(type);
    if (err) toast("⚠️ " + err); else toast("⚡ 普請を完了させました");
    renderCity(); renderHeader();
    if ($("sheet").classList.contains("open")) closeSheet();
  },
  march(ti, squadId) {
    const err = startMarch(ti, squadId);
    if (err) toast("⚠️ " + err);
    else toast(`⚔️ ${squadId ? getSquad(squadId).name : "部隊"} が出撃しました`);
    closeSheet(); MapView.draw(); renderHeader();
  },
  /** 部隊にカードを入れる/外す（同じカードは1部隊にしか入らない） */
  toggleSquadCard(squadId, uid) {
    const sq = getSquad(squadId); if (!sq) return;
    const i = sq.cardUids.indexOf(uid);
    if (i < 0) {
      if (sq.cardUids.length >= CONFIG.SQUAD_SIZE) { toast(`⚠️ 1部隊は${CONFIG.SQUAD_SIZE}枚までです`); return; }
      if (cardsUsedByOtherSquads(squadId).has(uid)) { toast("⚠️ 他の部隊に編成済みです"); return; }
    }
    // 最大兵力が変わるので充足率を維持する（強化したのに弱くなるのを防ぐ）
    withTroopRatioPreserved(squadId, () => {
      if (i >= 0) sq.cardUids.splice(i, 1); else sq.cardUids.push(uid);
    });
    renderCards();
  },
  /** 編成中の部隊を切り替える（表示のみ。保存不要なのでUI状態として持つ） */
  selectSquad(squadId) { editingSquadId = squadId; renderCards(); },
  /** 予備兵から負傷兵を補充する（食料を消費） */
  reinforce(squadId) {
    const err = reinforceSquad(squadId);
    if (err) toast("⚠️ " + err);
    renderCards(); renderHeader();
  },
  /** 部隊の編成を空にして自動編成（戦力上位）に戻す */
  autoSquad(squadId) {
    const sq = getSquad(squadId); if (!sq) return;
    withTroopRatioPreserved(squadId, () => { sq.cardUids = []; });
    toast(`${sq.name} を自動編成に戻しました`);
    renderCards();
  },
  abandon(ti) {
    const err = abandonTile(ti);
    if (err) toast("⚠️ " + err); else toast("🏳️ 放棄しました");
    closeSheet(); MapView.draw();
  },
  recruit(aiId) {
    const err = recruitAI(aiId);
    if (err) toast("⚠️ " + err);
    closeSheet(); renderHeader();
    if (activeTab === "alliance") renderAlliance(); // 同盟タブの候補一覧からも呼ばれる
  },
  /** 初陣指南バーのタップ → 詳細シート */
  guideOpen() { openTutorialSheet(false); },
  /** 指南シートの行動ボタン → 該当タブへ移動（操作は強制せず、場所まで案内するだけ） */
  guideGo() {
    const step = getTutorialStep();
    closeSheet();
    if (!step || step === "complete") return;
    const d = TUTORIAL_STEPS[step];
    if (d.tab) switchTab(d.tab);
    if (step === "capture1" || step === "capture2") {
      const p = getPlayerStart();
      MapView.centerOn(p.x, p.y); MapView.draw();
      toast("光る枠のタイルをタップして出兵しましょう");
    }
  },
  /** 勧誘候補の位置へマップを移動して表示（同盟タブ→マップの導線） */
  jumpToAI(aiId) {
    const ai = S.aiUsers.find(a => a.id === aiId);
    if (!ai) return;
    switchTab("map");
    MapView.fit();
    MapView.centerOn(ai.x, ai.y);
    MapView.draw();
    toast(`🗺️ ${ai.name} の城（${ai.x}, ${ai.y}）へ移動しました`);
  },
  gacha(count) {
    const results = doGacha(count);
    if (!results) { toast("⚠️ ダイヤが足りません"); return; }
    lastGachaResults = results;
    const best = results.some(c => c.rarity === "UR") ? "🌈UR!!!"
      : results.some(c => c.rarity === "SSR") ? "🌟SSR!!"
      : results.some(c => c.rarity === "SR") ? "✨SR!" : "";
    toast(`🎰 ${count}連ガチャ ${best}`);
    renderGacha(); renderHeader();
  },
  setRole(memberId, role) {
    setMemberRole(memberId, role);
    toast(`役職を ${role} に変更しました`);
    renderAlliance();
  },
  incident(action) {
    const err = resolveIncident(action);
    if (err) toast("⚠️ " + err);
    renderAlliance(); renderHeader();
  },
  sendChat() {
    const inp = $("chatInput"); if (!inp) return;
    const text = inp.value.trim(); if (!text) return;
    chatPush("player", text);
    inp.value = "";
    if (randomAllianceAI() && Math.random() < 0.8) chatEvent("onPlayerSend"); // 同盟員が相槌
    renderChatLog(true);
  },
  reset() {
    if (confirm("セーブデータを完全に削除して最初からやり直しますか？")) resetGame();
  },
  importAsset() {
    const key = $("assetKey").value.trim();
    if (!key) { toast("⚠️ imageKey を入力してください"); return; }
    const input = $("assetFile");
    input.onchange = async () => {
      if (input.files[0]) {
        await AssetDB.put(key, input.files[0]);
        toast(`🖼️ ${key} に画像を登録しました`);
        renderActiveTab();
      }
    };
    input.click();
  },
};

 *  - 判定と描画はこのセクションに集約し、ゲームロジック側へ条件分岐を散らさない。

const TUTORIAL_STEPS = {

const TUTORIAL_ORDER = ["capture1", "castle2", "barracks2", "gacha10", "capture2"];

/** 現在の指南ステップキーを状態から算出。完了済み/対象外なら null */
function getTutorialStep() {
  const tu = S.tutorial;
  if (!tu || tu.completedAt) return null;
  if (S.player.ownedTiles.length < CONFIG.TUTORIAL_FIRST_TILE_COUNT) return "capture1";
  if (S.player.castleLevel < CONFIG.TUTORIAL_CASTLE_TARGET_LV) return "castle2";
  if (getBuilding("barracks").level < CONFIG.TUTORIAL_BARRACKS_TARGET_LV) return "barracks2";
  if (!tu.didTenPull) return "gacha10";
  if (S.player.ownedTiles.length < CONFIG.TUTORIAL_FINAL_TILE_COUNT) return "capture2";
  return "complete";
}
/** 指南バーの描画。表示/非表示が切り替わるとマップの高さが変わるので fit() し直す */
let _guideShown = null, _guideStep = null;
function renderGuideBar() {
  const bar = $("guideBar"); if (!bar) return;
  const step = getTutorialStep();
  const show = !!step && step !== "complete";
  if (show) {
    const d = TUTORIAL_STEPS[step];
    // 建物の改修中はその残り時間を出して「待てばよい」と分かるようにする
    let sub = d.bar;
    if (step === "castle2" || step === "barracks2") {
      const b = getBuilding(step === "castle2" ? "castle" : "barracks");
      if (b.upgradeEndsAt) sub = `改修中… 残り ${fmtSec((b.upgradeEndsAt - now()) / 1000)}`;
    }
    const html = `<span class="guide-no">📜 初陣指南 ${d.no}/${TUTORIAL_ORDER.length}</span>
      <span class="guide-txt"><b>${d.head}</b>　${sub}</span><span class="guide-more">›</span>`;
    if (bar.innerHTML !== html) bar.innerHTML = html;
  }
  if (_guideShown !== show) {
    _guideShown = show;
    bar.style.display = show ? "" : "none";
    if (activeTab === "map") { MapView.fit(); MapView.draw(); }

}

/** tickから呼ぶ: ステップの進行を検出して達成トーストを出し、完了処理も行う */
function checkTutorialProgress() {
  if (!S.tutorial || S.tutorial.completedAt) return;

/* =====================================================================
 * [S17] UI: CITY PLOT — 城タブの箱庭ビュー（ドラッグ配置・タップ強化）
 * 方針: 建物を絶対配置のDOMノードとして城グリッドに並べる。ドラッグで再配置し
 *      座標は S.player.buildings[].x/y に保存、タップでボトムシート強化。
 *      レベルから tier(1-3) を算出し外観（サイズ/装飾/グロー）を変える。
 * ===================================================================*/
let citySig = "";            // 全再構築要否の判定用（[S13] renderCity が参照）
let openBuildingType = null; // 強化シートを開いている建物type（closeSheetでnull）
const TIER_LABEL = ["", "初級", "中級", "上級"];

/** レベル→外観ティア(1..3) */
function buildingTier(level) {
  const [t2, t3] = CONFIG.CITY_TIER_UP;
  return level >= t3 ? 3 : level >= t2 ? 2 : 1;
}
/** グリッドセル(col,row) → 中心の%位置 */
function cellToPct(col, row) {
  return { left: (col + 0.5) / CONFIG.CITY_COLS * 100, top: (row + 0.5) / CONFIG.CITY_ROWS * 100 };
}
/** 0..1相対座標 → 最寄りグリッドセル */
function pctToCell(fx, fy) {
  return {
    col: clamp(Math.floor(fx * CONFIG.CITY_COLS), 0, CONFIG.CITY_COLS - 1),
    row: clamp(Math.floor(fy * CONFIG.CITY_ROWS), 0, CONFIG.CITY_ROWS - 1),
  };
}
/** (col,row)が他建物と重なる場合、渦巻き探索で最寄りの空きセルを返す */
function nearestFreeCell(col, row, exceptType) {
  const occ = new Set(S.player.buildings.filter(b => b.type !== exceptType).map(b => b.x + "," + b.y));
  if (!occ.has(col + "," + row)) return { col, row };
  const maxR = Math.max(CONFIG.CITY_COLS, CONFIG.CITY_ROWS);
  for (let r = 1; r < maxR; r++) {
    for (let dc = -r; dc <= r; dc++) for (let dr = -r; dr <= r; dr++) {
      const c = col + dc, rr = row + dr;
      if (c < 0 || rr < 0 || c >= CONFIG.CITY_COLS || rr >= CONFIG.CITY_ROWS) continue;
      if (!occ.has(c + "," + rr)) return { col: c, row: rr };
    }
  }
  return { col, row };
}

/** 上部サマリー（build時・updateCityLive時 共用） */
function citySummaryHTML() {
  const per = getProdPerHour();
  return `<h3>🏯 本城 Lv${S.player.castleLevel} ｜ 部隊戦力 ${fmt(getArmyPower())}</h3>
    <div class="dim small">毎時 ${RES_KEYS.map(k => RES_DEFS[k].emoji + fmt(per[k])).join(" ")} 💎${fmt(per.diamonds)}
    ｜ 倉庫容量 ${fmt(getStorageCap())}</div>`;
}
/** tick用の署名。type/level/強化中・本城Lvが変われば全再構築（それ以外は軽量更新） */
function citySignature() {
  return S.player.buildings.map(b => b.type + ":" + b.level + (b.upgradeEndsAt ? "U" : "")).join("|")
    + "#" + S.player.castleLevel;
}
/** 建物1つぶんのDOM文字列 */
function cityNodeHTML(b) {
  const def = BUILDING_DEFS[b.type];
  const tier = buildingTier(b.level);
  const pos = cellToPct(b.x ?? 0, b.y ?? 0);
  const cls = "bld tier-" + tier + (b.type === "castle" ? " big" : "") + (b.upgradeEndsAt ? " upgrading" : "");
  const status = b.upgradeEndsAt ? "⏳" + fmtSec((b.upgradeEndsAt - now()) / 1000)
    : (b.level >= def.maxLevel ? "MAX" : "");
  return `<div class="${cls}" data-type="${b.type}" style="left:${pos.left}%;top:${pos.top}%">
      <div class="bld-flags">${"★".repeat(tier)}</div>
      <div class="bld-icon">${artHTML(artTierKey(def.imageKey, b.level), def.emoji)}</div>
      <div class="bld-plat"></div>
      <div class="bld-lv">Lv${b.level}</div>
      <div class="bld-status" id="st-${b.type}">${status}</div></div>`;
}
/** 全建物ノードにドラッグ（移動）＋タップ（強化）を付与 */
function cityAttachDrag() {
  const plot = $("cityPlot");
  if (!plot) return;
  plot.querySelectorAll(".bld").forEach(node => {
    const type = node.dataset.type;
    let sx = 0, sy = 0, moved = false, capId = null;
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      moved = false; sx = e.clientX; sy = e.clientY; capId = e.pointerId;
      node.setPointerCapture(capId); node.classList.add("dragging");
    });
    node.addEventListener("pointermove", e => {
      if (capId === null) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
      if (moved) {
        const r = plot.getBoundingClientRect();
        const fx = clamp((e.clientX - r.left) / r.width, 0.05, 0.95);
        const fy = clamp((e.clientY - r.top) / r.height, 0.07, 0.93);
        node.style.left = fx * 100 + "%"; node.style.top = fy * 100 + "%";
      }
    });
    const end = () => {
      if (capId === null) return;
      try { node.releasePointerCapture(capId); } catch (_) {}
      capId = null; node.classList.remove("dragging");
      if (!moved) { openBuildingSheet(type); return; }   // 動かなければタップ扱い
      const fx = parseFloat(node.style.left) / 100, fy = parseFloat(node.style.top) / 100;
      const cell = pctToCell(fx, fy);
      const free = nearestFreeCell(cell.col, cell.row, type);
      const b = getBuilding(type); b.x = free.col; b.y = free.row;
      const p = cellToPct(free.col, free.row);
      node.style.left = p.left + "%"; node.style.top = p.top + "%";
      saveGame();
    };
    node.addEventListener("pointerup", end);
    node.addEventListener("pointercancel", end);
  });
}
/** 建物の強化ボトムシート（既存 #sheet を再利用） */
function openBuildingSheet(type) {
  openBuildingType = type;
  const b = getBuilding(type), def = BUILDING_DEFS[type], t = now();
  const tier = buildingTier(b.level);
  const prod = def.prodType ? `${RES_DEFS[def.prodType].emoji}${fmt(def.prodBase * b.level)}/h 生産` : def.desc;
  let body = `<h3>${artHTML(artTierKey(def.imageKey, b.level), def.emoji)} ${def.name}
      <span class="dim small">Lv${b.level}・${TIER_LABEL[tier]}${"★".repeat(tier)}</span></h3>
    <div class="dim small" style="margin-top:4px">${prod}</div>`;
  const actions = [];
  if (b.upgradeEndsAt) {
    const rush = getRushCost(b);
    body += `<div class="small" id="sheetCountdown" style="margin-top:8px;color:var(--accent)">⏳ 完成まで ${fmtSec((b.upgradeEndsAt - t) / 1000)}</div>`;
    actions.push(`<button class="primary" ${Math.floor(S.player.diamonds) < rush ? "disabled" : ""}
      onclick="UIA.rush('${type}')">⚡ 即完了（💎<span id="sheetRush">${rush}</span>）</button>`);
  } else if (b.level >= def.maxLevel) {
    body += `<div class="small" style="margin-top:8px">最大レベルに到達しています</div>`;
  } else {
    const cost = getUpgradeCost(b);
    const gated = type !== "castle" && b.level >= S.player.castleLevel;
    const tierUp = buildingTier(b.level + 1) > tier
      ? `<br><span style="color:var(--accent)">✨ 外観が${TIER_LABEL[buildingTier(b.level + 1)]}に育ちます</span>` : "";
    const extra = getExtraSlotCost();
    const poorDia = extra && Math.floor(S.player.diamonds) < extra;
    body += `<div class="small" style="margin-top:8px">Lv${b.level + 1}へ ｜ ${fmtCost(cost)} ｜ ${fmtSec(getUpgradeTimeSec(b))}${
      gated ? `<br><span style="color:var(--danger)">要 本城Lv${b.level + 1}</span>` : ""}${tierUp}${
      extra ? `<br><span style="color:var(--accent)">⚒ 他の普請が進行中 — 同時に進めるには 💎${extra}</span>` : ""}</div>`;
    actions.push(`<button class="primary" ${(!canAfford(cost) || gated || poorDia) ? "disabled" : ""} onclick="UIA.upgrade('${type}')">
      ⬆ アップグレード${extra ? `（💎${extra}）` : ""}</button>`);
  }
  actions.push(`<button onclick="closeSheet()">閉じる</button>`);
  $("sheet").innerHTML = body + `<div class="actions">${actions.join("")}</div>`;
  $("sheet").classList.add("open");
}
/** 毎tickの軽量更新（DOM再構築なし）: サマリー数値・強化中カウントダウン */
function updateCityLive() {
  const sum = $("citySummary"); if (sum) sum.innerHTML = citySummaryHTML();
  const t = now();
  for (const b of S.player.buildings) {
    const st = $("st-" + b.type);
    if (st) st.textContent = b.upgradeEndsAt ? "⏳" + fmtSec((b.upgradeEndsAt - t) / 1000)
      : (b.level >= BUILDING_DEFS[b.type].maxLevel ? "MAX" : "");
  }
  if (openBuildingType) {
    const b = getBuilding(openBuildingType), cd = $("sheetCountdown");
    if (cd && b && b.upgradeEndsAt) cd.textContent = "⏳ 完成まで " + fmtSec((b.upgradeEndsAt - t) / 1000);
  }
}

/* =====================================================================
 * [S16] GAME LOOP & BOOT
 * ===================================================================*/
function renderActiveTab() {
  if (activeTab === "map") MapView.draw();
  else if (activeTab === "city") renderCity();
  else if (activeTab === "cards") renderCards();
  else if (activeTab === "gacha") renderGacha();
  else if (activeTab === "alliance") renderAlliance();
}
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-page").forEach(p => p.classList.toggle("active", p.id === "page-" + tab));
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  closeSheet();
  if (tab === "alliance" && S.chat) S.chat.unseen = 0; // 開いたら既読
  if (tab === "map") MapView.fit();
  renderActiveTab();
  updateChatBadge();
}

/* tickの全再描画がタップ中のボタンを破壊して click を飲み込むのを防ぐ:
 * ポインタが押されている間は再描画をスキップする（clickはpointerupの直後に
 * 発火し、次のtickまでDOMは無傷なので取りこぼさない） */
let pointerHeld = false;
window.addEventListener("pointerdown", () => { pointerHeld = true; }, true);
window.addEventListener("pointerup", () => { pointerHeld = false; }, true);
window.addEventListener("pointercancel", () => { pointerHeld = false; }, true);

/** メインtick（1秒ごと）。dtは実測で計算するためタブ復帰時も破綻しない */
function tick() {
  const t = now();
  const dtSec = clamp((t - S.lastTickAt) / 1000, 0, CONFIG.OFFLINE_CAP_HOURS * 3600);
  S.lastTickAt = t;
  applyEconomy(dtSec);
  applyTroopRecovery(dtSec);
  finishUpgrades(t);
  resolveMarches(t);
  aiTickAll(t);
  chatTick(t);
  incidentTick(t);
  checkTutorialProgress();
  renderHeader();
  renderGuideBar();
  updateChatBadge();
  updateMapBadge();
  // 同盟タブはselect/入力保護のため、構成が変わった時だけ full 再描画（入力中の文字は保全）。
  // タップ中はclick保護のため再描画しない。
  if (!pointerHeld) {
    if (activeTab === "alliance") {
      if (allianceSignature() !== allianceSig) {
        const keep = $("chatInput") ? $("chatInput").value : "";
        renderAlliance();
        if (keep && $("chatInput")) $("chatInput").value = keep;
      } else {
        renderChatLog();
        updateIncidentCountdown();
      }
    } else renderActiveTab();
  }
}

async function boot() {
  await AssetDB.open();
  await AssetDB.loadAll();
  S = loadGame() || newGameState();
  if (S.flags.holyWon || S.flags.capitalWon) showWinBanner();
  // 地形を迂回した行軍距離。1600マスのBFSを起動時に1回だけ（描画中には絶対に呼ばない）
  buildTerrainDistanceMap();
  MapView.init();
  MapView.startAnim();
  if (CONFIG.OFFLINE_PROGRESS) {
    grantOfflineGains();
  } else {
    const gap = shiftTimersForOffline();   // 離席中は世界を止め、続きから再開する
    if (gap > 60000) toast(`⏸️ 離席中（${fmtSec(gap / 1000)}）は時が止まっていました`, "offline");
  }
  S.lastTickAt = now();
  renderHeader();
  renderGuideBar();
  MapView.draw();
  // 初陣指南の導入は初回1回だけ自動表示（閉じてリロードしても再表示しない）
  if (S.tutorial && !S.tutorial.introSeen && !S.tutorial.completedAt) {
    S.tutorial.introSeen = true;
    openTutorialSheet(true);
  }
  // タブバー
  document.querySelectorAll("#tabbar button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  // ループ＆自動保存
  setInterval(tick, CONFIG.TICK_MS);
  setInterval(saveGame, CONFIG.AUTOSAVE_MS);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });
  // Service Worker（http(s)配信時のみ。file://ではスキップ）
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .then(reg => reg.update())
      .catch(e => console.warn("SW registration failed", e));
  }
}
boot();
</script>
