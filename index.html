<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="箱庭SLG">
<title>箱庭クロニクル</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"箱庭クロニクル","short_name":"箱庭SLG","display":"standalone","start_url":".","background_color":"%23141821","theme_color":"%23141821"}'>
<style>
/* =====================================================================
 * スタイル方針: ダークテーマ / モバイル最優先 / 装飾は最小限
 * 色はCSS変数に集約。後からテーマ調整する場合はここだけ触る。
 * ===================================================================*/
:root{
  --bg:#141821; --bg2:#1c222e; --bg3:#252d3d; --line:#333d52;
  --fg:#e8ecf4; --fg-dim:#9aa5bb; --accent:#e8b84a; --danger:#e06060;
  --n:#8b95a8; --r:#5aa0e0; --sr:#b070e0; --ssr:#e8b84a;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;cursor:pointer}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.4;pointer-events:none}
button.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:700}
button.danger{border-color:var(--danger);color:var(--danger)}
select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* ヘッダー資源バー */
#header{display:flex;gap:2px;justify-content:space-around;padding:8px 6px 6px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#header .res{white-space:nowrap}
#header .res b{font-weight:600}

/* メイン領域 */
#main{flex:1;overflow:hidden;position:relative}
.tab-page{position:absolute;inset:0;overflow-y:auto;padding:12px;display:none}
.tab-page.active{display:block}
#page-map{padding:0;overflow:hidden}

/* マップ */
#mapWrap{position:absolute;inset:0}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#0e1118}
#mapCtrl{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px}
#mapCtrl button{width:44px;height:44px;font-size:18px;border-radius:10px;background:rgba(37,45,61,.9)}
#mapInfo{position:absolute;left:10px;top:10px;background:rgba(20,24,33,.85);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;color:var(--fg-dim);max-width:70%}

/* 下部タブバー */
#tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabbar button{flex:1;border:none;border-radius:0;background:none;padding:9px 0 7px;font-size:11px;color:var(--fg-dim)}
#tabbar button .ico{display:block;font-size:19px;margin-bottom:1px}
#tabbar button.active{color:var(--accent)}

/* 汎用カードUI */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.panel h3{font-size:14px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.dim{color:var(--fg-dim);font-size:12px}
.small{font-size:11px}

/* カード一覧 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.unit-card{background:var(--bg2);border:2px solid var(--n);border-radius:10px;padding:8px;position:relative}
.unit-card .art{height:64px;display:flex;align-items:center;justify-content:center;font-size:38px;
  background:var(--bg3);border-radius:6px;margin-bottom:6px;overflow:hidden}
.unit-card .art img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.unit-card .rarity{position:absolute;top:4px;right:6px;font-size:11px;font-weight:700}
.unit-card.rar-N{border-color:var(--n)} .unit-card.rar-N .rarity{color:var(--n)}
.unit-card.rar-R{border-color:var(--r)} .unit-card.rar-R .rarity{color:var(--r)}
.unit-card.rar-SR{border-color:var(--sr)} .unit-card.rar-SR .rarity{color:var(--sr)}
.unit-card.rar-SSR{border-color:var(--ssr);box-shadow:0 0 8px rgba(232,184,74,.35)} .unit-card.rar-SSR .rarity{color:var(--ssr)}

/* ボトムシート（タイル詳細） */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:14px 16px calc(14px + var(--safe-b));transform:translateY(105%);
  transition:transform .18s ease;z-index:30;max-height:60%;overflow-y:auto}
#sheet.open{transform:translateY(0)}
#sheet .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast .msg{background:rgba(20,24,33,.94);border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  font-size:13px;animation:fadein .2s;max-width:100%}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ガチャ結果 */
#gachaResult .card-grid{margin-top:8px}
.rate-table{width:100%;font-size:12px;color:var(--fg-dim)}
.rate-table td{padding:2px 6px}

/* 勝利バナー */
#winBanner{display:none;background:linear-gradient(90deg,#3a2f10,#5a4413);border:1px solid var(--accent);
  color:var(--accent);text-align:center;padding:8px;font-weight:700}
#winBanner.show{display:block}

/* 城の箱庭ビュー */
.city-plot{position:relative;width:100%;height:300px;overflow:hidden;touch-action:pan-y;
  background:radial-gradient(circle at 50% 42%,#2f4030,#20291f 72%);}
.city-plot::before{content:"";position:absolute;inset:0;pointer-events:none;border:9px solid #39352d;
  box-shadow:inset 0 0 0 2px #4c463b, inset 0 0 26px rgba(0,0,0,.55);}
.city-plot::after{content:"";position:absolute;inset:9px;pointer-events:none;opacity:.12;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:calc((100% - 0px)/6) calc((100% - 0px)/5);}
.bld{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;cursor:grab;touch-action:none;z-index:1;transition:left .12s ease,top .12s ease}
.bld.dragging{cursor:grabbing;transition:none;z-index:6;filter:drop-shadow(0 5px 7px rgba(0,0,0,.6))}
.bld .bld-icon{width:48px;height:48px;font-size:30px;line-height:1;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(#3a4152,#2a3040);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.bld .bld-icon img{width:100%;height:100%;object-fit:cover}
.bld .bld-plat{position:absolute;bottom:4px;width:52px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.4);z-index:-1;filter:blur(1px)}
.bld .bld-flags{height:11px;font-size:9px;letter-spacing:-1px;color:var(--accent);text-shadow:0 1px 2px #000}
.bld .bld-lv{font-size:10px;font-weight:700;background:rgba(20,24,33,.88);border:1px solid var(--line);
  border-radius:6px;padding:0 5px;color:var(--fg)}
.bld .bld-status{min-height:11px;font-size:9px;color:var(--accent)}
/* 外観ティア（レベルで育つ） */
.bld.tier-2 .bld-icon{width:54px;height:54px;font-size:34px;border-color:#6b7488;
  background:linear-gradient(#454e63,#333b4d)}
.bld.tier-3 .bld-icon{width:60px;height:60px;font-size:38px;border-color:var(--accent);
  background:linear-gradient(#5a5230,#3a3420);box-shadow:0 0 10px rgba(232,184,74,.45)}
.bld.big .bld-icon{width:58px;height:58px;font-size:40px}
.bld.big.tier-2 .bld-icon{width:66px;height:66px;font-size:46px}
.bld.big.tier-3 .bld-icon{width:74px;height:74px;font-size:52px}
.bld.upgrading .bld-icon{animation:bldpulse 1s infinite}
@keyframes bldpulse{0%,100%{filter:none}50%{filter:brightness(1.45)}}
</style>
</head>
<body>

<header id="header"></header>
<div id="winBanner">⛩️ 聖地制圧！ 天下統一まであと一歩 ⛩️</div>

<main id="main">
  <!-- ▼ マップ -->
  <section class="tab-page active" id="page-map">
    <div id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div id="mapInfo">読み込み中…</div>
      <div id="mapCtrl">
        <button id="zoomIn">＋</button>
        <button id="zoomOut">－</button>
        <button id="zoomHome">🏯</button>
      </div>
    </div>
  </section>
  <!-- ▼ 城（内政） -->
  <section class="tab-page" id="page-city"></section>
  <!-- ▼ カード -->
  <section class="tab-page" id="page-cards"></section>
  <!-- ▼ ガチャ -->
  <section class="tab-page" id="page-gacha"></section>
  <!-- ▼ 同盟 -->
  <section class="tab-page" id="page-alliance"></section>
</main>

<nav id="tabbar">
  <button data-tab="map" class="active"><span class="ico">🗺️</span>マップ</button>
  <button data-tab="city"><span class="ico">🏯</span>城</button>
  <button data-tab="cards"><span class="ico">🎴</span>カード</button>
  <button data-tab="gacha"><span class="ico">💎</span>ガチャ</button>
  <button data-tab="alliance"><span class="ico">🤝</span>同盟</button>
</nav>

<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
 * 箱庭クロニクル — 単一HTML箱庭SLG（土台実装）
 *
 * コード全体はセクション [S01]〜[S16] に分割。検索は「[Sxx]」で。
 *   [S01] CONFIG            — 全バランス定数（調整はここだけ）
 *   [S02] STATIC DEFS       — 建物/カード/役職/AI名 の静的定義
 *   [S03] UTILS             — 汎用ヘルパー
 *   [S04] PERSISTENCE       — localStorage セーブ + IndexedDB 画像
 *   [S05] WORLD GEN         — マップ生成・AI配置
 *   [S06] STATE INIT        — セーブデータのスキーマ定義と初期化
 *   [S07] ECONOMY           — 資源/ダイヤ生産・オフライン精算
 *   [S08] BUILDINGS         — アップグレード
 *   [S09] MILITARY          — 戦力計算・出兵・制圧・放棄
 *   [S10] GACHA             — 排出・天井
 *   [S11] ALLIANCE          — 勧誘・役職・バフ
 *   [S12] AI USERS          — ルールベースAIの状態機械
 *   [S13] UI: PANELS        — 各タブのDOM描画
 *   [S14] UI: MAP CANVAS    — マップ描画・パン/ズーム/タップ
 *   [S15] UI: ACTIONS       — ボタンから呼ばれる操作(UIA.*)
 *   [S16] GAME LOOP & BOOT  — tick / autosave / 起動処理
 *   [S17] UI: CITY PLOT     — 城タブの箱庭ビュー（ドラッグ配置・タップ強化）
 *
 * 設計原則:
 *  - 可変状態はグローバル `S` 1個のみ。S をJSON化したものがセーブデータ。
 *  - 静的定義（BUILDING_DEFS等）はセーブに含めない。S には id/level 等の最小情報のみ。
 *  - 派生値（生産量・コスト・戦力）は毎回計算する。キャッシュしない。
 *  - 時刻はすべて Date.now() のエポックms絶対値で持つ（オフライン跨ぎ対応）。
 * ===================================================================*/

/* =====================================================================
 * [S01] CONFIG — 全バランス定数
 * ===================================================================*/
const CONFIG = {
  SAVE_KEY: "hakoslg_save_v1",          // localStorageキー（名前空間 hakoslg_）
  ASSET_DB: "hakoslg_assets",           // IndexedDB名（画像アセット）
  SAVE_VERSION: 2,                     // v2: buildings に城内配置座標 x,y を追加

  WORLD_SIZE: 40,                       // 40x40 グリッド
  TICK_MS: 1000,                        // ゲームtick間隔
  AUTOSAVE_MS: 10000,                   // 自動保存間隔
  OFFLINE_CAP_HOURS: 12,                // オフライン収益の上限時間

  // --- 資源・生産 ---
  START_RESOURCES: { food: 1000, wood: 1000, stone: 600, iron: 300 },
  START_DIAMONDS: 1000,
  TILE_PROD_PER_LEVEL_PER_HOUR: 200,    // 領有資源タイル: level×この値/時 を生産
  WAREHOUSE_CAP_BASE: 6000,             // 倉庫容量 = BASE × lv^1.7
  LAB_PROD_BONUS_PER_LEVEL: 0.02,       // 研究所: 全資源生産 +2%/lv

  // --- ダイヤ（プレミア通貨を領土で稼ぐ、が本作のキモ） ---
  DIAMOND_PER_TILELEVEL_PER_HOUR: 6,    // Σ(領有タイルlevel) × この値/時
  DIAMOND_HOLY_LEVEL_MULT: 3,           // 聖地はlevelを3倍換算
  DIAMOND_CAPTURE_BONUS_PER_LEVEL: 20,  // 新規制圧時の一時金

  // --- 戦闘 ---
  MAX_MARCHES: 1,                       // 同時出兵数（将来: 兵舎Lvで増やす想定）
  MARCH_TILES_PER_SEC: 2,               // 行軍速度（タイル/秒）
  MARCH_MIN_SEC: 3,
  MARCH_FOOD_COST: 100,                 // 出兵1回の食料コスト
  TILE_DEF_BASE: 80,                    // 防御 = BASE × level^1.5
  TILE_DEF_EMPTY_MULT: 0.3,             // 空地は防御3割
  TILE_DEF_AI_PER_CASTLE_LV: 80,        // AI領有タイルは +AI城Lv×この値
  HOLY_DEF: 4000,                       // 聖地の固定防御力
  ARMY_TOP_CARDS: 5,                    // 出撃編成: 戦力上位N枚を自動採用
  POWER_PER_BARRACKS_LV: 60,
  POWER_PER_CASTLE_LV: 25,
  REQUIRE_ADJACENCY: true,              // 自領に隣接するタイルのみ出兵可

  // --- ガチャ（甘め設計） ---
  GACHA_COST_SINGLE: 100,
  GACHA_COST_TEN: 900,
  GACHA_RATES: { SSR: 0.05, SR: 0.15, R: 0.35, N: 0.45 },
  GACHA_PITY_SSR: 50,                   // 50連でSSR確定
  GACHA_TEN_GUARANTEE: "SR",            // 10連でSR以上1枚保証

  // --- 勧誘 ---
  RECRUIT_FOOD_COST: 500,
  RECRUIT_BASE_CHANCE: 0.5,
  RECRUIT_CHANCE_PER_LV_DIFF: 0.06,     // (自城Lv−AI城Lv)×この値を加算
  RECRUIT_COOLDOWN_SEC: 60,

  // --- ワールド生成 ---
  AI_COUNT: 10,
  AI_MIN_DIST_CENTER: 6,                // AI城は中心からこの距離以上
  AI_MIN_DIST_EACH: 5,                  // AI城同士の最低距離
  RESOURCE_TILE_RATIO: 0.45,            // 空地でない確率
  LEVEL_BAND: 4,                        // チェビシェフ距離÷この値でタイルLv帯を決定

  // --- 城ビュー（箱庭配置） ---
  CITY_COLS: 6,                         // 城内グリッド列数（ドラッグのスナップ先）
  CITY_ROWS: 5,                         // 城内グリッド行数
  CITY_TIER_UP: [6, 11],               // このLv以上で外観ティアが 2 / 3 に上がる
};

/* =====================================================================
 * [S02] STATIC DEFS — 静的定義（セーブに含めない）
 * ===================================================================*/

/** 資源種別の表示定義 */
const RES_DEFS = {
  food:  { name: "食料", emoji: "🌾" },
  wood:  { name: "木材", emoji: "🪵" },
  stone: { name: "石材", emoji: "🪨" },
  iron:  { name: "鉄",   emoji: "⚙️" },
};
const RES_KEYS = ["food", "wood", "stone", "iron"];

/**
 * 建物の静的定義。
 * Building仕様: { id, type, level, upgradeEndsAt } をインスタンスとして持ち、
 * prodType/prodRate/upgradeCost/upgradeTime はここから計算する。
 *  - prodBase: level×prodBase が毎時生産量
 *  - costBase/costGrowth: Lv n→n+1 のコスト = ceil(costBase × costGrowth^(n-1))
 *  - timeBaseSec: Lv n→n+1 の所要時間 = timeBaseSec × n 秒
 */
const BUILDING_DEFS = {
  castle:    { name: "本城",   emoji: "🏯", imageKey: "bld_castle",    prodType: null,    prodBase: 0,
               maxLevel: 15, costBase: { food: 200, wood: 200, stone: 150, iron: 80 }, costGrowth: 1.6, timeBaseSec: 20,
               desc: "全建物のレベル上限。戦力にも加算" },
  farm:      { name: "農場",   emoji: "🌾", imageKey: "bld_farm",      prodType: "food",  prodBase: 600,
               maxLevel: 15, costBase: { wood: 100, stone: 50 },                        costGrowth: 1.5, timeBaseSec: 10,
               desc: "食料を生産" },
  sawmill:   { name: "伐採所", emoji: "🪵", imageKey: "bld_sawmill",   prodType: "wood",  prodBase: 600,
               maxLevel: 15, costBase: { food: 100, stone: 50 },                        costGrowth: 1.5, timeBaseSec: 10,
               desc: "木材を生産" },
  quarry:    { name: "採石場", emoji: "🪨", imageKey: "bld_quarry",    prodType: "stone", prodBase: 400,
               maxLevel: 15, costBase: { food: 100, wood: 100 },                        costGrowth: 1.5, timeBaseSec: 12,
               desc: "石材を生産" },
  ironMine:  { name: "製鉄所", emoji: "⚙️", imageKey: "bld_ironmine",  prodType: "iron",  prodBase: 300,
               maxLevel: 15, costBase: { food: 120, wood: 120, stone: 60 },             costGrowth: 1.5, timeBaseSec: 14,
               desc: "鉄を生産" },
  barracks:  { name: "兵舎",   emoji: "⚔️", imageKey: "bld_barracks",  prodType: null,    prodBase: 0,
               maxLevel: 15, costBase: { food: 150, wood: 150, iron: 50 },              costGrowth: 1.55, timeBaseSec: 15,
               desc: "部隊戦力 +" + CONFIG.POWER_PER_BARRACKS_LV + "/Lv" },
  lab:       { name: "研究所", emoji: "📜", imageKey: "bld_lab",       prodType: null,    prodBase: 0,
               maxLevel: 15, costBase: { wood: 200, stone: 150, iron: 100 },            costGrowth: 1.6, timeBaseSec: 18,
               desc: "全資源生産 +2%/Lv（研究ツリーは未実装）" },
  warehouse: { name: "倉庫",   emoji: "🏬", imageKey: "bld_warehouse", prodType: null,    prodBase: 0,
               maxLevel: 15, costBase: { wood: 150, stone: 150 },                       costGrowth: 1.5, timeBaseSec: 12,
               desc: "資源の保管容量を拡大" },
};

/** 建物の初期配置（城内グリッド col,row）。ユーザーはドラッグで自由に変更でき、x,yはSに保存される。 */
const DEFAULT_BUILDING_LAYOUT = {
  lab:       { x: 0, y: 1 },
  farm:      { x: 1, y: 1 },
  sawmill:   { x: 2, y: 1 },
  quarry:    { x: 3, y: 1 },
  ironMine:  { x: 4, y: 1 },
  barracks:  { x: 5, y: 1 },
  castle:    { x: 2, y: 3 },
  warehouse: { x: 4, y: 3 },
};

/**
 * カードプール（ガチャ排出の全カード静的定義）。
 * Card仕様: { id, name, rarity, atk(武力), int(知力), lead(統率), imageKey, emoji }
 * imageKey は IndexedDB 内の画像キー。未登録なら emoji でプレースホルダー描画。
 */
const RARITY_MULT = { N: 1.0, R: 1.2, SR: 1.5, SSR: 2.0 };
const CARD_POOL = [
  // --- SSR ---
  { id: "ssr_tenba",   name: "覇王・天羽",   rarity: "SSR", atk: 95, int: 70, lead: 90, emoji: "👑", imageKey: "card_ssr_tenba" },
  { id: "ssr_byakuren",name: "軍神・白蓮",   rarity: "SSR", atk: 88, int: 92, lead: 85, emoji: "⚡", imageKey: "card_ssr_byakuren" },
  { id: "ssr_saya",    name: "聖女・沙耶",   rarity: "SSR", atk: 70, int: 95, lead: 88, emoji: "🌸", imageKey: "card_ssr_saya" },
  { id: "ssr_benimaru",name: "鬼神・紅丸",   rarity: "SSR", atk: 97, int: 60, lead: 82, emoji: "🔥", imageKey: "card_ssr_benimaru" },

const $ = id => document.getElementById(id);
const now = () => Date.now();
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const uid = prefix => prefix + "_" + now().toString(36) + "_" + (_uidCounter++).toString(36);

/** 数値表示: 1234→1,234 / 56789→56.8k / 1234567→1.23M */
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "k";
  return n.toLocaleString();
}
/** 秒数表示: 90→"1分30秒" */
function fmtSec(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec < 60) return sec + "秒";
  if (sec < 3600) return Math.floor(sec / 60) + "分" + (sec % 60 ? sec % 60 + "秒" : "");
  return Math.floor(sec / 3600) + "時間" + Math.floor((sec % 3600) / 60) + "分";
}
/** コストオブジェクト {food:100,...} → "🌾100 🪵50" */
function fmtCost(cost) {
  return Object.entries(cost).map(([k, v]) => RES_DEFS[k].emoji + fmt(v)).join(" ");
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "msg";
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* =====================================================================
 * [S04] PERSISTENCE — localStorage(セーブ) + IndexedDB(画像)
 * ===================================================================*/
function saveGame() {
  try {
    S.lastSavedAt = now();
    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(S));
  } catch (e) { console.error("save failed", e); }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return migrateSave(data);
  } catch (e) { console.error("load failed", e); return null; }
}
/** 旧セーブを現行スキーマへ移行（欠損フィールドの補完のみ・非破壊）。 */
function migrateSave(data) {
  if (!data || !data.player) return data;
  // v1 → v2: 建物に城内配置座標 {x,y} を付与
  for (const b of data.player.buildings) {
    if (b.x == null || b.y == null) {
      const p = DEFAULT_BUILDING_LAYOUT[b.type] || { x: 0, y: 0 };
      b.x = p.x; b.y = p.y;
    }
  }
  data.version = CONFIG.SAVE_VERSION;
  return data;
}
function resetGame() {
  localStorage.removeItem(CONFIG.SAVE_KEY);
  location.reload();
}

const AssetDB = {
  db: null,
  open() {
    return new Promise(resolve => {
      const req = indexedDB.open(CONFIG.ASSET_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore("images");
      req.onsuccess = () => { AssetDB.db = req.result; resolve(true); };
      req.onerror = () => { console.warn("IndexedDB unavailable"); resolve(false); };
    });
  },
  put(key, blob) {
    return new Promise((resolve, reject) => {
      if (!AssetDB.db) return reject("no db");
      const tx = AssetDB.db.transaction("images", "readwrite");
      tx.objectStore("images").put(blob, key);
      tx.oncomplete = () => { ASSET_URLS[key] = URL.createObjectURL(blob); resolve(); };
      tx.onerror = () => reject(tx.error);
    });
  },
  loadAll() {
    return new Promise(resolve => {
      if (!AssetDB.db) return resolve();
      const tx = AssetDB.db.transaction("images", "readonly");
      const store = tx.objectStore("images");
      const req = store.openCursor();
      req.onsuccess = () => {
        const cur = req.result;
        if (cur) { ASSET_URLS[cur.key] = URL.createObjectURL(cur.value); cur.continue(); }
        else resolve();
      };
      req.onerror = () => resolve();
    });
  },
};
/** imageKey に対応する <img> か絵文字プレースホルダーのHTMLを返す */
function artHTML(imageKey, emoji) {
  const src = ASSET_URLS[imageKey] || ART_DATA[imageKey]; // 取り込み優先 > 同梱 > 絵文字
  return src ? `<img src="${src}" alt="">` : (emoji || "❔");
}
/**
 * 建物の外観ティアに応じた imageKey を返す。
 * キー体系: 基本 "bld_castle" / ティア2 "bld_castle_t2" / ティア3 "bld_castle_t3"。
 * 現ティアのアートが無ければ下位ティアへ、最終的に基本キーへフォールバック
 * （＝ティア用アート未配置でも基本アートで安全に描画される）。
 */
function artTierKey(baseKey, level) {
  for (let t = buildingTier(level); t >= 2; t--) {
    const k = baseKey + "_t" + t;
    if (ASSET_URLS[k] || ART_DATA[k]) return k;
  }
  return baseKey;
}

/* =====================================================================
 * [S05] WORLD GEN — マップ生成・AI配置
 * ===================================================================*/
const SIZE = CONFIG.WORLD_SIZE;
const idx = (x, y) => y * SIZE + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < SIZE && y < SIZE;
const chebyshev = (x1, y1, x2, y2) => Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2));
const CENTER = Math.floor(SIZE / 2); // プレイヤー本城座標 (20,20)

/**
 * World.tiles を生成。tile = { x, y, type, level, ownerId }
 *  - level: 中心からの距離帯で1〜5（外周ほど高い）。聖地は6。
 *  - 聖地: 四隅付近に4箇所。いずれか1つの領有が勝利条件。
 */
function generateWorld() {
  const tiles = [];
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const d = chebyshev(x, y, CENTER, CENTER);
      const level = clamp(Math.floor(d / CONFIG.LEVEL_BAND) + 1, 1, 5);
      const type = Math.random() < CONFIG.RESOURCE_TILE_RATIO ? pick(RES_KEYS) : "empty";
      tiles.push({ x, y, type, level, ownerId: null });
    }
  }
  // プレイヤー本城（中心）
  tiles[idx(CENTER, CENTER)] = { x: CENTER, y: CENTER, type: "castle", level: 1, ownerId: "player" };
  // 聖地×4（四隅から少し内側）
  for (const [hx, hy] of [[4, 4], [SIZE - 5, 4], [4, SIZE - 5], [SIZE - 5, SIZE - 5]]) {
    tiles[idx(hx, hy)] = { x: hx, y: hy, type: "holy", level: 6, ownerId: null };
  }
  return { size: SIZE, tiles };
}

/** AIUser を生成し、city タイルを world に配置する */
function generateAIUsers(world) {
  const users = [];
  let guard = 0;
  while (users.length < CONFIG.AI_COUNT && guard++ < 2000) {
    const x = randInt(2, SIZE - 3), y = randInt(2, SIZE - 3);
    const t = world.tiles[idx(x, y)];
    if (t.type === "castle" || t.type === "holy") continue;
    if (chebyshev(x, y, CENTER, CENTER) < CONFIG.AI_MIN_DIST_CENTER) continue;
    if (users.some(u => chebyshev(x, y, u.x, u.y) < CONFIG.AI_MIN_DIST_EACH)) continue;
    const i = users.length;
    const ai = {
      id: "ai_" + i,
      name: AI_NAMES[i] || "AI" + i,
      color: AI_COLORS[i] || "#888",
      x, y,
      castleLevel: randInt(1, 3),
      personality: pick(["expander", "expander", "balanced", "balanced", "turtle"]),
      recruitable: Math.random() < 0.6,
      allianceId: null,
      ownedTiles: [],          // AIが領有する資源タイルindex（城タイルは含まない）
      nextActionAt: 0,         // 次に行動する絶対時刻(ms)
      nextRecruitAt: 0,        // 勧誘再試行可能時刻(ms)
    };
    world.tiles[idx(x, y)] = { x, y, type: "castle", level: ai.castleLevel, ownerId: ai.id };
    users.push(ai);
  }
  return users;
}

/* =====================================================================
 * [S06] STATE INIT — セーブデータのスキーマ
 * ===================================================================*/
/**
 * S（＝セーブデータ）の完全スキーマ:
 * {
 *   version: number,            // セーブ形式バージョン（マイグレーション用）
 *   createdAt, lastSavedAt, lastTickAt: number(ms),
 *   world: { size, tiles[] },   // tile = {x,y,type,level,ownerId}
 *   player: {
 *     castleLevel: number,      // buildings内 castle.level のミラー（参照高速化）
 *     buildings: [ {id,type,level,upgradeEndsAt|null, x,y} ], // x,y=城内グリッド座標(配置)
 *     resources: {food,wood,stone,iron},   // 浮動小数。表示はfloor
 *     diamonds: number,         // プレミア通貨。容量キャップなし
 *     ownedTiles: [tileIndex],  // 制圧済みタイル（自城タイルは含まない）
 *     cards: [ {uid,defId,obtainedAt} ],   // ガチャ獲得カード（重複可）
 *     allianceId: string,
 *     marches: [ {id,targetIdx,power,departAt,arriveAt} ],
 *     gacha: { sinceSSR, total },          // 天井カウンタ・総回数
 *   },
 *   alliance: { id, name, members:[{id,role}] },  // 現状プレイヤー同盟1つのみ
 *   aiUsers: [ AIUser ],        // スキーマは generateAIUsers 参照
 *   flags: { holyWon: bool },   // 一度きりイベントの発火記録
 * }
 */
function newGameState() {
  const world = generateWorld();
  const aiUsers = generateAIUsers(world);
  const t = now();
  return {
    version: CONFIG.SAVE_VERSION,
    createdAt: t, lastSavedAt: t, lastTickAt: t,
    world,
    player: {
      castleLevel: 1,
      buildings: Object.keys(BUILDING_DEFS).map(type => {
        const p = DEFAULT_BUILDING_LAYOUT[type] || { x: 0, y: 0 };
        return { id: "b_" + type, type, level: 1, upgradeEndsAt: null, x: p.x, y: p.y };
      }),
      resources: { ...CONFIG.START_RESOURCES },
      diamonds: CONFIG.START_DIAMONDS,
      ownedTiles: [],
      cards: [
        { uid: uid("c"), defId: "n_taichi", obtainedAt: t },
        { uid: uid("c"), defId: "n_kosuzu", obtainedAt: t },
      ],
      allianceId: "ally_player",
      marches: [],
      gacha: { sinceSSR: 0, total: 0 },
    },
    alliance: { id: "ally_player", name: "無名同盟", members: [{ id: "player", role: "盟主" }] },
    aiUsers,
    flags: { holyWon: false },
  };
}

let S = null; // グローバル可変状態（唯一）

/* =====================================================================
 * [S07] ECONOMY — 生産・オフライン精算
 * ===================================================================*/
/** 毎時生産量 {food,wood,stone,iron,diamonds} を現在の状態から計算 */
function getProdPerHour() {
  const buffs = getAllianceBuffs();
  const labLv = getBuilding("lab").level;
  const mult = (1 + CONFIG.LAB_PROD_BONUS_PER_LEVEL * labLv) * (buffs.prod || 1);
  const out = { food: 0, wood: 0, stone: 0, iron: 0, diamonds: 0 };
  // 建物生産
  for (const b of S.player.buildings) {
    const def = BUILDING_DEFS[b.type];
    if (def.prodType) out[def.prodType] += def.prodBase * b.level;
  }
  // 領有タイル生産＋ダイヤ
  let tileLevelSum = 0;
  for (const ti of S.player.ownedTiles) {
    const t = S.world.tiles[ti];
    if (RES_KEYS.includes(t.type)) {
      out[t.type] += CONFIG.TILE_PROD_PER_LEVEL_PER_HOUR * t.level;
      tileLevelSum += t.level;
    } else if (t.type === "holy") {
      tileLevelSum += t.level * CONFIG.DIAMOND_HOLY_LEVEL_MULT;
    } else if (t.type === "empty") {
      tileLevelSum += t.level * 0.25; // 空地は微量のダイヤのみ
    }
  }
  for (const k of RES_KEYS) out[k] *= mult;
  out.diamonds = tileLevelSum * CONFIG.DIAMOND_PER_TILELEVEL_PER_HOUR;
  return out;
}
/** 倉庫容量（食料/木材/石材/鉄の各上限） */
function getStorageCap() {
  const lv = getBuilding("warehouse").level;
  return Math.floor(CONFIG.WAREHOUSE_CAP_BASE * Math.pow(lv, 1.7));
}
/** dtSec 秒ぶんの生産を適用 */
function applyEconomy(dtSec) {
  const per = getProdPerHour();
  const cap = getStorageCap();
  for (const k of RES_KEYS) {
    S.player.resources[k] = Math.min(cap, S.player.resources[k] + per[k] * dtSec / 3600);
  }
  S.player.diamonds += per.diamonds * dtSec / 3600;
}
/** 起動時のオフライン精算（上限 OFFLINE_CAP_HOURS） */
function grantOfflineGains() {
  const elapsedSec = (now() - S.lastTickAt) / 1000;
  if (elapsedSec < 60) return;
  const capped = Math.min(elapsedSec, CONFIG.OFFLINE_CAP_HOURS * 3600);
  const before = { ...S.player.resources, diamonds: S.player.diamonds };
  applyEconomy(capped);
  const gains = RES_KEYS.map(k => {
    const g = Math.floor(S.player.resources[k] - before[k]);
    return g > 0 ? RES_DEFS[k].emoji + fmt(g) : null;
  }).filter(Boolean).join(" ");
  const dg = Math.floor(S.player.diamonds - before.diamonds);
  toast(`⏰ オフライン収益（${fmtSec(capped)}分）: ${gains}${dg > 0 ? " 💎" + fmt(dg) : ""}`);
}

/* =====================================================================
 * [S08] BUILDINGS — アップグレード
 * ===================================================================*/
function getBuilding(type) { return S.player.buildings.find(b => b.type === type); }
/** Lv b.level → b.level+1 のコスト */
function getUpgradeCost(b) {
  const def = BUILDING_DEFS[b.type];
  const cost = {};
  for (const [k, v] of Object.entries(def.costBase)) {
    cost[k] = Math.ceil(v * Math.pow(def.costGrowth, b.level - 1));
  }
  return cost;
}
function getUpgradeTimeSec(b) { return BUILDING_DEFS[b.type].timeBaseSec * b.level; }
function canAfford(cost) { return Object.entries(cost).every(([k, v]) => S.player.resources[k] >= v); }
function payCost(cost) { for (const [k, v] of Object.entries(cost)) S.player.resources[k] -= v; }
/** アップグレード開始。失敗理由の文字列 or null(成功) を返す */
function startUpgrade(type) {
  const b = getBuilding(type);
  const def = BUILDING_DEFS[type];
  if (b.upgradeEndsAt) return "アップグレード中です";
  if (b.level >= def.maxLevel) return "最大レベルです";
  if (type !== "castle" && b.level >= S.player.castleLevel) return "本城レベルが必要です";
  const cost = getUpgradeCost(b);
  if (!canAfford(cost)) return "資源が足りません";
  payCost(cost);
  b.upgradeEndsAt = now() + getUpgradeTimeSec(b) * 1000;
  return null;
}
/** tickから呼ばれる。完了したアップグレードを反映 */
function finishUpgrades(t) {
  for (const b of S.player.buildings) {
    if (b.upgradeEndsAt && t >= b.upgradeEndsAt) {
      b.level++;
      b.upgradeEndsAt = null;
      if (b.type === "castle") S.player.castleLevel = b.level;
      toast(`${BUILDING_DEFS[b.type].emoji} ${BUILDING_DEFS[b.type].name} が Lv${b.level} になりました`);
    }
  }
}

/* =====================================================================
 * [S09] MILITARY — 戦力・出兵・制圧
 * ===================================================================*/
/** カード1枚の戦力 */
function cardPower(defId) {
  const d = CARD_BY_ID[defId];
  return Math.round((d.atk * 1.2 + d.lead * 1.0 + d.int * 0.6) * RARITY_MULT[d.rarity]);
}
/** 出撃部隊の総戦力（戦力上位N枚 自動編成 + 兵舎 + 本城 + 将軍バフ） */
function getArmyPower() {
  const top = S.player.cards.map(c => cardPower(c.defId)).sort((a, b) => b - a).slice(0, CONFIG.ARMY_TOP_CARDS);
  const base = top.reduce((a, b) => a + b, 0)
    + getBuilding("barracks").level * CONFIG.POWER_PER_BARRACKS_LV
    + S.player.castleLevel * CONFIG.POWER_PER_CASTLE_LV;
  return Math.round(base * (getAllianceBuffs().power || 1));
}
/** タイルの防御力 */
function getTileDefense(ti) {
  const t = S.world.tiles[ti];
  if (t.type === "holy") return CONFIG.HOLY_DEF;
  let def = CONFIG.TILE_DEF_BASE * Math.pow(t.level, 1.5);
  if (t.type === "empty") def *= CONFIG.TILE_DEF_EMPTY_MULT;
  if (t.ownerId && t.ownerId !== "player") {
    const ai = S.aiUsers.find(a => a.id === t.ownerId);
    if (ai) def += ai.castleLevel * CONFIG.TILE_DEF_AI_PER_CASTLE_LV;
  }
  return Math.round(def);
}
/** タイルが自領（自城含む）に8方向で隣接しているか */
function isAdjacentToOwned(ti) {
  const t = S.world.tiles[ti];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = t.x + dx, ny = t.y + dy;
    if (inBounds(nx, ny) && S.world.tiles[idx(nx, ny)].ownerId === "player") return true;
  }
  return false;
}
/** 出兵開始。失敗理由 or null */
function startMarch(ti) {
  const t = S.world.tiles[ti];
  if (S.player.marches.length >= CONFIG.MAX_MARCHES) return "出兵中の部隊が帰還していません";
  if (t.ownerId === "player") return "すでに領有しています";
  if (t.type === "castle") return "他プレイヤーの城は攻撃できません（未実装）";
  if (CONFIG.REQUIRE_ADJACENCY && !isAdjacentToOwned(ti)) return "自領に隣接するタイルにのみ出兵できます";
  if (S.player.resources.food < CONFIG.MARCH_FOOD_COST) return "食料が足りません（" + CONFIG.MARCH_FOOD_COST + "必要）";
  S.player.resources.food -= CONFIG.MARCH_FOOD_COST;
  const dist = chebyshev(t.x, t.y, CENTER, CENTER);
  const speed = CONFIG.MARCH_TILES_PER_SEC * (getAllianceBuffs().speed || 1);
  const sec = Math.max(CONFIG.MARCH_MIN_SEC, dist / speed);
  S.player.marches.push({ id: uid("m"), targetIdx: ti, power: getArmyPower(), departAt: now(), arriveAt: now() + sec * 1000 });
  return null;
}
/** tickから呼ばれる。到着した出兵を解決（帰還は省略＝即時） */
function resolveMarches(t) {
  const done = S.player.marches.filter(m => t >= m.arriveAt);
  if (!done.length) return;
  S.player.marches = S.player.marches.filter(m => t < m.arriveAt);
  for (const m of done) {
    const tile = S.world.tiles[m.targetIdx];
    const def = getTileDefense(m.targetIdx);
    if (m.power >= def) {
      // 前所有者（AI）から剥奪
      if (tile.ownerId && tile.ownerId !== "player") {
        const ai = S.aiUsers.find(a => a.id === tile.ownerId);
        if (ai) ai.ownedTiles = ai.ownedTiles.filter(i => i !== m.targetIdx);
      }
      tile.ownerId = "player";
      S.player.ownedTiles.push(m.targetIdx);
      const bonus = CONFIG.DIAMOND_CAPTURE_BONUS_PER_LEVEL * tile.level;
      S.player.diamonds += bonus;
      toast(`⚔️ ${TILE_DEFS[tile.type].name}Lv${tile.level} を制圧！ 💎+${bonus}`);
      if (tile.type === "holy" && !S.flags.holyWon) {
        S.flags.holyWon = true;
        $("winBanner").classList.add("show");
        toast("🎉 勝利条件達成！ 聖地を領有しました！");
      }
    } else {
      toast(`💥 出兵失敗… 戦力${fmt(m.power)} < 防御${fmt(def)}`);
    }
  }
}
/** 領有タイルの放棄（隣接経路の付け替え用） */
function abandonTile(ti) {
  const t = S.world.tiles[ti];
  if (t.ownerId !== "player" || t.type === "castle") return "放棄できません";
  t.ownerId = null;
  S.player.ownedTiles = S.player.ownedTiles.filter(i => i !== ti);
  return null;
}

/* =====================================================================
 * [S10] GACHA — 排出・天井
 * ===================================================================*/
/** レア度を1回抽選（天井処理込み） */
function rollRarity() {
  S.player.gacha.total++;
  S.player.gacha.sinceSSR++;
  if (S.player.gacha.sinceSSR >= CONFIG.GACHA_PITY_SSR) { S.player.gacha.sinceSSR = 0; return "SSR"; }
  let r = Math.random();
  for (const [rar, p] of Object.entries(CONFIG.GACHA_RATES)) {
    if (r < p) {
      if (rar === "SSR") S.player.gacha.sinceSSR = 0;
      return rar;
    }
    r -= p;
  }
  return "N";
}
/**
 * ガチャ実行。count=1|10。
 * 戻り値: 獲得カードdef配列 / 失敗時はnull（ダイヤ不足）
 */
function doGacha(count) {
  const cost = count === 10 ? CONFIG.GACHA_COST_TEN : CONFIG.GACHA_COST_SINGLE;
  if (Math.floor(S.player.diamonds) < cost) return null;
  S.player.diamonds -= cost;
  const results = [];
  for (let i = 0; i < count; i++) {
    const rar = rollRarity();
    results.push(pick(CARD_POOL.filter(c => c.rarity === rar)));
  }
  // 10連保証: SR以上が1枚もなければ最後の1枚をSRに差し替え
  if (count === 10 && !results.some(c => c.rarity === "SR" || c.rarity === "SSR")) {
    results[9] = pick(CARD_POOL.filter(c => c.rarity === CONFIG.GACHA_TEN_GUARANTEE));
  }
  const t = now();
  for (const def of results) S.player.cards.push({ uid: uid("c"), defId: def.id, obtainedAt: t });
  return results;
}

/* =====================================================================
 * [S11] ALLIANCE — 勧誘・役職・バフ
 * ===================================================================*/
/** 同盟の役職バフを集計。{power,prod,speed} の乗数（未設定は1） */
function getAllianceBuffs() {
  const out = {};
  if (!S) return out;
  for (const m of S.alliance.members) {
    const buff = (ROLE_DEFS[m.role] || {}).buff || {};
    for (const [k, v] of Object.entries(buff)) out[k] = Math.max(out[k] || 1, v);
  }
  return out;
}
/** AI勧誘。失敗理由 or null（成功/失敗はトーストで通知） */
function recruitAI(aiId) {
  const ai = S.aiUsers.find(a => a.id === aiId);
  if (!ai || !ai.recruitable) return "勧誘できない相手です";
  if (ai.allianceId) return "すでに同盟所属です";
  if (now() < ai.nextRecruitAt) return "しばらく待ってから再勧誘してください（" + fmtSec((ai.nextRecruitAt - now()) / 1000) + "）";
  if (S.player.resources.food < CONFIG.RECRUIT_FOOD_COST) return "食料が足りません（" + CONFIG.RECRUIT_FOOD_COST + "必要）";
  S.player.resources.food -= CONFIG.RECRUIT_FOOD_COST;
  const chance = clamp(
    CONFIG.RECRUIT_BASE_CHANCE + CONFIG.RECRUIT_CHANCE_PER_LV_DIFF * (S.player.castleLevel - ai.castleLevel),
    0.15, 0.95);
  if (Math.random() < chance) {
    ai.allianceId = S.alliance.id;
    S.alliance.members.push({ id: ai.id, role: "一般" });
    toast(`🤝 ${ai.name} が同盟に加入しました！`);
  } else {
    ai.nextRecruitAt = now() + CONFIG.RECRUIT_COOLDOWN_SEC * 1000;
    toast(`😔 ${ai.name} に断られました（成功率${Math.round(chance * 100)}%）`);
  }
  return null;
}
function setMemberRole(memberId, role) {
  const m = S.alliance.members.find(m => m.id === memberId);
  if (m && m.role !== "盟主") m.role = role;
}

/* =====================================================================
 * [S12] AI USERS — ルールベース状態機械
 *
 * 各AIは nextActionAt が来たら1アクションだけ実行して次回時刻を再設定。
 * personality:
 *   expander : 20-60秒ごとに隣接未所有タイルを1枚claim
 *   balanced : 60-180秒ごとに 拡張50% / 城Lvアップ50%
 *   turtle   : 120-300秒ごとに城Lvアップのみ
 * 制約: プレイヤー領有タイル・城・聖地は奪わない（対人戦は未実装）。
 * ===================================================================*/
const AI_ACTION_INTERVALS = { expander: [20, 60], balanced: [60, 180], turtle: [120, 300] };

function aiExpand(ai) {
  // AI領土（城＋領有タイル）に隣接する未所有タイルを収集
  const seeds = [idx(ai.x, ai.y), ...ai.ownedTiles];
  const candidates = [];
  for (const si of seeds) {
    const st = S.world.tiles[si];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = st.x + dx, ny = st.y + dy;
      if (!inBounds(nx, ny)) continue;
      const ti = idx(nx, ny);
      const t = S.world.tiles[ti];
      if (t.ownerId || t.type === "castle" || t.type === "holy") continue;
      if (t.level > ai.castleLevel + 1) continue; // 分不相応なタイルは取らない
      candidates.push(ti);
    }
  }
  if (candidates.length) {
    const ti = pick(candidates);
    S.world.tiles[ti].ownerId = ai.id;
    ai.ownedTiles.push(ti);
  }
}
function aiGrow(ai) {
  if (ai.castleLevel < 10) {
    ai.castleLevel++;
    S.world.tiles[idx(ai.x, ai.y)].level = ai.castleLevel;
  }
}
function aiTickAll(t) {
  for (const ai of S.aiUsers) {
    if (t < ai.nextActionAt) continue;
    const [lo, hi] = AI_ACTION_INTERVALS[ai.personality];
    ai.nextActionAt = t + randInt(lo, hi) * 1000;
    if (ai.personality === "expander") aiExpand(ai);
    else if (ai.personality === "turtle") aiGrow(ai);
    else Math.random() < 0.5 ? aiExpand(ai) : aiGrow(ai);
  }
}

/* =====================================================================
 * [S13] UI: PANELS — 各タブのDOM描画
 * 描画方針: 毎秒 renderHeader + アクティブタブのみ再描画。
 * 同盟タブはselect操作を壊さないよう、イベント時のみ再描画。
 * ===================================================================*/
let activeTab = "map";

function renderHeader() {
  const cap = getStorageCap();
  const per = getProdPerHour();
  $("header").innerHTML =
    RES_KEYS.map(k =>
      `<span class="res">${RES_DEFS[k].emoji}<b>${fmt(S.player.resources[k])}</b></span>`).join("") +
    `<span class="res">💎<b>${fmt(S.player.diamonds)}</b> <span class="dim small">+${fmt(per.diamonds)}/h</span></span>`;
}

/* 城タブ本体。箱庭ビューの構築/ドラッグ/強化シートは [S17] に置く。
 * 毎tickの全再構築はチラつき・ドラッグ破壊を招くため、citySignature が一致する
 * 間は updateCityLive（数値とカウントダウンのみ）に切り替える。 */
function renderCity() {

/* =====================================================================
 * [S14] UI: MAP CANVAS — 描画・パン/ズーム/タップ
 * ===================================================================*/
const MapView = {
  canvas: null, ctx: null,
  zoom: 1,               // 1 = 基準タイルサイズ22px
  baseTile: 22,
  offsetX: 0, offsetY: 0, // マップ原点の画面座標(px)
  get tilePx() { return this.baseTile * this.zoom; },

  init() {
    this.canvas = $("mapCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.pendingCenter = [CENTER, CENTER]; // 初回の有効サイズ確定時に自城へ中心合わせ
    this.fit();
    window.addEventListener("resize", () => { this.fit(); this.draw(); });
    // --- パン＆タップ（Pointer Events） ---
    let down = null, moved = false;
    this.canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, ox: this.offsetX, oy: this.offsetY }; moved = false; });
    this.canvas.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
      if (moved) { this.offsetX = down.ox + dx; this.offsetY = down.oy + dy; this.draw(); }
    });
    this.canvas.addEventListener("pointerup", e => {
      if (down && !moved) this.tap(e.clientX, e.clientY);
      down = null;
    });
    this.canvas.addEventListener("pointercancel", () => { down = null; });
    $("zoomIn").onclick = () => { this.setZoom(this.zoom * 1.3); };
    $("zoomOut").onclick = () => { this.setZoom(this.zoom / 1.3); };
    $("zoomHome").onclick = () => { this.centerOn(CENTER, CENTER); this.draw(); };
  },
  fit() {
    const r = this.canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = r.width * dpr;
    this.canvas.height = r.height * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.vw = r.width; this.vh = r.height;
    // 起動直後はレイアウト未確定で幅0のことがある。初回の有効サイズで中心合わせ
    if (this.pendingCenter && this.vw > 0) {
      this.centerOn(this.pendingCenter[0], this.pendingCenter[1]);
      this.pendingCenter = null;
    }
  },
  setZoom(z) {
    // 画面中央を基準にズーム
    const cx = this.vw / 2, cy = this.vh / 2;
    const wx = (cx - this.offsetX) / this.tilePx, wy = (cy - this.offsetY) / this.tilePx;
    this.zoom = clamp(z, 0.4, 3);
    this.offsetX = cx - wx * this.tilePx;
    this.offsetY = cy - wy * this.tilePx;
    this.draw();
  },
  centerOn(x, y) {
    this.offsetX = this.vw / 2 - (x + 0.5) * this.tilePx;
    this.offsetY = this.vh / 2 - (y + 0.5) * this.tilePx;
  },
  tap(cx, cy) {
    const rect = this.canvas.getBoundingClientRect();
    const x = Math.floor((cx - rect.left - this.offsetX) / this.tilePx);
    const y = Math.floor((cy - rect.top - this.offsetY) / this.tilePx);
    if (inBounds(x, y)) openTileSheet(idx(x, y));
  },
  draw() {
    if (!S) return;
    const ctx = this.ctx, ts = this.tilePx;
    ctx.clearRect(0, 0, this.vw, this.vh);
    // 可視範囲のタイルのみ描画
    const x0 = clamp(Math.floor(-this.offsetX / ts), 0, SIZE - 1);
    const y0 = clamp(Math.floor(-this.offsetY / ts), 0, SIZE - 1);
    const x1 = clamp(Math.ceil((this.vw - this.offsetX) / ts), 0, SIZE);
    const y1 = clamp(Math.ceil((this.vh - this.offsetY) / ts), 0, SIZE);
    ctx.font = `${Math.floor(ts * 0.62)}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        const t = S.world.tiles[idx(x, y)];
        const px = this.offsetX + x * ts, py = this.offsetY + y * ts;
        // 地色（レベルが高いほど明るく）
        ctx.fillStyle = TILE_DEFS[t.type].color;
        ctx.fillRect(px, py, ts - 1, ts - 1);
        if (t.level > 1 && t.type !== "castle") {
          ctx.fillStyle = `rgba(255,255,255,${(t.level - 1) * 0.045})`;
          ctx.fillRect(px, py, ts - 1, ts - 1);
        }
        // 所有者の縁取り
        if (t.ownerId) {
          ctx.strokeStyle = t.ownerId === "player" ? "#e8b84a" :
            (S.aiUsers.find(a => a.id === t.ownerId) || {}).color || "#888";
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 1, py + 1, ts - 3, ts - 3);
        }
        // アイコン（ズームが小さい時は省略）
        if (ts >= 13 && TILE_DEFS[t.type].emoji) {
          ctx.fillStyle = "#fff";
          ctx.fillText(TILE_DEFS[t.type].emoji, px + ts / 2, py + ts / 2 + 1);
        }
      }
    }
    // 出兵ラインと部隊ドット
    const t0 = now();
    for (const m of S.player.marches) {
      const tt = S.world.tiles[m.targetIdx];
      const sx = this.offsetX + (CENTER + 0.5) * ts, sy = this.offsetY + (CENTER + 0.5) * ts;
      const ex = this.offsetX + (tt.x + 0.5) * ts, ey = this.offsetY + (tt.y + 0.5) * ts;
      const p = clamp((t0 - m.departAt) / (m.arriveAt - m.departAt), 0, 1);
      ctx.strokeStyle = "rgba(232,184,74,.6)"; ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#e8b84a";
      ctx.beginPath(); ctx.arc(sx + (ex - sx) * p, sy + (ey - sy) * p, 5, 0, Math.PI * 2); ctx.fill();
    }
    // 情報バー
    const march = S.player.marches[0];
    $("mapInfo").textContent = march
      ? `⚔️ 出兵中… 到着まで ${fmtSec((march.arriveAt - t0) / 1000)}`
      : `領地 ${S.player.ownedTiles.length}枚 ｜ 戦力 ${fmt(getArmyPower())} ｜ タイルをタップで詳細`;
  },
};

/** タイル詳細ボトムシートを開く */
function openTileSheet(ti) {
  const t = S.world.tiles[ti];
  const td = TILE_DEFS[t.type];
  const ai = t.ownerId && t.ownerId !== "player" ? S.aiUsers.find(a => a.id === t.ownerId) : null;
  const ownerText = t.ownerId === "player" ? "あなたの領地" : ai ? `${ai.name} の領地` : "未所有";
  let body = `<h3>${td.emoji} ${td.name} Lv${t.level} <span class="dim small">(${t.x}, ${t.y})</span></h3>
    <div class="dim small">${ownerText}</div>`;
  const actions = [];
  if (t.type === "castle" && ai) {
    // AI城: 勧誘UI
    body += `<div class="small" style="margin-top:6px">城Lv${ai.castleLevel} ｜ 性格: ${
      { expander: "拡張志向", balanced: "バランス型", turtle: "内政重視" }[ai.personality]}
      ｜ ${ai.allianceId ? "🤝 同盟員" : ai.recruitable ? "✅ 勧誘可能" : "❌ 勧誘不可"}</div>`;
    if (ai.recruitable && !ai.allianceId) {
      actions.push(`<button class="primary" onclick="UIA.recruit('${ai.id}')">🤝 勧誘する（🌾${CONFIG.RECRUIT_FOOD_COST}）</button>`);
    }
  } else if (t.ownerId === "player" && t.type !== "castle") {
    actions.push(`<button class="danger" onclick="UIA.abandon(${ti})">🏳️ 放棄する</button>`);
  } else if (t.ownerId !== "player" && t.type !== "castle") {
    const def = getTileDefense(ti);
    const power = getArmyPower();
    const resInfo = RES_KEYS.includes(t.type)
      ? `制圧すると ${RES_DEFS[t.type].emoji}+${fmt(CONFIG.TILE_PROD_PER_LEVEL_PER_HOUR * t.level)}/h`
      : t.type === "holy" ? "🎉 制圧すると勝利条件達成！" : "制圧すると領地が広がる";
    body += `<div class="small" style="margin-top:6px">防御力 ${fmt(def)} ｜ 自軍戦力 ${fmt(power)} ${power >= def ? "✅" : "⚠️戦力不足"}<br>${resInfo}<br>💎ボーナス +${CONFIG.DIAMOND_CAPTURE_BONUS_PER_LEVEL * t.level}</div>`;
    actions.push(`<button class="primary" onclick="UIA.march(${ti})">⚔️ 出兵する（🌾${CONFIG.MARCH_FOOD_COST}）</button>`);
  }
  actions.push(`<button onclick="closeSheet()">閉じる</button>`);
  $("sheet").innerHTML = body + `<div class="actions">${actions.join("")}</div>`;
  $("sheet").classList.add("open");
}
function closeSheet() { $("sheet").classList.remove("open"); openBuildingType = null; }

/* =====================================================================
 * [S17] UI: CITY PLOT — 城タブの箱庭ビュー（ドラッグ配置・タップ強化）
 * 方針: 建物を絶対配置のDOMノードとして城グリッドに並べる。ドラッグで再配置し
 *      座標は S.player.buildings[].x/y に保存、タップでボトムシート強化。
 *      レベルから tier(1-3) を算出し外観（サイズ/装飾/グロー）を変える。
 * ===================================================================*/
let citySig = "";            // 全再構築要否の判定用（[S13] renderCity が参照）
let openBuildingType = null; // 強化シートを開いている建物type（closeSheetでnull）
const TIER_LABEL = ["", "初級", "中級", "上級"];

/** レベル→外観ティア(1..3) */
function buildingTier(level) {
  const [t2, t3] = CONFIG.CITY_TIER_UP;
  return level >= t3 ? 3 : level >= t2 ? 2 : 1;
}
/** グリッドセル(col,row) → 中心の%位置 */
function cellToPct(col, row) {
  return { left: (col + 0.5) / CONFIG.CITY_COLS * 100, top: (row + 0.5) / CONFIG.CITY_ROWS * 100 };
}
/** 0..1相対座標 → 最寄りグリッドセル */
function pctToCell(fx, fy) {
  return {
    col: clamp(Math.floor(fx * CONFIG.CITY_COLS), 0, CONFIG.CITY_COLS - 1),
    row: clamp(Math.floor(fy * CONFIG.CITY_ROWS), 0, CONFIG.CITY_ROWS - 1),
  };
}
/** (col,row)が他建物と重なる場合、渦巻き探索で最寄りの空きセルを返す */
function nearestFreeCell(col, row, exceptType) {
  const occ = new Set(S.player.buildings.filter(b => b.type !== exceptType).map(b => b.x + "," + b.y));
  if (!occ.has(col + "," + row)) return { col, row };
  const maxR = Math.max(CONFIG.CITY_COLS, CONFIG.CITY_ROWS);
  for (let r = 1; r < maxR; r++) {
    for (let dc = -r; dc <= r; dc++) for (let dr = -r; dr <= r; dr++) {
      const c = col + dc, rr = row + dr;
      if (c < 0 || rr < 0 || c >= CONFIG.CITY_COLS || rr >= CONFIG.CITY_ROWS) continue;
      if (!occ.has(c + "," + rr)) return { col: c, row: rr };
    }
  }
  return { col, row };
}

/** 上部サマリー（build時・updateCityLive時 共用） */
function citySummaryHTML() {
  const per = getProdPerHour();
  return `<h3>🏯 本城 Lv${S.player.castleLevel} ｜ 部隊戦力 ${fmt(getArmyPower())}</h3>
    <div class="dim small">毎時 ${RES_KEYS.map(k => RES_DEFS[k].emoji + fmt(per[k])).join(" ")} 💎${fmt(per.diamonds)}
    ｜ 倉庫容量 ${fmt(getStorageCap())}</div>`;
}
/** tick用の署名。type/level/強化中・本城Lvが変われば全再構築（それ以外は軽量更新） */
function citySignature() {
  return S.player.buildings.map(b => b.type + ":" + b.level + (b.upgradeEndsAt ? "U" : "")).join("|")
    + "#" + S.player.castleLevel;
}
/** 建物1つぶんのDOM文字列 */
function cityNodeHTML(b) {
  const def = BUILDING_DEFS[b.type];
  const tier = buildingTier(b.level);
  const pos = cellToPct(b.x ?? 0, b.y ?? 0);
  const cls = "bld tier-" + tier + (b.type === "castle" ? " big" : "") + (b.upgradeEndsAt ? " upgrading" : "");
  const status = b.upgradeEndsAt ? "⏳" + fmtSec((b.upgradeEndsAt - now()) / 1000)
    : (b.level >= def.maxLevel ? "MAX" : "");
  return `<div class="${cls}" data-type="${b.type}" style="left:${pos.left}%;top:${pos.top}%">
      <div class="bld-flags">${"★".repeat(tier)}</div>
      <div class="bld-icon">${artHTML(artTierKey(def.imageKey, b.level), def.emoji)}</div>
      <div class="bld-plat"></div>
      <div class="bld-lv">Lv${b.level}</div>
      <div class="bld-status" id="st-${b.type}">${status}</div></div>`;
}
/** 全建物ノードにドラッグ（移動）＋タップ（強化）を付与 */
function cityAttachDrag() {
  const plot = $("cityPlot");
  if (!plot) return;
  plot.querySelectorAll(".bld").forEach(node => {
    const type = node.dataset.type;
    let sx = 0, sy = 0, moved = false, capId = null;
    node.addEventListener("pointerdown", e => {
      e.preventDefault();
      moved = false; sx = e.clientX; sy = e.clientY; capId = e.pointerId;
      node.setPointerCapture(capId); node.classList.add("dragging");
    });
    node.addEventListener("pointermove", e => {
      if (capId === null) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
      if (moved) {
        const r = plot.getBoundingClientRect();
        const fx = clamp((e.clientX - r.left) / r.width, 0.05, 0.95);
        const fy = clamp((e.clientY - r.top) / r.height, 0.07, 0.93);
        node.style.left = fx * 100 + "%"; node.style.top = fy * 100 + "%";
      }
    });
    const end = () => {
      if (capId === null) return;
      try { node.releasePointerCapture(capId); } catch (_) {}
      capId = null; node.classList.remove("dragging");
      if (!moved) { openBuildingSheet(type); return; }   // 動かなければタップ扱い
      const fx = parseFloat(node.style.left) / 100, fy = parseFloat(node.style.top) / 100;
      const cell = pctToCell(fx, fy);
      const free = nearestFreeCell(cell.col, cell.row, type);
      const b = getBuilding(type); b.x = free.col; b.y = free.row;
      const p = cellToPct(free.col, free.row);
      node.style.left = p.left + "%"; node.style.top = p.top + "%";
      saveGame();
    };
    node.addEventListener("pointerup", end);
    node.addEventListener("pointercancel", end);
  });
}
/** 建物の強化ボトムシート（既存 #sheet を再利用） */
function openBuildingSheet(type) {
  openBuildingType = type;
  const b = getBuilding(type), def = BUILDING_DEFS[type], t = now();
  const tier = buildingTier(b.level);
  const prod = def.prodType ? `${RES_DEFS[def.prodType].emoji}${fmt(def.prodBase * b.level)}/h 生産` : def.desc;
  let body = `<h3>${artHTML(artTierKey(def.imageKey, b.level), def.emoji)} ${def.name}
      <span class="dim small">Lv${b.level}・${TIER_LABEL[tier]}${"★".repeat(tier)}</span></h3>
    <div class="dim small" style="margin-top:4px">${prod}</div>`;
  const actions = [];
  if (b.upgradeEndsAt) {
    body += `<div class="small" id="sheetCountdown" style="margin-top:8px;color:var(--accent)">⏳ 完成まで ${fmtSec((b.upgradeEndsAt - t) / 1000)}</div>`;
  } else if (b.level >= def.maxLevel) {
    body += `<div class="small" style="margin-top:8px">最大レベルに到達しています</div>`;
  } else {
    const cost = getUpgradeCost(b);
    const gated = type !== "castle" && b.level >= S.player.castleLevel;
    const tierUp = buildingTier(b.level + 1) > tier
      ? `<br><span style="color:var(--accent)">✨ 外観が${TIER_LABEL[buildingTier(b.level + 1)]}に育ちます</span>` : "";
    body += `<div class="small" style="margin-top:8px">Lv${b.level + 1}へ ｜ ${fmtCost(cost)} ｜ ${fmtSec(getUpgradeTimeSec(b))}${
      gated ? `<br><span style="color:var(--danger)">要 本城Lv${b.level + 1}</span>` : ""}${tierUp}</div>`;
    actions.push(`<button class="primary" ${(!canAfford(cost) || gated) ? "disabled" : ""} onclick="UIA.upgrade('${type}')">⬆ アップグレード</button>`);
  }
  actions.push(`<button onclick="closeSheet()">閉じる</button>`);
  $("sheet").innerHTML = body + `<div class="actions">${actions.join("")}</div>`;
  $("sheet").classList.add("open");
}
/** 毎tickの軽量更新（DOM再構築なし）: サマリー数値・強化中カウントダウン */
function updateCityLive() {
  const sum = $("citySummary"); if (sum) sum.innerHTML = citySummaryHTML();
  const t = now();
  for (const b of S.player.buildings) {
    const st = $("st-" + b.type);
    if (st) st.textContent = b.upgradeEndsAt ? "⏳" + fmtSec((b.upgradeEndsAt - t) / 1000)
      : (b.level >= BUILDING_DEFS[b.type].maxLevel ? "MAX" : "");
  }
  if (openBuildingType) {
    const b = getBuilding(openBuildingType), cd = $("sheetCountdown");
    if (cd && b && b.upgradeEndsAt) cd.textContent = "⏳ 完成まで " + fmtSec((b.upgradeEndsAt - t) / 1000);
  }
}

/* =====================================================================
 * [S16] GAME LOOP & BOOT
 * ===================================================================*/
function renderActiveTab() {
  if (activeTab === "map") MapView.draw();
  else if (activeTab === "city") renderCity();
  else if (activeTab === "cards") renderCards();
  else if (activeTab === "gacha") renderGacha();
  else if (activeTab === "alliance") renderAlliance();
}
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-page").forEach(p => p.classList.toggle("active", p.id === "page-" + tab));
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  closeSheet();
  if (tab === "map") MapView.fit();
  renderActiveTab();
}

/* tickの全再描画がタップ中のボタンを破壊して click を飲み込むのを防ぐ:
 * ポインタが押されている間は再描画をスキップする（clickはpointerupの直後に
 * 発火し、次のtickまでDOMは無傷なので取りこぼさない） */
let pointerHeld = false;
window.addEventListener("pointerdown", () => { pointerHeld = true; }, true);
window.addEventListener("pointerup", () => { pointerHeld = false; }, true);
window.addEventListener("pointercancel", () => { pointerHeld = false; }, true);

/** メインtick（1秒ごと）。dtは実測で計算するためタブ復帰時も破綻しない */
function tick() {
  const t = now();
  const dtSec = clamp((t - S.lastTickAt) / 1000, 0, CONFIG.OFFLINE_CAP_HOURS * 3600);
  S.lastTickAt = t;
  applyEconomy(dtSec);
  finishUpgrades(t);
  resolveMarches(t);
  aiTickAll(t);
  renderHeader();
  // 同盟タブはselect操作保護のため、またタップ中はclick保護のため再描画しない
  if (activeTab !== "alliance" && !pointerHeld) renderActiveTab();
}

async function boot() {
  await AssetDB.open();
  await AssetDB.loadAll();
  S = loadGame() || newGameState();
  if (S.flags.holyWon) $("winBanner").classList.add("show");
  MapView.init();
  grantOfflineGains();
  S.lastTickAt = now();
  renderHeader();
  MapView.draw();
  // タブバー
  document.querySelectorAll("#tabbar button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  // ループ＆自動保存
  setInterval(tick, CONFIG.TICK_MS);
  setInterval(saveGame, CONFIG.AUTOSAVE_MS);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });
  // Service Worker（http(s)配信時のみ。file://ではスキップ）
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW registration failed", e));
  }
}
boot();
</script>
